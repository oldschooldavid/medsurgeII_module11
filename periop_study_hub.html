<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perioperative Nursing — Study Hub</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap');

:root{
  --bg:#fafafa; --surf:#ffffff; --surf2:#f5f5f5;
  --tx:#111111; --tx2:#444444; --tx3:#999999;
  --bd:#e5e5e5; --acc:#111111;
  --hy-r:#b3261e; --hy-b:#1a56b0; --hy-g:#1a7a3c; --hy-p:#6b3fa0; --hy-a:#8a5a00;
  --stripe1:#8b2e2e; --stripe2:#2e6b3e; --stripe3:#1e3a5f; --stripe4:#6b4423; --stripe5:#5a3070;
}
[data-theme="dark"]{
  --bg:#0f0f0f; --surf:#1a1a1a; --surf2:#171717;
  --tx:#f0f0f0; --tx2:#c4c4c4; --tx3:#8a8a8a;
  --bd:#2c2c2c; --acc:#f0f0f0;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0; background:var(--bg); color:var(--tx);
  font-family:'Inter',sans-serif; font-size:15px; line-height:1.55;
  transition:background .2s,color .2s;
}
h1,h2,h3,h4{font-family:'Syne',sans-serif; font-weight:800; margin:0 0 .5em; letter-spacing:-.01em;}
code,.mono,input,select,button,.badge,.pill{font-family:'IBM Plex Mono',monospace;}
a{color:var(--tx);}
button{cursor:pointer; font-size:.85rem;}

/* Header */
header{
  position:sticky; top:0; z-index:50; background:var(--surf);
  border-bottom:1px solid var(--bd); padding:10px 16px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
header h1{font-size:1.15rem; margin:0; flex-shrink:0;}
.hdr-mastery{font-family:'IBM Plex Mono',monospace; font-size:.72rem; color:var(--tx2); display:flex; align-items:center; gap:6px;}
.mastery-track{width:90px; height:6px; background:var(--surf2); border:1px solid var(--bd); border-radius:2px; overflow:hidden;}
.mastery-fill{height:100%; background:var(--acc);}
.hdr-actions{margin-left:auto; display:flex; gap:6px; align-items:center;}
.icon-btn{
  background:transparent; border:1px solid var(--bd); color:var(--tx);
  border-radius:4px; width:32px; height:32px; display:flex; align-items:center; justify-content:center;
  font-size:1rem;
}
.icon-btn:hover{opacity:.7;}
.due-badge{font-size:.68rem; border:1px solid var(--bd); border-radius:2px; padding:2px 6px; color:var(--tx2);}
.due-badge.hasdue{background:var(--tx); color:var(--bg); border-color:var(--tx);}

/* Search */
.search-wrap{position:relative;}
.search-input{
  background:var(--surf2); border:1px solid var(--bd); color:var(--tx);
  border-radius:4px; padding:6px 10px; font-size:.8rem; width:170px;
}
.search-results{
  position:absolute; top:110%; right:0; width:280px; max-height:340px; overflow:auto;
  background:var(--surf); border:1px solid var(--bd); border-radius:4px; display:none; z-index:60;
}
.search-results.show{display:block;}
.search-item{padding:8px 10px; border-bottom:1px solid var(--bd); font-size:.78rem; cursor:pointer;}
.search-item:hover{background:var(--surf2);}
.search-item .tabname{color:var(--tx3); font-size:.65rem; text-transform:uppercase; letter-spacing:.03em;}

/* Tab nav */
.tabnav-wrap{display:flex; align-items:center; border-bottom:1px solid var(--bd); background:var(--surf);}
.tabnav-arrow{background:none; border:none; color:var(--tx); font-size:1rem; padding:8px 6px; flex-shrink:0;}
.tabnav-arrow.dim{opacity:.25; pointer-events:none;}
.tabnav{display:flex; overflow-x:auto; scrollbar-width:none; flex:1;}
.tabnav::-webkit-scrollbar{display:none;}
.tabbtn{
  flex-shrink:0; background:none; border:none; color:var(--tx2);
  padding:12px 14px; font-family:'IBM Plex Mono',monospace; font-size:.76rem;
  border-bottom:2px solid transparent; white-space:nowrap;
}
.tabbtn.active{color:var(--tx); border-bottom-color:var(--tx); font-weight:600;}

main{max-width:1100px; margin:0 auto; padding:20px 16px 80px;}
.tabpanel{display:none;}
.tabpanel.active{display:block;}

/* Quick hits strip */
.qh-strip{
  background:var(--tx); color:var(--bg); border-left:2px solid var(--tx);
  padding:12px 16px; margin-bottom:18px; border-radius:4px;
}
[data-theme="dark"] .qh-strip{background:#f0f0f0; color:#0f0f0f;}
.qh-strip .qh-title{font-size:.68rem; text-transform:uppercase; letter-spacing:.05em; opacity:.7; margin-bottom:6px;}
.qh-strip ul{margin:0; padding-left:18px; font-family:'IBM Plex Mono',monospace; font-size:.78rem; line-height:1.8;}

/* Cards */
.card{
  background:var(--surf); border:1px solid var(--bd); border-left:3px solid var(--stripe1);
  border-radius:4px; padding:14px 16px; margin-bottom:12px; position:relative;
  transition:border-left-color .15s;
}
.card.flagged{border-color:var(--hy-r); border-left-color:var(--hy-r);}
.card-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:6px;}
.card-title{font-family:'Syne',sans-serif; font-weight:800; font-size:1rem; margin:0;}
.card-body p{margin:.4em 0;}
.card-body ul{margin:.3em 0; padding-left:20px;}
.card-actions{display:flex; gap:6px; align-items:center; flex-shrink:0;}
.card-badges{display:flex; gap:6px; flex-wrap:wrap; margin-top:8px;}

.flag-btn{background:none; border:1px solid var(--bd); border-radius:4px; padding:3px 7px; font-size:.85rem; color:var(--tx2);}
.flag-btn.on{color:var(--hy-r); border-color:var(--hy-r);}
.sum-btn{background:none; border:1px solid var(--bd); border-radius:4px; padding:3px 8px; font-size:.68rem; color:var(--tx2);}

.badge{border:1px solid var(--bd); border-radius:2px; padding:1px 6px; font-size:.64rem; display:inline-block;}
.badge.due{background:var(--tx); color:var(--bg); border-color:var(--tx);}
.badge.soon{border-color:var(--tx3); color:var(--tx2);}
.badge.ok{border:none; color:var(--tx3);}
.badge.viewed{color:var(--tx3); border-color:var(--tx3);}
.badge.never{color:var(--tx3); border-style:dashed;}
.badge.hy{border-color:var(--hy-r); color:var(--hy-r); font-weight:600;}
.badge.mk{border-color:var(--hy-a); color:var(--hy-a);}

.hy-stamp{border:1px solid var(--hy-r); color:var(--hy-r); font-size:.62rem; padding:2px 6px; border-radius:2px; font-weight:700; letter-spacing:.03em;}

/* Alerts */
.alert{border-left:2px solid var(--tx3); padding:8px 12px; margin:10px 0; border-radius:0; font-size:.85rem;}
.alert.red{border-color:var(--hy-r); background:rgba(179,38,30,.05);}
.alert.blue{border-color:var(--hy-b); background:rgba(26,86,176,.05);}
.alert.green{border-color:var(--hy-g); background:rgba(26,122,60,.05);}
.alert.mnemonic{border-color:var(--hy-p); background:rgba(107,63,160,.05);}
.alert.prof{border-color:var(--hy-a); background:rgba(138,90,0,.05);}
.alert-label{font-size:.65rem; text-transform:uppercase; letter-spacing:.04em; font-weight:700; margin-bottom:3px; font-family:'IBM Plex Mono',monospace;}

/* Lab tables */
table{width:100%; border-collapse:collapse; margin:10px 0; font-size:.82rem;}
th,td{text-align:left; padding:6px 8px; border-bottom:1px solid var(--bd);}
th{font-family:'IBM Plex Mono',monospace; font-size:.68rem; text-transform:uppercase; color:var(--tx3);}
.rangebadge{font-family:'IBM Plex Mono',monospace; background:rgba(26,122,60,.1); color:var(--hy-g); border:1px solid var(--hy-g); border-radius:2px; padding:1px 6px; font-size:.72rem;}
.critbadge{font-family:'IBM Plex Mono',monospace; background:rgba(179,38,30,.1); color:var(--hy-r); border:1px solid var(--hy-r); border-radius:2px; padding:1px 6px; font-size:.72rem;}

/* Mind map toggle */
.mm-toggle{background:var(--surf2); border:1px solid var(--bd); border-radius:4px; padding:6px 12px; font-size:.75rem; margin:14px 0 6px;}
.mm-container{display:none; border:1px solid var(--bd); border-radius:4px; padding:14px; margin-bottom:14px; background:var(--surf); overflow-x:auto;}
.mm-container.show{display:block;}
.mm-center{background:var(--tx); color:var(--bg); border-radius:3px; padding:10px 16px; font-weight:800; font-family:'Syne',sans-serif; display:inline-block; margin-bottom:12px;}
.mm-branch{margin:6px 0; border:1px solid var(--bd); border-radius:4px;}
.mm-branch-head{padding:8px 12px; font-family:'IBM Plex Mono',monospace; font-size:.78rem; font-weight:600; display:flex; justify-content:space-between; cursor:pointer;}
.mm-branch-body{display:none; padding:0 14px 10px; font-size:.82rem;}
.mm-branch-body.open{display:block;}
.mm-branch-body ul{margin:6px 0; padding-left:18px;}

/* Drug cards */
.drug-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:14px; margin-top:14px;}
.drug-flip{perspective:1200px; height:220px;}
.drug-flip-inner{position:relative; width:100%; height:100%; transition:transform .5s; transform-style:preserve-3d; cursor:pointer;}
.drug-flip.flipped .drug-flip-inner{transform:rotateY(180deg);}
.drug-face{position:absolute; inset:0; backface-visibility:hidden; border:1px solid var(--bd); border-radius:4px; padding:12px; overflow:auto;}
.drug-front{background:var(--surf);}
.drug-back{background:#111; color:#fff; transform:rotateY(180deg);}
[data-theme="dark"] .drug-back{background:#000;}
.drug-back .seclabel{font-family:'IBM Plex Mono',monospace; font-size:.6rem; text-transform:uppercase; letter-spacing:.05em; opacity:.55; margin-top:8px;}
.drug-back .secval{font-size:.74rem; margin:2px 0 6px;}
.drug-back .contra{color:#ff8a80;}
.drug-top-actions{position:absolute; top:8px; right:8px; display:flex; gap:4px; z-index:5;}
.mini-btn{background:rgba(0,0,0,.4); color:#fff; border:none; border-radius:3px; width:22px; height:22px; font-size:.7rem;}
.drug-front .mini-btn{background:var(--surf2); color:var(--tx); border:1px solid var(--bd);}
.classbadge{display:inline-block; border:1px solid var(--bd); border-radius:2px; padding:1px 6px; font-size:.62rem; margin-bottom:6px; font-family:'IBM Plex Mono',monospace;}
.filterbar{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px;}
.filterbtn{background:var(--surf2); border:1px solid var(--bd); border-radius:4px; padding:5px 10px; font-size:.72rem;}
.filterbtn.active{background:var(--tx); color:var(--bg); border-color:var(--tx);}

/* Buttons */
.btn{background:#111; color:#fff; border:none; border-radius:4px; padding:8px 16px; font-size:.82rem; font-family:'Inter',sans-serif; font-weight:600;}
.btn:hover{opacity:.85;}
[data-theme="dark"] .btn{background:#f0f0f0; color:#0f0f0f;}
.btn.secondary{background:transparent; color:var(--tx); border:1px solid var(--bd);}
.btn.danger{background:var(--hy-r); color:#fff;}
select,.txtinput{background:var(--surf); border:1px solid var(--bd); color:var(--tx); border-radius:4px; padding:6px 8px; font-size:.78rem;}
label.flabel{font-size:.68rem; text-transform:uppercase; color:var(--tx3); display:block; margin-bottom:3px; letter-spacing:.03em;}

/* Popup modal */
.popup-overlay{position:fixed; inset:0; background:rgba(0,0,0,.4); display:none; align-items:center; justify-content:center; z-index:200;}
.popup-overlay.show{display:flex;}
.popup-box{background:var(--surf); border:1px solid var(--bd); border-radius:4px; max-width:440px; width:92%; max-height:70vh; overflow:auto; padding:18px 20px; position:relative;}
.popup-box.popup-wide{max-width:720px; max-height:82vh;}
@media (max-width:600px){.popup-box.popup-wide{max-width:94vw; max-height:88vh;}}
.popup-close{position:absolute; top:10px; right:12px; background:none; border:none; font-size:1.1rem; color:var(--tx2);}
.popup-title{font-family:'Syne',sans-serif; font-weight:800; margin-bottom:10px; padding-right:20px;}
.spinner{width:22px; height:22px; border:2px solid var(--bd); border-top:2px solid var(--tx); border-radius:50%; animation:spin .8s linear infinite; margin:20px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
.expand-block{margin-bottom:14px;}
.expand-block .seclabel{font-family:'IBM Plex Mono',monospace; font-size:.68rem; text-transform:uppercase; letter-spacing:.04em; color:var(--tx3); margin-bottom:3px;}
.expand-block .secval{font-size:1rem; line-height:1.6;}

/* Quiz */
.filterrow{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px; align-items:flex-end;}
.qcard{background:var(--surf); border:1px solid var(--bd); border-radius:4px; padding:16px; margin-bottom:14px;}
.qstem{font-weight:600; margin-bottom:10px;}
.qopt{display:block; width:100%; text-align:left; background:var(--surf2); border:1px solid var(--bd); border-radius:4px; padding:8px 12px; margin-bottom:6px; color:var(--tx); font-family:'Inter',sans-serif; font-size:.85rem;}
.qopt.correct{border-color:var(--hy-g); background:rgba(26,122,60,.1);}
.qopt.incorrect{border-color:var(--hy-r); background:rgba(179,38,30,.1);}
.qopt:disabled{opacity:.85;}
.rationale{margin-top:10px; padding:10px 12px; background:var(--surf2); border-radius:4px; font-size:.82rem;}
.rationale .expl{margin-top:4px; padding-left:12px; border-left:2px solid var(--bd);}
.next-btn{margin-top:12px;}
.progressbar{height:6px; background:var(--surf2); border:1px solid var(--bd); border-radius:2px; overflow:hidden; margin-bottom:14px;}
.progressbar-fill{height:100%; background:var(--tx);}

/* Dashboard */
.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:20px;}
.stat-card{border:1px solid var(--bd); border-radius:4px; padding:14px; background:transparent;}
.stat-card .num{font-family:'Syne',sans-serif; font-weight:800; font-size:1.6rem;}
.stat-card .lbl{font-size:.68rem; color:var(--tx3); text-transform:uppercase; letter-spacing:.03em;}
.srsbanner{background:var(--tx); color:var(--bg); border-radius:4px; padding:12px 16px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;}
[data-theme="dark"] .srsbanner{background:#f0f0f0; color:#0f0f0f;}
.mbar-row{margin-bottom:8px;}
.mbar-label{display:flex; justify-content:space-between; font-size:.76rem; margin-bottom:2px;}
.mbar-track{height:8px; background:var(--surf2); border:1px solid var(--bd); border-radius:2px; overflow:hidden;}
.mbar-fill{height:100%;}
.sesstable{width:100%; font-size:.76rem;}
.weaksec{border:1px solid var(--bd); border-radius:4px; padding:10px 12px; margin-bottom:8px;}
.weakbadge{font-size:.62rem; padding:1px 6px; border:1px solid var(--bd); border-radius:2px;}

/* API key panel */
.apikeypanel{background:var(--surf2); border:1px solid var(--bd); border-radius:4px; padding:14px; margin-bottom:16px;}

/* Full source text */
.src-note{border:1px solid var(--bd); border-radius:4px; padding:12px 14px; margin-bottom:16px; font-size:.82rem; color:var(--tx2); background:var(--surf2);}
details.src-chapter{border:1px solid var(--bd); border-radius:4px; margin-bottom:10px; background:var(--surf);}
details.src-chapter summary{list-style:none; cursor:pointer; padding:10px 14px; font-family:'IBM Plex Mono',monospace; font-size:.82rem; font-weight:600; display:flex; align-items:center; gap:8px;}
details.src-chapter summary::-webkit-details-marker{display:none;}
details.src-chapter summary::before{content:'▸'; display:inline-block; width:14px;}
details.src-chapter[open] summary::before{content:'▾';}
.src-body{padding:0 16px 16px; font-size:.86rem; line-height:1.65;}
.src-body h4{font-size:.95rem; margin-top:14px;}
.src-body dl{margin:6px 0;}
.src-body dt{font-weight:700; margin-top:6px;}
.src-body dd{margin-left:0; color:var(--tx2);}

/* TOC */
.toc-fab{position:fixed; bottom:18px; right:18px; background:#111; color:#fff; border:none; border-radius:3px; padding:10px 14px; font-size:.78rem; z-index:80; font-family:'IBM Plex Mono',monospace;}
[data-theme="dark"] .toc-fab{background:#f0f0f0; color:#0f0f0f;}
.toc-drawer{position:fixed; bottom:60px; right:18px; width:280px; max-height:60vh; overflow:auto; background:var(--surf); border:1px solid var(--bd); border-radius:4px; display:none; z-index:80; padding:10px;}
.toc-drawer.show{display:block;}
.toc-tabhead{font-family:'IBM Plex Mono',monospace; font-size:.72rem; font-weight:700; padding:6px 4px; cursor:pointer; color:var(--tx);}
.toc-cardlink{font-size:.74rem; padding:4px 4px 4px 14px; cursor:pointer; color:var(--tx2);}
.toc-cardlink:hover{color:var(--tx);}

/* Explain this */
.explain-btn{position:absolute; background:#111; color:#fff; border:none; border-radius:4px; padding:5px 10px; font-size:.7rem; z-index:150; display:none;}
[data-theme="dark"] .explain-btn{background:#f0f0f0; color:#0f0f0f;}

/* Case sim */
.patientcard{background:#1e3a5f; color:#fff; border-radius:4px; padding:16px; margin-bottom:14px;}
[data-theme="dark"] .patientcard{background:#12233a;}
.adpiebar{display:flex; gap:4px; margin-bottom:14px; flex-wrap:wrap;}
.adpiestep{border:1px solid var(--bd); border-radius:2px; padding:4px 10px; font-size:.68rem; font-family:'IBM Plex Mono',monospace;}
.adpiestep.done{background:var(--hy-g); color:#fff; border-color:var(--hy-g);}
.adpiestep.active{background:#1e3a5f; color:#fff; border-color:#1e3a5f;}
.patientupdate{border-left:2px solid var(--hy-a); background:rgba(138,90,0,.06); padding:8px 12px; margin-bottom:10px; font-size:.82rem;}

.emsg{border-left:2px solid var(--hy-r); background:rgba(179,38,30,.06); padding:10px 12px; border-radius:0; font-size:.85rem;}
.rtybtn{margin-top:8px;}
.loadmsg{text-align:center; color:var(--tx3); font-size:.8rem; margin:10px 0;}

.emptynote{color:var(--tx3); font-size:.85rem; padding:20px; text-align:center;}

@media print{
  header,.tabnav-wrap,.toc-fab,.toc-drawer,.popup-overlay,.filterrow,.explain-btn{display:none !important;}
  .tabpanel{display:block !important; page-break-before:always;}
  .card,.drug-flip,.qcard{page-break-inside:avoid;}
  .drug-flip{height:auto; perspective:none;}
  .drug-flip-inner{position:static; transform:none !important;}
  .drug-face{position:static; backface-visibility:visible; margin-bottom:6px;}
  .drug-back{transform:none !important;}
  body{background:#fff; color:#000;}
}
@media (max-width:640px){
  header{gap:8px;} .hdr-mastery{display:none;}
  .search-input{width:120px;}
  main{padding:14px 10px 70px;}
}
</style>
</head>
<body>
<header>
  <h1>Perioperative Nursing Hub</h1>
  <div class="hdr-mastery">📈 <span id="hdr-mastery-txt">0%</span>
    <div class="mastery-track"><div class="mastery-fill" id="hdr-mastery-fill" style="width:0%"></div></div>
  </div>
  <div class="hdr-actions">
    <span class="due-badge" id="hdr-due-badge">📅 0 due</span>
    <div class="search-wrap">
      <input type="text" class="search-input" id="search-input" placeholder="🔍 Search cards...">
      <div class="search-results" id="search-results"></div>
    </div>
    <button class="icon-btn" id="theme-toggle" onclick="toggleTheme()" title="Toggle dark mode">◑</button>
    <button class="icon-btn" onclick="preparePrint()" title="Print / Save as PDF">🖨</button>
  </div>
</header>

<div class="tabnav-wrap">
  <button class="tabnav-arrow" id="nav-left" onclick="scrollNav(-1)">◀</button>
  <div class="tabnav" id="tabnav"></div>
  <button class="tabnav-arrow" id="nav-right" onclick="scrollNav(1)">▶</button>
</div>

<main id="main">
  <div class="tabpanel" id="tab-surgoverview"></div>
  <div class="tabpanel" id="tab-safety"></div>
  <div class="tabpanel" id="tab-preopassess"></div>
  <div class="tabpanel" id="tab-preopprep"></div>
  <div class="tabpanel" id="tab-consent"></div>
  <div class="tabpanel" id="tab-preopteaching"></div>
  <div class="tabpanel" id="tab-anesthesia"></div>
  <div class="tabpanel" id="tab-pacu"></div>
  <div class="tabpanel" id="tab-postopsystems"></div>
  <div class="tabpanel" id="tab-woundpain"></div>
  <div class="tabpanel" id="tab-complications"></div>
  <div class="tabpanel" id="tab-discharge"></div>
  <div class="tabpanel" id="tab-lecalign"></div>
  <div class="tabpanel" id="tab-reftables"></div>
  <div class="tabpanel" id="tab-srctext"></div>
  <div class="tabpanel" id="tab-drugs"></div>
  <div class="tabpanel" id="tab-quickview"></div>
  <div class="tabpanel" id="tab-dashboard"></div>
  <div class="tabpanel" id="tab-casesim"></div>
  <div class="tabpanel" id="tab-quiz"></div>
</main>

<button class="toc-fab" onclick="toggleTOC()">☰ TOC</button>
<div class="toc-drawer" id="toc-drawer"></div>

<div class="popup-overlay" id="popup-overlay" onclick="if(event.target===this)closePopup()">
  <div class="popup-box" id="popup-box">
    <button class="popup-close" onclick="closePopup()">✕</button>
    <div class="popup-title" id="popup-title"></div>
    <div id="popup-body"></div>
  </div>
</div>

<button class="explain-btn" id="explain-btn">⚡ Explain This</button>
<script>
const PH_NS = 'studyhub_periop_n504_m11_v1__';

  cards:[
    {title:'Purpose of Surgery — Types', hy:true, body:`<p>Surgical procedures are classified by their <b>purpose</b>:</p>
      <ul>
        <li><b>Cosmetic</b> — reshapes normal structures to improve appearance; usually elective (e.g., abdominoplasty, facelift, rhinoplasty)</li>
        <li><b>Curative</b> — resolves a health problem by repairing/removing the cause (e.g., removal of cancerous tumor, cholecystectomy, <u>appendectomy</u>)</li>
        <li><b>Diagnostic</b> — determines origin/cause of a disorder via tissue sampling (e.g., breast biopsy, joint arthroscopy)</li>

        <li><b>Cosmetic</b> — alters/enhances personal appearance, usually elective (e.g., abdominoplasty, facelift, rhinoplasty, <u>liposuction</u>)</li>
        <li><b>Transplantation</b> — replaces a malfunctioning structure (e.g., heart or kidney transplant)</li>
      </ul>
      <p style="color:var(--tx3);font-size:.82rem;">Underlined examples = the specific examples used in lecture — high-yield for matching-style questions.</p>`},
    {title:'Urgency of Surgery', hy:true, body:`<p>Surgeries are categorized by how quickly they must occur:</p>
      <ul>
        <li><b>Elective</b> — planned for a nonacute problem (cataract removal, hernia repair, hemorrhoidectomy, total joint replacement)</li>
        <li><b>Urgent</b> — requires prompt intervention; may be life-threatening if delayed more than 24–48 hr (intestinal/bladder obstruction, kidney/ureteral stones, bone fracture, eye injury, acute cholecystitis)</li>
        <li><b>Emergent</b> — requires immediate intervention due to life-threatening consequences (gunshot/stab wound, severe bleeding, AAA, compound fracture, appendectomy)</li>
      </ul>
      <div class="alert red"><div class="alert-label">Numeric Rule</div>Urgent = threat to life if delayed <b>more than 24–48 hours</b>.</div>`},
    {title:'Degree of Risk', hy:true, body:`<p>Surgeries are also classified by how much risk they carry — this is a <b>separate axis</b> from urgency and extent, and it's easy to blend the three together by mistake:</p>
      <ul>
        <li><b>Minor</b> — procedure without significant risk (e.g., incision and drainage of a wound [I&D])</li>
        <li><b>Major</b> — procedure with greater risk, or a longer/more extensive procedure (e.g., mitral valve replacement)</li>
      </ul>
      <div class="alert prof"><div class="alert-label">Don't Confuse</div>Urgency (elective/urgent/emergent) = <i>how soon</i>. Degree of risk (minor/major) = <i>how dangerous</i>. Extent (simple/MIS/radical) = <i>how much tissue involved</i>. A surgery can be elective AND major (e.g., scheduled mitral valve replacement).</div>`},
    {title:'Surgical Approach: Extent', body:`<ul>
        <li><b>Simple</b> — only the most overtly affected area is involved (e.g., simple/partial mastectomy)</li>
        <li><b>Minimally invasive surgery (MIS)</b> — performed in a body cavity/area through one or more endoscopes; fast-growing (e.g., arthroscopy, tubal ligation, hysterectomy, lung lobectomy, CABG, cholecystectomy)</li>
        <li><b>Radical</b> — extensive surgery beyond the obviously involved area, directed at finding root cause (e.g., radical prostatectomy, radical hysterectomy)</li>
      </ul>`},
    {title:'Surgical Settings', body:`<p>Surgery occurs in hospitals and outpatient ambulatory surgical centers (ASCs), which may be hospital-based or freestanding. Very minor surgery can be done in an outpatient office.</p>
      <ul>
        <li><b>Inpatient</b> — admitted to a hospital (may be same-day admission [SDA] or already inpatient)</li>
        <li><b>Outpatient/ambulatory (same-day surgery [SDS])</b> — goes to surgical area day of surgery, returns home same day</li>
      </ul>
      <p>Outpatient centers offer cost-effective, service-oriented care with high patient satisfaction, but complex outpatient procedures (e.g., laparoscopic cholecystectomy) place more responsibility on patient/family for postop care. A case manager often coordinates postdischarge care.</p>`},
    {title:'Interprofessional Surgical Team', body:`<p>A team cares for the surgical patient, including the surgeon, anesthesia provider, circulating nurse, and surgical technician; multiple surgeons may be present for complex cases.</p>
      <p>The <b>Association of periOperative Registered Nurses (AORN)</b> is the specialty organization providing guidelines for ethical and safe perioperative/invasive procedure care.</p>
      <p>Per the <b>IPEC</b> (Interprofessional Education Collaborative) Competency of Roles and Responsibilities, using each team member's unique complementary abilities optimizes health and patient care.</p>`},
    {title:'Perioperative Phases — Definitions', hy:true, body:`<p><b>Perioperative</b> = the operative experience consisting of preoperative, intraoperative, and postoperative time phases.</p>
      <ul>
        <li><b>Preoperative phase</b> — before surgery; begins when scheduled, ends at transfer to surgical suite</li>
        <li><b>Intraoperative phase</b> — during surgery (generalist nurse does not typically attend this phase)</li>
        <li><b>Postoperative phase</b> — after surgery, starts at completion of the procedure</li>
      </ul>`}
  ]
};

    {title:'ASA Physical Status Classification System', hy:true, body:`<p>Created by the American Society of Anesthesiologists to assess preanesthesia status and existing comorbidities; assigned by the anesthesia provider.</p>
      <table><tr><th>Class</th><th>Definition</th><th>Example</th></tr>
      <tr><td>ASA I</td><td>Normal healthy patient</td><td>Healthy nonsmoker, minimal alcohol</td></tr>

      <tr><td>ASA V</td><td>Moribund, not expected to survive without operation</td><td>Ruptured AAA, massive trauma</td></tr>
      <tr><td>ASA VI</td><td>Declared brain-dead, organs being removed for donation</td><td>—</td></tr>
      </table>
      <div class="alert red"><div class="alert-label">Named Rule</div>Adding <b>"E"</b> denotes emergency surgery — defined as delay leading to significant increased threat to life or body part.</div>`},
    {title:'Cardiac History Risk Factors', hy:true, body:`<p>Ask specifically about cardiac problems — anesthesia complications occur more often with cardiac history:</p>
      <ul>
        <li>CAD, angina, <b>MI within 6 months before surgery</b>, heart failure, HTN, dysrhythmias all increase risk</li>
        <li>These impair ability to withstand hemodynamic changes and alter anesthesia response</li>
        <li>Patients on <b>beta-blockers</b> should continue therapy before surgery and immediately postop</li>

    {title:'Pulmonary Risk Factors', body:`<p>Pulmonary complications more likely in older adults, chronic respiratory disease, and smokers.</p>
      <ul>
        <li>Increased chest rigidity/loss of lung elasticity reduces anesthetic excretion</li>
        <li>Smoking increases <b>carboxyhemoglobin</b> (CO on hemoglobin O2-binding sites), decreasing O2 delivery</li>
        <li>Decreased ciliary action → retained secretions → pneumonia and <b>atelectasis</b> (alveolar collapse)</li>
        <li>Chronic lung disease (asthma, emphysema, chronic bronchitis) reduces elasticity → reduced gas exchange</li>
      </ul>`},
    {title:'Malignant Hyperthermia (MH) — Genetics & Risk', hy:true, body:`<p>MH is an <b>inherited muscle disorder</b>; acute, life-threatening complication of certain general anesthesia drugs. Genetic predisposition at risk with: halothane, enflurane, isoflurane, desflurane, sevoflurane, and <b>succinylcholine</b>.</p>
      <ul>
        <li>Testing: muscle biopsy with <b>caffeine halothane contracture test (CHCT)</b> — most used test</li>
        <li>Genetic blood test for mutation in the <b>RYR1 gene</b></li>
        <li>Genetic test cost may not be covered by insurance — inform patient</li>
      </ul>
      <div class="alert purple mnemonic"><div class="alert-label">Mnemonic</div>Think "<b>HISS-succ</b>" for MH trigger agents: Halothane, Isoflurane, Sevoflurane, Sevoflurane-family (desflurane, enflurane), Succinylcholine.</div>`},

      <ul>
        <li><b>Shellfish allergy</b> is to tropomyosin, <b>not iodine</b> — no cross-reactivity shown between shellfish allergy and topical povidone-iodine or iodinated contrast</li>
        <li>Allergy to avocados, bananas, strawberries, other fruits may indicate <b>latex sensitivity</b></li>
        <li>Egg, peanut, or soy allergy → risk for reaction to <b>propofol</b></li>

    {title:'Age-Related Surgical Risk — Cardiovascular & Respiratory', body:`<table><tr><th>System</th><th>Change</th><th>Nursing Intervention</th></tr>
      <tr><td>Cardiovascular</td><td>↓ cardiac output, ↑ BP, ↓ peripheral circulation</td><td>Determine activity tolerance; monitor VS, peripheral pulses, cap refill</td></tr>
      <tr><td>Respiratory</td><td>↓ vital capacity, loss of elasticity, ↓ oxygenation</td><td>Teach coughing/deep breathing; monitor respiratory effort</td></tr>
      </table>`},
    {title:'Age-Related Surgical Risk — Renal, Neuro, Musculoskeletal, Skin', body:`<table><tr><th>System</th><th>Change</th><th>Intervention</th></tr>
      <tr><td>Renal/Urinary</td><td>↓ blood flow, ↓ GFR, nocturia</td><td>Monitor I&O, hydration, electrolytes; frequent toileting</td></tr>
      <tr><td>Neurologic</td><td>Sensory deficits, slower reaction, cognitive impairment</td><td>Orient patient; allow extra teaching time; ensure safety</td></tr>
      <tr><td>Musculoskeletal</td><td>Deformities from osteoporosis/arthritis</td><td>Assess mobility; teach turning; falls precautions</td></tr>
      <tr><td>Skin</td><td>Dry, less subq fat, slower healing</td><td>Assess skin, pad bony prominences, avoid tape, reposition q2h</td></tr>

      <p>Indications of anxiety: anger, crying, restlessness, profuse sweating, ↑ pulse, palpitations, sleeplessness, diarrhea, urinary frequency.</p>`},
    {title:'Nutrition Status & Surgical Risk', body:`<p>Undernutrition or obesity increases surgical risk. Surgery increases metabolic rate and depletes potassium and vitamins C/B needed for wound healing/clotting. Decreased serum protein slows recovery; negative nitrogen balance increases risk for skin breakdown, delayed healing, dehiscence/evisceration, dehydration, sepsis.</p>
      <p>Indicators of poor nutrition: brittle nails, muscle wasting, dry/flaky skin, decreased turgor, orthostatic hypotension, decreased serum protein/abnormal electrolytes.</p>
      <p>Obesity → poor wound healing (fatty tissue has few vessels/collagen/nutrients); added cardiac/pulmonary stress; may need larger drug doses and retain them longer.</p>`}

TOPICS.preopprep = {
  name:'Preop Preparation', color:'var(--stripe4)',
  quickhits:[
    'NPO: no fried/fatty food/meat within 8hr; no other food within 6hr; no clear liquids within 2hr',
    'Prophylactic antibiotics given within 30min, or 31–60min before incision',
    'SGLT2 inhibitors stopped 3–4 days before surgery',
    'IV access: 18-gauge in arm or 20-gauge hand vein',
    'Preop bathing with 2% CHG cloths reduces SSI risk'
  ],
  cards:[
    {title:'NPO Status — Rules & Rationale', hy:true, body:`<p><b>NPO</b> = no eating, drinking (incl. water), smoking, or oral medication (unless directed) before surgery. Decreases risk for aspiration.</p>
      <div class="alert red"><div class="alert-label">Numeric Rule</div>Current recommendations: no fried/fatty food or meat within <b>8 hours</b> of surgery; no other food within <b>6 hours</b>; no clear liquids within <b>2 hours</b> (some surgeons use stricter timelines).</div>
      <p>Patients fasting ≥8 hours (esp. older adults) may develop fluid/electrolyte/glucose imbalances. Failure to adhere can cause surgery postponement/cancellation and increased aspiration risk.</p>
      <p>A clear liquid carbohydrate drink ("carb loading") may be ordered the night before and 2 hours before induction for nondiabetic patients — evidence on benefit is mixed.</p>`},
    {title:'Regularly Scheduled Drugs Before Surgery', hy:true, body:`<p>Consult surgeon/anesthesia provider about drugs for diabetes, cardiac disease, glaucoma, and regularly scheduled anticonvulsants, antihypertensives, anticoagulants, antidepressants, corticosteroids.</p>
      <ul>
        <li>Aspirin, other NSAIDs, herbal preparations may need to stop at a specified time before surgery</li>
        <li>Drugs for cardiac/respiratory disease, seizures, HTN commonly allowed with a sip of water</li>
        <li>Some antihypertensive/antidepressant drugs withheld day of surgery to reduce BP effects</li>
        <li>Beta blockers may be ordered even if not a usual medication, for cardiac risk patients</li>
      </ul>`},
    {title:'Perioperative Diabetes Management Rules', hy:true, body:`<p>Current general recommendations (Khan et al., 2023):</p>
      <ul>
        <li>T2DM on <b>SGLT2 inhibitors</b>: stop <b>3–4 days</b> before surgery</li>
        <li>T2DM on other oral agents or GLP-1 agonists: stop the <b>morning of surgery</b></li>
        <li>T1DM/T2DM on once-daily basal insulin: continue at all times; surgeon determines dose reduction</li>
        <li>T1DM/T2DM on twice-daily basal insulin: consult surgeon re: dose correction</li>
        <li>Basal + prandial or premixed insulin: consult surgeon for specific instructions</li>
        <li>Continuous insulin infusion (pump): continue usual basal rate unless surgeon specifies otherwise</li>
      </ul>`},
    {title:'Intestinal (Bowel) Preparation', body:`<p>Performed to prevent colon injury and reduce intestinal bacteria count; needed for major abdominal, pelvic, perineal, or perianal surgery.</p>
      <p>Enemas given until clear, or potent laxatives, can be stressful — may cause electrolyte imbalance, fluid volume imbalance, vagal stimulation, orthostatic hypotension. Enemas cause severe anal discomfort with hemorrhoids. Include fall-prevention safety teaching.</p>`},
    {title:'Preventing Surgical Site Infection (SSI) — Evidence-Based Practice', hy:true, body:`<p>SSIs are among the most common/costly HAIs. Modifiable patient risk factors: underlying health, lifestyle behaviors, glycemic control, alcohol/smoking status, dyspnea, diabetes, obesity, immunosuppression.</p>
      <ul>
        <li>Preoperative bathing: full-body wash with antimicrobial soap the night before surgery, minimum</li>
        <li>Bathing with <b>2% CHG-impregnated cloths</b> increases CHG concentration to inhibit/kill skin contaminants (e.g., <i>S. aureus</i>)</li>
        <li>Hand hygiene before/after each patient encounter</li>
        <li>Hair removal (if required) before entering the OR suite</li>
        <li>Antibiotic timed so peak efficacy occurs before incision</li>
        <li>Nasal <b>mupirocin ointment</b> reduces microbial count for cardiac/ortho/abdominal/spinal surgery patients</li>
      </ul>`},
    {title:'Skin Preparation', hy:true, body:`<p>Skin is the body's first line of defense — a break increases infection risk, especially in older patients.</p>
      <ul>
        <li>Shower 1–2 days before surgery using antiseptic solution (often <b>chlorhexidine gluconate</b>)</li>
        <li>Repeated the night before or morning of surgery if hospitalized</li>
        <li>Hair removal, if necessary, via <b>electrical clippers or depilatory agent</b> — NOT shaving (shaving increases infection risk via hair-follicle bacteria and skin nicks)</li>
      </ul>`},
    {title:'IV Access & Autologous/Directed Blood Donation', body:`<p><b>IV access</b>: usually 18-gauge, 1-inch catheter in the arm, or 20-gauge in the back of the hand; larger vein = least resistance for rapid infusion.</p>
      <p><b>Autologous donation</b>: patient donates own blood before surgery for reinfusion; special tag on blood bag ensures patient gets only own blood; eliminates transfusion reactions and bloodborne disease risk.</p>
      <p><b>Directed donation</b>: family/friends donate specifically for the patient if blood types compatible; special tag with donor + patient names/signature.</p>
      <p><b>Blood/cell salvage</b>: intraoperative cell savers suction, wash, filter blood for reinfusion — no risk of outside disease, no limit on amount given back; cost-effective option for bloodless surgery.</p>`},
    {title:'Tubes, Drains, and Vascular Access — Prep', body:`<p>Prepare patient for possible tubes/drains/vascular access after surgery.</p>
      <ul>
        <li><b>NG tube</b> — decompresses/empties stomach and upper bowel before abdominal surgery; usually placed after anesthesia induction</li>
        <li><b>Indwelling urinary (Foley) catheter</b> — may be placed before, during, or after surgery</li>
        <li><b>Drains</b> — remove fluid from surgical site; teach they are generally not painful but may cause mild discomfort; should not be kinked or pulled</li>
      </ul>`},
    {title:'Preoperative Patient Preparation — Belongings & Identification', body:`<p>Patient wears a hospital gown; underpants may stay for above-waist surgery; socks allowed except for foot/leg surgery. Valuables given to family or securely stored.</p>
      <ul>
        <li>Rings that can't be removed may need to be cut off if swelling risk exists</li>
        <li>Pierced jewelry preferably removed before surgery</li>
        <li>Dentures may be left in at anesthesia provider's discretion (for snug bag-mask fit) or removed and placed in labeled denture cup</li>
        <li>Remove hairpins/clips (can conduct electrical current, cause scalp burns)</li>
        <li>ID band checked for name, hospital number, surgeon, birth date; separate (usually red) allergy bracelet</li>
        <li>Ask patient to empty bladder just before transport to prevent incontinence/overdistention</li>
      </ul>`},
    {title:'Preoperative Prophylactic Antibiotic Timing', hy:true, body:`<div class="alert red"><div class="alert-label">Numeric Rule</div>Prophylactic antibiotics usually given within <b>30 minutes</b> of incision, or between <b>31–60 minutes</b> before incision.</div>
      <p>If surgery is delayed, the antibiotic administration time is adjusted accordingly to maintain this window.</p>`}
  ]
};

  ],
  cards:[
    {title:'Informed Consent — What It Requires', hy:true, body:`<p>Surgery requires informed consent from the patient or legal guardian. Consent implies the patient understands:</p>
      <ul>
        <li>The nature of and reason for surgery</li>
        <li>Who performs the surgery and whether others (students, vendors) will be present</li>
        <li>All available treatment options and benefits/risks of each</li>
        <li>Risks associated with the surgical procedure and outcomes</li>
        <li>Risks associated with anesthesia use</li>
        <li>Risks, benefits, and alternatives to blood/blood product use</li>
      </ul>
      <div class="alert blue"><div class="alert-label">Role Clarification</div>The <b>surgeon</b> is responsible for explaining the procedure and obtaining signed consent before sedation/surgery. The <b>nurse's role</b> is to clarify facts already presented and dispel myths — NOT to explain the procedure. The nurse may serve as a witness to the <i>signature</i>, not to the adequacy of the patient's understanding.</div>`},
    {title:'Consent — Special Populations', body:`<ul>
        <li>Patients who cannot write may sign with an <b>X</b>, witnessed by <b>two people</b> (nurse may be one)</li>
        <li>If patient cannot consent and has no medical power of attorney: court can appoint a legal guardian</li>
        <li>Life-threatening situation, no POA reachable despite effort: written consultation with <b>at least two health care providers</b> not associated with the case legally supports the decision until consent can be signed</li>
        <li>Blind patients may sign their own consent, witnessed by two people</li>
        <li>Patients who don't speak the agency's language or are hearing impaired require a <b>qualified translator</b> plus a second witness</li>
      </ul>
      <div class="alert red"><div class="alert-label">Named Rule</div>Family members must <b>NOT</b> serve as translators — the health care team cannot validate accuracy of the medical information translated.</div>`},
    {title:'Right to Refuse Treatment', body:`<p>The Joint Commission's NPSGs state patients must be informed and involved in decisions affecting their health care. As a competent adult, a patient has the right to refuse treatment for any reason — even if refusal could compromise health or lead to death.</p>`},
    {title:'Surgical Site Marking', hy:true, body:`<p>Site-specific surgery (left/right/bilateral) requires identification before surgery.</p>
      <ul>
        <li>Marking is the role/responsibility of the <b>surgeon</b> (with patient input when able)</li>
        <li>Takes place outside the surgical suite, <b>before any sedation</b></li>
        <li>A single-use surgical marker creates a marking visible after skin prep (often surgeon's initials), placed as close as anatomically possible to the incision site</li>
        <li>Further verification occurs during the "time-out" process once in the surgical suite</li>
      </ul>`},
    {title:'Patient Self-Determination & Advance Directives', body:`<p>The <b>Patient Self-Determination Act</b> mandates patients' rights to have or initiate advance directives (living will, durable power of attorney). Surgery does <b>not</b> provide an exception to a patient's advance directives.</p>`},
    {title:'Special Consent Requirements', body:`<p>Some procedures — sterilization, experimental procedures, or administration of anesthesia/blood products — may require a special consent in addition to the standard consent. National/local governing bodies and the individual agency determine which procedures require separate consent.</p>`}
  ]
};
</script>

  cards:[
    {title:'ERAS® Society Guidelines', body:`<p><b>ERAS®</b> (Enhanced Recovery After Surgery) Society is a "multimodal perioperative care pathway designed to achieve early recovery for patients undergoing major surgery." Free evidence-based guidelines exist for bariatric, breast, cardiac, colorectal, head/neck, liver, pancreatic, and thoracic surgeries.</p>`},
    {title:'Preoperative Teaching Checklist Content', body:`<p>Box 9.4 — Patient teaching: addressing fears/anxieties, outlining the procedure, explaining preop routines (NPO, blood draws, showering), informing about invasive lines/catheters expected, pain control methods, coughing/turning/deep breathing/incentive spirometry, lower extremity exercises/stockings/compression devices, splinting, wound care, early ambulation importance.</p>
      <p>Family/caregiver teaching adds: assisting with movement, nutritional support, reminding patient not to lift more than surgeon instructed.</p>`},
    {title:'Breathing Exercises — Deep Breathing & Expansion Breathing', hy:true, body:`<p><b>Deep (diaphragmatic) breathing:</b> sit upright, feet flat; gentle breath through mouth; breathe out gently/completely; deep breath through nose+mouth, hold to count of <b>5</b>; exhale through nose/mouth.</p>
      <p><b>Expansion breathing:</b> comfortable position with knees slightly bent (decreases abdominal tension); hands on lower rib cage; deep breath through nose using shoulder muscles to expand ribcage; exhale concentrating on moving ribs inward.</p>`},
    {title:'Incentive Spirometry', hy:true, body:`<p>Promotes complete lung expansion, helps prevent pulmonary problems.</p>
      <div class="alert red"><div class="alert-label">Numeric Rule</div>Patient must seal lips around mouthpiece, inhale spontaneously, and <b>hold the breath 3–5 seconds</b> for effective lung expansion.</div>
      <p>Seeing a ball move up a column, or a bellows expanding, motivates continued performance.</p>`},
    {title:'Splinting & Coughing Technique', body:`<p>Splinting (holding) the incision with a folded blanket/towel/pillow while coughing provides support, promotes security, reduces pain.</p>
      <p>Technique (Box 9.6): unless coughing contraindicated, place pillow/towel firmly over incision; take 3 slow deep breaths to stimulate cough reflex; inhale through nose, exhale through mouth; on the 3rd deep breath, cough to clear secretions while firmly holding the support against the incision.</p>
      <div class="alert red"><div class="alert-label">Named Rule</div>For hernia repair or craniotomy patients, the surgeon may write a "<b>do not cough</b>" order — deep-breathing/spirometry substituted instead.</div>`},
    {title:'VTE Risk Factors & Prevention Teaching', hy:true, body:`<p>Risk factors for venous thromboembolism (VTE): obesity, age ≥<b>40</b> years, cancer, spinal cord injury, hip fracture, total hip/knee replacement, decreased mobility, history of VTE/DVT/PE/varicose veins/edema, oral contraceptive use, smoking, decreased cardiac output.</p>
      <p>Teach patients about compression stockings and/or pneumatic compression devices for postop use, and about leg exercises to promote venous return.</p>`},
    {title:'Postoperative Leg Exercises', hy:true, body:`<div class="alert red"><div class="alert-label">Numeric Rule</div>Begin leg exercises early in recovery: <b>5 to 10 repetitions each, every 1 to 2 hours</b> after surgery, continuing for at least the <b>first 48 hours</b>. Patient may need to be awakened for these.</div>
      <p>Four exercise types (Box 9.5): (1) bend knee/raise foot/hold/extend/lower; (2) point toes down then up; (3) ankle circles L then R; (4) push ball of foot into bed to contract calf/thigh.</p>`},
    {title:'Early Mobility Teaching', body:`<p>Most patients allowed/encouraged out of bed the day of or day after surgery. Teach dangling at bedside, then chair or ambulation. Mobility soon after surgery has cardiovascular benefits: stimulates intestinal motility, enhances lung expansion, mobilizes secretions, promotes venous return, prevents joint rigidity, relieves pressure.</p>
      <p>For most surgeries, teach patients they will need to turn at least <b>every 2 hours</b> while confined to bed; nursing staff will turn them initially if unable. Certain brain/spinal/orthopedic procedures may have <b>turning restrictions</b> ordered by the surgeon.</p>`},
    {title:'Minimizing Preoperative Anxiety', body:`<p>Interventions: encourage communication (open expression without fear of judgment); promote rest (identify what helps patient relax); use distraction (music, TV, reading, visiting); teach family/caregivers (with patient's consent) to reduce anxiety through involvement.</p>
      <p>Inform patient/family of surgery timing, schedule changes, and PACU process. Typical timeline: <b>30–60 minute</b> preparation period in the holding/operating area before surgery begins; <b>1–2 hours</b> in PACU afterward before returning to room/discharge.</p>`}

};

TOPICS.anesthesia = {

  cards:[
    {title:'General vs Local Anesthesia — Definitions', hy:true, body:`<p><b>General anesthesia</b> — reversible loss of consciousness by inhibiting neuronal impulses in several CNS areas; single agent or combination.</p>
      <p><b>Local anesthesia</b> — briefly disrupts sensory nerve impulse transmission from a specific body area/region; delivered topically or by local infiltration; patient remains conscious and able to follow instructions.</p>`},
    {title:'Four Stages of General Anesthesia', hy:true, body:`<ol>
        <li><b>Stage 1 — Analgesia/sedation, relaxation:</b> help patient relax</li>
        <li><b>Stage 2 — Excitement/delirium:</b> protect extremities, suction as needed</li>
        <li><b>Stage 3 — Operative/surgical anesthesia:</b> intubation occurs here</li>
        <li><b>Stage 4 — Danger:</b> risk of cardiac/pulmonary arrest</li>
      </ol>`},
    {title:'Malignant Hyperthermia — Signs & Emergency Response', hy:true, body:`<p>MH may start immediately after induction, hours into the procedure, or after anesthesia completion.</p>
      <p><b>Symptoms:</b> tachycardia, dysrhythmias, muscle rigidity of jaw/upper chest, hypotension, tachypnea, skin mottling, cyanosis, myoglobinuria. <b>Most sensitive indicator:</b> unexpected rise in end-tidal CO2 with decreased O2 saturation and tachycardia. Extremely elevated temperature (up to 111.2°F/44°C) is a <b>late</b> sign.</p>
      <div class="alert red"><div class="alert-label">Critical Rescue</div>Monitor for the cluster of elevated end-tidal CO2, decreased O2 sat, and tachycardia. If changes begin, immediately alert the surgeon and anesthesia provider. <b>Dantrolene sodium</b> (skeletal muscle relaxant) is the only drug specifically approved to treat MH. Survival depends on early diagnosis and immediate team action.</div>`},
    {title:'Complications from General Anesthesia', body:`<ul>
        <li>Malignant hyperthermia (treat with dantrolene)</li>
        <li>Overdose</li>
        <li>Unrecognized hypoventilation — anesthesia-induced failure of adequate gas exchange</li>
        <li>Complications of specific anesthetic agents</li>
        <li>Complications of intubation — broken teeth, vocal cord trauma</li>
      </ul>`},
    {title:'Regional Anesthesia Types', hy:true, body:`<p>Regional anesthesia is a type of local anesthesia that blocks multiple peripheral nerves in a specific body region:</p>
      <ul>
        <li><b>Field block</b> — series of injections around the operative site</li>
        <li><b>Nerve block</b> — injection of anesthetic to nerves of the involved site</li>
        <li><b>Spinal block</b> — injection into the cerebrospinal fluid around the subarachnoid space</li>
        <li><b>Epidural block</b> — injection of agent into the epidural space</li>
      </ul>`},
    {title:'Local/Regional Anesthesia Complications & Treatment', hy:true, body:`<p><b>Complications:</b> anaphylaxis, incorrect delivery technique, systemic absorption, overdose, local complications.</p>
      <p><b>Treatment:</b> establish open airway; give oxygen; notify the surgeon; fast-acting barbiturate is usual treatment; <b>epinephrine</b> for unexplained bradycardia.</p>`},
    {title:'Conscious Sedation', hy:true, body:`<p>IV delivery of sedative, hypnotic, and opioid drugs to reduce level of consciousness. Patient maintains a <b>patent airway</b> and can <b>respond to verbal commands</b>. Amnesia action is short with rapid return to ADLs.</p>
      <p>Commonly used drugs: etomidate, diazepam, midazolam, meperidine, fentanyl, alfentanil, morphine sulfate.</p>`},
    {title:'Serious Complications of Spinal & Epidural Anesthesia', hy:true, body:`<table><tr><th>Complication</th><th>Key Assessment / Action</th></tr>
      <tr><td>Respiratory depression</td><td>Notify anesthesia provider if pulse ox &lt;95% or unable to increase respiratory depth</td></tr>
      <tr><td>Hypotension</td><td>Notify if systolic BP &gt;10 mmHg below baseline, or bradycardia/nausea/vomiting present</td></tr>
      <tr><td>Epidural hematoma</td><td>Notify immediately if sensory/motor deficits worsen or reflexes regress</td></tr>
      <tr><td>Infection (meningitis)</td><td>Notify for temp &gt;101°F (38.3°C), inability to move neck, acute confusion</td></tr>
      <tr><td>Postdural puncture headache</td><td>Occipital headache, worse when sitting upright</td></tr>
      </table>`},
    {title:'Order of Return After Anesthesia', hy:true, body:`<p><b>Return to consciousness after general anesthesia (in order):</b></p>
      <ol><li>Muscular irritability</li><li>Restlessness and delirium</li><li>Recognition of pain</li><li>Ability to reason and control behavior</li></ol>
      <p><b>Return of motor/sensory function after local or regional anesthesia (in order):</b></p>
      <ol><li>Sense of touch</li><li>Sense of pain</li><li>Sense of warmth</li><li>Sense of cold</li><li>Ability to move</li></ol>`},
    {title:'Emergency Care — Benzodiazepine Overdose', hy:true, body:`<p>Secure airway and IV access before starting antagonist therapy. Administer oxygen if hypoxic or respirations &lt;10/min. Prepare to give <b>flumazenil</b>; repeat every 2–3 minutes as ordered. Have suction available (flumazenil can trigger vomiting). Continuously monitor VS/LOC every 10–15 min for the first 2 hours (flumazenil eliminated faster than benzodiazepine — additional doses may be needed 1–2 hr later). Observe for tremors/convulsions (can lower seizure threshold) and thrombophlebitis at IV site.</p>`}

  cards:[
    {title:'Three Phases of Perianesthesia Care', hy:true, body:`<p>Based on level of care needed, NOT physical location. Not every patient transitions through all three.</p>
      <ul>
        <li><b>Phase I</b> — immediately after surgery, most often PACU (or ICU for complex/high-risk patients). Requires ongoing monitoring of airway, VS, and recovery evidence every <b>5–15 minutes</b> initially, gradually spacing out. Duration: &lt;1 hour to days.</li>
        <li><b>Phase II</b> — prepares patient for an extended-care environment (med-surg unit, step-down, SNF, or home). Occurs in PACU, med-surg unit, or SDS unit. May last 15–30 min, though 1–2 hours is more typical. Discharge criteria: return of presurgical LOC, baseline O2 sat, stable VS.</li>
        <li><b>Phase III</b> — extended-care environment, most often hospital unit or home. VS monitored several times daily to once daily.</li>
      </ul>`},
    {title:'PACU Hand-off Report Content', hy:true, body:`<p>Box 9.7 — Best practice postoperative hand-off report includes: type/extent of surgical procedure; type of anesthesia and duration; allergies (esp. latex/drugs); primary language/sensory impairments/communication difficulties; special patient requests; preop/intraop respiratory function; health problems; intraoperative complications and management; I&O including IV fluids and estimated blood loss; type/amount of IV fluids or blood products given; medications given and last pain med dose; when next antibiotic/cardiac drug dose is due; location/type of incisions, dressings, catheters, tubes, drains; prosthetic devices; joint/limb immobility during OR; other intraoperative positioning; current VS including temp and O2 sat.</p>`},
    {title:'Ambulatory Surgery Discharge Criteria', body:`<p>Criteria for discharge home from ambulatory setting (agency-specific) generally include: stable vital signs; normal body temperature; no overt bleeding; return of gag, cough, and swallow reflexes; ability to take liquids; adequate urine output.</p>
      <p>Ambulatory units advance patients quickly from Phase I to Phase III. If unstable VS, poor gas exchange, excessive N/V, or unmanageable pain occurs, admission to an acute care/extended-care agency may be necessary.</p>`},
    {title:'Respiratory Assessment on Arrival — Postop', hy:true, body:`<p>Immediately assess for a <b>patent airway</b> upon medical-surgical floor admission. Talking is NOT a reliable indicator of adequate gas exchange. Continuously monitor pulse oximetry.</p>
      <div class="alert red"><div class="alert-label">Numeric Rule</div>SpO2 should be above <b>95%</b> (or at patient's presurgical baseline). Check lungs at least every <b>4 hours</b> during the first 24 hours, then every <b>8 hours</b> or per policy.</div>
      <div class="alert red"><div class="alert-label">Critical Rescue</div>If SpO2 drops below 95% (or below presurgical baseline), immediately notify the surgeon or anesthesia provider.</div>
      <p>Respiratory rate &lt;10 breaths/min may indicate anesthetic/opioid-induced respiratory depression. Rapid shallow respirations may signal shock, cardiac problems, ↑ metabolic rate, or pain.</p>`},
    {title:'Gas Exchange Monitoring Timeline', hy:true, body:`<p>The highest incidence of impaired gas exchange after surgery occurs on the <b>second postoperative day</b>.</p>
      <p>Older adults surgeon often orders low-dose O2 therapy for the first <b>12–24 hours</b> to reduce confusion from anesthesia/sedation. Oxygen therapy may continue through the second postoperative day.</p>`}

TOPICS.postopsystems = {
  name:'Postop Systems', color:'var(--stripe4)',
  quickhits:[
    'BP change >25% or 15–20 point systolic/diastolic difference → report',
    'Urine output <30 mL/hr (240 mL/8hr shift) → report to surgeon',
    'Sensation return begins at spinal dermatome level T10 before elevating head',
    'CAM-ICU or RASS used to screen for postop delirium',
    'mHELP bundle: orientation, nutrition/fluid/sleep needs, mobility'
  ],
  cards:[
    {title:'Cardiovascular Assessment Postop', hy:true, body:`<p>Assess VS for trends, compare to presurgical values.</p>
      <div class="alert red"><div class="alert-label">Numeric Rule</div>Report BP changes <b>25% higher or lower</b> than presurgical values (or a <b>15–20 point</b> systolic/diastolic difference) to the surgeon/anesthesia provider.</div>
      <p>Decreased BP/pulse pressure/abnormal heart sounds suggest cardiac depression, fluid deficit, shock, hemorrhage, or drug effects. Bradycardia may indicate anesthesia effect or hypothermia. Increased pulse may indicate hemorrhage, shock, or pain.</p>
      <p><b>Pulse deficit</b> = difference between apical and peripheral pulses; may indicate a dysrhythmia.</p>`},
    {title:'VTE/DVT Prophylaxis Devices — Postop', hy:true, body:`<p>Peripheral vascular assessment performed daily (anesthesia/positioning impair circulation → clotting/VTE risk).</p>
      <ul>
        <li><b>Antiembolism (TED/compression) stockings</b> — graduated compression from foot/ankle up; measure leg length/circumference for sizing; remove <b>2–3 times per day for 30 minutes</b> for skin inspection</li>
        <li><b>Pneumatic compression devices</b> — intermittent compression; measure legs for correct size; typical pressures <b>35–55 mm Hg</b></li>
      </ul>
      <p>PE is the leading cause of preventable in-hospital death — prophylaxis is the most important patient safety strategy.</p>`},
    {title:'Postoperative Neurologic Assessment', hy:true, body:`<p>Assess LOC, orientation (person/place/time/situation), and response to commands in all patients who received general anesthesia or sedation. Eye opening to command = wakefulness, NOT necessarily awareness.</p>
      <p>Monitor LOC every <b>4–8 hours</b> (or per policy). Compare presurgical and postsurgical neuro status.</p>`},
    {title:'Preventing & Screening for Postoperative Delirium', hy:true, body:`<p>More common in older adults (especially &gt;65). Can impede healing, delay discharge, ↑ mortality risk.</p>
      <ul>
        <li>Screening tools: <b>CAM-ICU</b> (Confusion Assessment Method) or <b>RASS</b> (Richmond Agitation Sedation Scale); also NEECHAM Confusion Scale</li>
        <li><b>mHELP bundle</b> (modified Hospital Elder Life Program): maintain orientation with visual/hearing aids; meet nutrition/fluid/sleep needs; promote mobility and family involvement</li>
        <li>Additional strategies: staff education on age/neuro complication link, sleep-conducive environment, family reporting of behavior changes</li>
      </ul>`},
    {title:'Return of Sensory/Motor Function After Regional Anesthesia', body:`<p>Assess sensation loss with light monofilament pinprick — patient indicates when sensation feels sharp vs dull/pressure. Evaluate motor function by asking patient to move each extremity, compare bilaterally.</p>
      <div class="alert red"><div class="alert-label">Numeric Rule</div>Test for return of sympathetic nervous system tone by gradually elevating the patient's head — begin only after sensation has returned to at least spinal dermatome level <b>T10</b>.</div>`},
    {title:'Fluid, Electrolyte, and Acid-Base Balance Postop', hy:true, body:`<p>NPO status, intraop fluid loss, and type/amount of fluids given affect postop balance. Sodium, potassium, chloride, calcium imbalances may occur — more often in older patients and those with DM/heart failure.</p>
      <p>NG tube drainage/vomitus causes loss of hydrochloric acid → <b>metabolic alkalosis</b>.</p>
      <p>Hydration assessed via mucous membrane color/moisture, skin turgor/tenting (test over sternum or forehead in older adults), dressing drainage amount, presence/absence of axillary sweat.</p>`},
    {title:'Kidney/Urinary Assessment Postop', hy:true, body:`<p>Urinary control may return immediately or take hours after general/regional anesthesia. Preop drugs (esp. atropine), anesthetics, or surgical manipulation can cause urine retention — assess via inspection/gentle palpation of lower abdomen or bladder scanner.</p>
      <div class="alert red"><div class="alert-label">Numeric Rule</div>Report urine output <b>less than 30 mL/hr (240 mL per 8-hour shift)</b> to the surgeon — may indicate hypovolemia or renal complications.</div>`},
    {title:'GI Assessment — Postoperative Nausea and Vomiting (PONV)', hy:true, body:`<p>PONV is the most common reaction after surgery, common within the first 24 hours after general anesthesia. Risk factors: history of motion sickness, obesity (anesthetics retained in fat cells longer), abdominal surgery, opioid analgesics (↓ peristalsis).</p>
      <p>Preventive drugs, often started preop: <b>ondansetron</b> and <b>dexamethasone</b> (dexamethasone may slightly ↑ glucose in nondiabetic patients within first 12 hr postop).</p>
      <p>PONV can stress/irritate abdominal-GI wounds, ↑ ICP after head/neck surgery, ↑ intraocular pressure after eye surgery, and ↑ aspiration risk. Reduce nausea by side-lying position before slowly raising HOB.</p>`},
    {title:'Return of Peristalsis Assessment', hy:true, body:`<p>Delayed by prolonged anesthesia, bowel handling, and opioids. Decreased/absent peristalsis common for at least 24 hours after pelvic/abdominal surgery, may persist several days for GI surgery.</p>
      <p>Listen for bowel sounds in all four quadrants and umbilicus; turn off NG suction before listening. Active bowel sounds usually indicate return of peristalsis, but <b>absence does not confirm lack of peristalsis</b>.</p>
      <div class="alert green"><div class="alert-label">Clinical Pearl</div>The true indicator of intestinal activity is the <b>passage of flatus or stool</b> — not bowel sounds alone. Abdominal cramping with distention denotes trapped, nonmoving gas, not peristalsis.</div>`},
    {title:'Nasogastric (NG) Tube Assessment', body:`<p>Normal NG drainage: greenish-yellow. Red/pink = active bleeding. Brown/coffee-ground = old bleeding. Record color, consistency, amount every 8 hours or per policy.</p>
      <div class="alert red"><div class="alert-label">Action Alert</div>After gastric surgery, do NOT move or irrigate the NG tube unless ordered.</div>
      <p>Check tube placement every 4–8 hours and before instilling any liquid/drugs. NG drainage/irrigation with water instead of saline can cause fluid volume deficit, hypokalemia, hyponatremia, hypochloremia, metabolic alkalosis.</p>`},
    {title:'Constipation Prevention Postop', body:`<p>May occur due to anesthesia, opioid analgesia, decreased activity/oral intake. Assess via inspection, auscultation, palpation (auscultate BEFORE palpation — palpation can affect peristalsis). Increased fiber, mild laxatives/bulk agents, enemas may be ordered. Encourage early ambulation to promote peristalsis.</p>`}
  ]
};
</script>
<script>
TOPICS.woundpain = {
  name:'Wound Care & Pain', color:'var(--stripe5)',
  quickhits:[
    'Wound skin-level healing ~2 weeks; full tissue integrity up to 2 years',
    'Serosanguineous drainage beyond day 5, or increasing amount → possible dehiscence',
    'Dehiscence/evisceration occur most often days 5–10 postop',
    'Sutures/staples removed 5–10 days postop (up to 30 days depending on surgery)',
    'Hydromorphone dosage is much smaller than morphine — check carefully'
  ],
  cards:[
    {title:'Normal Wound Healing Timeline', hy:true, body:`<p>First few days: incised tissue regains blood supply, begins binding; fibrin + thin epithelial layer seal incision. Days 1–4: epithelial cells grow, collagen strands fill gaps — continues 2–3 weeks.</p>
      <div class="alert red"><div class="alert-label">Numeric Rule</div>Clean surgical wound regains tissue integrity at skin level in about <b>2 weeks</b> (absent trauma/infection/malnutrition/steroid use). Complete tissue integrity (all layers) may take <b>6 months to 2 years</b>.</div>
      <p>Head/facial wounds heal faster than abdominal/leg wounds (less stress, better blood flow). Risk factors for delayed healing: older age, obesity, immunocompromise, diabetes, smoking.</p>`},
    {title:'Wound Drainage Progression & Infection Signs', hy:true, body:`<p>Normal drainage color progression over the first few days: <b>sanguineous (bloody) → serosanguineous (yellow mixed with light red/pink) → serous (yellow, serum-like)</b>.</p>
      <div class="alert red"><div class="alert-label">Named Rule</div>Serosanguineous drainage continuing beyond the <b>fifth day</b>, or in increasing amount, signals possible dehiscence — notify the surgeon.</div>
      <p>Crusting and pink incision line color are normal (inflammation from surgery); slight swelling under sutures/staples is normal.</p>
      <p><b>Signs of surgical site infection (SSI):</b> redness/hyperpigmentation or swelling around the incision, excessive tenderness/pain on palpation, purulent or odorous drainage — must be reported to the surgeon.</p>`},
    {title:'Wound Dehiscence vs Evisceration', hy:true, body:`<p><b>Dehiscence</b> — partial or complete separation of the outer wound layers ("splitting open").</p>
      <p><b>Evisceration</b> — total separation of all wound layers with protrusion of internal organs through the wound; a <b>surgical emergency</b>.</p>
      <div class="alert red"><div class="alert-label">Numeric Rule</div>Both occur most often between the <b>5th and 10th day</b> after surgery. Risk factors: diabetes, obesity, immunodeficiency, malnutrition, steroid use. Triggers: forceful coughing, vomiting, straining, improper splinting.</div>
      <p>Patient may report "I feel like something popped" or "I feel as if I just split open."</p>`},
    {title:'Emergency Care of Surgical Wound Evisceration', hy:true, body:`<p>Box 9.12 — stepwise emergency response:</p>
      <ol>
        <li>Call another nurse to notify the surgeon/Rapid Response Team and bring supplies</li>
        <li>Provide reassurance; stay with patient; instruct patient to remain in bed</li>
        <li>Place patient <b>supine with hips and knees bent</b></li>
        <li>Raise head of bed <b>15–20 degrees</b></li>
        <li>Using sterile technique, create a sterile field with a sterile towel</li>
        <li>Open irrigation set; place basin/syringe on field</li>
        <li>Open several large abdominal dressings onto the field</li>
        <li>Don sterile gloves; saturate dressings with warm saline in the basin</li>
        <li>Place moistened dressings over exposed viscera; cover with sterile waterproof drape</li>
        <li>If saline unavailable, cover wound with gauze, moisten with sterile saline when available</li>
        <li>Do <b>NOT</b> attempt to reinsert the protruding organ/viscera</li>
        <li>Assess for shock symptoms; document VS</li>
        <li>Reassess VS every <b>5–10 minutes</b> until surgeon/RRT arrives</li>
        <li>Keep dressings continuously moist — never let them dry</li>
        <li>Report findings/interventions on arrival of surgeon/RRT</li>
        <li>Document the incident, activity at time of incident, assessments, interventions</li>
        <li>Prepare for emergency surgery; start IV as ordered</li>
        <li>Keep patient NPO to decrease aspiration risk if surgery needed</li>
      </ol>`},
    {title:'Dressings and Wound Care Management', body:`<p>Assess dressings (incl. casts, elastic bandages) for bleeding/drainage on admission and at least every <b>8 hours</b>. Outline drainage on dressing with pencil + date/time to monitor progression. Check underneath the patient too — drainage may leak to the side unseen.</p>
      <p>Surgeon usually performs first dressing change (postop day 1–2) to assess wound, remove packing, advance/remove drains. Ensure dressings don't restrict circulation/sensation (esp. if encircling a limb or the chest).</p>`},
    {title:'Types of Surgical Drains', hy:true, body:`<ul>
        <li><b>Penrose drain</b> — single-lumen, soft, open, latex tube; gravity-type; drainage visible on dressing; secured with a safety pin placed perpendicular to drain/wound to prevent slipping; advanced (shortened) as wound heals, leaving 2–3 inches protruding</li>
        <li><b>Closed-suction drains</b> (Jackson-Pratt, Hemovac) — include a reservoir; drainage NOT usually visible on the dressing; sutured in place; use sterile technique to empty; secure to patient's gown (never bed/mattress)</li>
        <li><b>T-tube</b> — specialty drain, e.g., drains bile after cholecystectomy</li>
        <li><b>Negative-pressure wound therapy (NPWT)</b> — continuous/intermittent subatmospheric pressure for chronic/delayed-healing wounds</li>
      </ul>`},
    {title:'Skin Suture/Staple Removal', hy:true, body:`<div class="alert red"><div class="alert-label">Numeric Rule</div>Sutures/staples usually removed <b>5–10 days</b> after surgery (may vary up to <b>30 days</b> depending on surgery type/recovery).</div>
      <p>Clean incision with prescribed solution before removal; examine healing stage. Remove every other suture/staple first, reassess wound integrity; if healing well, remove the rest. If poorly healing or signs of infection present, notify surgeon before removing sutures. Wound may then be secured with wound closure tape.</p>`},
    {title:'Postoperative Pain Assessment', body:`<p>Continuous during recovery. Physical/behavioral signs of acute pain: ↑ pulse/BP, ↑ respiratory rate, profuse sweating, restlessness, confusion (older adult), wincing, moaning, crying. Rate pain 0–10 before/after medication.</p>
      <div class="alert red"><div class="alert-label">Numeric Rule</div>Reassess pain within <b>20–30 minutes</b> after pain medication to determine efficacy.</div>`},
    {title:'Opioid Analgesics for Postop Pain', hy:true, body:`<p>Common drugs: morphine, hydromorphone, ketorolac, codeine, butorphanol, oxycodone with aspirin or with acetaminophen. Around-the-clock scheduling or PCA more effective than "on-demand" dosing — allows consistent blood levels.</p>
      <div class="alert red"><div class="alert-label">Drug Alert</div>The usual dosage of <b>hydromorphone</b> is much smaller than that of <b>morphine</b> — check dosages carefully.</div>
      <p>Complications: respiratory depression, hypotension, N/V, constipation. <b>Naloxone</b> reverses acute opioid depression effects.</p>`},
    {title:'Patient-Controlled Analgesia (PCA)', body:`<p>Patient adjusts analgesic dose based on pain level/response; more consistent pain relief and patient control than fixed dosing. Maximum hourly dose is "locked in" to prevent accidental overdose.</p>
      <p>Special care with older adults to prevent undertreatment — assess understanding of the system and comfort with self-medicating; reassure re: overdose protection.</p>`},
    {title:'Emergency Care — Opioid Overdose', hy:true, body:`<p><b>Naloxone</b> may be given IV, IM, subcutaneously, or nasally; IV route has most rapid onset and is recommended in emergencies. Maintain open airway. Repeat dosing at <b>2–3 minute</b> intervals as ordered if needed. Give oxygen if hypoxic or respirations below <b>12/min</b>. Have suction available (naloxone can trigger vomiting). Monitor VS/LOC every <b>10–15 minutes for the first hour</b> (naloxone eliminated faster than the opioid — additional antagonist doses may be needed). Assess for pain, since opioid reversal also reverses analgesia.</p>`},
    {title:'Nonopioid & Nonpharmacologic Pain Management', body:`<p>Nonopioid analgesics (acetaminophen, NSAIDs like ibuprofen/ketorolac) used alone or with opioids as recovery progresses. Nonpharmacologic (Box 9.14): general comfort positioning, ice for swelling, cushion/elevate painful areas (avoid pillows under knees/raised knee gatch — restricts circulation, ↑ VTE risk), reduce noxious stimuli, adequate rest, diversional activities, relaxation techniques, meditation.</p>
      <div class="alert green"><div class="alert-label">Clinical Pearl</div>Do NOT massage the calves — risk of loosening a clot and causing a life-threatening pulmonary embolus.</div>`},
    {title:'Promoting Peristalsis — Postoperative Ileus (POI) Prevention', hy:true, body:`<p>POI can occur from drug therapy, anesthesia/analgesia, operative manipulation, or sympathetic excitation from stress — most common after open abdominal procedures. Can lead to wound dehiscence, N/V, deconditioning.</p>
      <p>Interventions: adequate hydration (dehydration/crystalloid excess can decrease motility); early/increasing mobility/ambulation; nonopioid pain strategies (opioids bind GI receptors, ↓ peristalsis); drug therapy — <b>alvimopan</b> accelerates GI recovery after certain GI surgeries; <b>metoclopramide</b> directly stimulates GI motility.</p>`}
  ]
};

    {title:'Postop Laboratory Trends — Infection Marker', hy:true, body:`<p>Electrolyte, hematocrit, and hemoglobin changes commonly occur in the first <b>24–48 hours</b> after surgery from blood/fluid loss and the body's reaction to surgery. Fluid loss with minimal blood loss can falsely elevate lab values (concentrated normal values).</p>

    {title:'Postoperative Bleeding/Hemorrhage — Recognition', hy:true, body:`<p>Risk relates to the type of surgery and the patient's presurgical health status; difficult to quantify overall risk due to varying definitions across studies.</p>

    {title:'Postoperative Anxiety, Family Support & Referral Needs', body:`<p>Consider psychological, social, cultural, spiritual issues. Assess for restlessness, ↑ pulse/BP/RR, crying. Offer reassurance the surgeon will speak with the patient soon; reinforce what was already said if the surgeon already spoke with them. Assess family/caregiver for psychosocial discomfort; refer to social services/external support as appropriate.</p>`},
    {title:'Postoperative Opioid Dependence Concerns', body:`<p>For patients previously dependent on opioids expressing fear of re-addiction: appropriate nursing responses involve exploring the patient's history nonjudgmentally and educating about proper opioid use to reduce dependence risk during acute surgical pain management — not dismissing the concern or making absolute promises.</p>`}
