const SRC_CHAPTERS = [
  {id:'src1', title:'Key Terms & Surgery Overview', open:true, html:`
    <h4>Key Terms</h4>
    <dl>
      <dt>ambulatory patient</dt><dd>See outpatient.</dd>
      <dt>ASA Physical Status Classification system</dt><dd>System that assesses fitness of patients for surgery.</dd>
      <dt>atelectasis</dt><dd>Collapse of lung tissue; can occur postoperatively if patient does not change positions and breathe deeply.</dd>
      <dt>autologous donation</dt><dd>Blood donation given by the patient before surgery for reinfusing for self.</dd>
      <dt>carboxyhemoglobin</dt><dd>Carbon monoxide on oxygen-binding sites of the hemoglobin molecule.</dd>
      <dt>dehiscence</dt><dd>Partial or complete separation of the outer wound layers.</dd>
      <dt>dysuria</dt><dd>Painful urination.</dd>
      <dt>evisceration</dt><dd>Total separation of all wound layers and protrusion of internal organs through the open wound.</dd>
      <dt>hyperkalemia</dt><dd>Increased serum potassium level.</dd>
      <dt>hypokalemia</dt><dd>Decreased serum potassium level.</dd>
      <dt>inpatient</dt><dd>A patient who is admitted to a hospital.</dd>
      <dt>intraoperative phase</dt><dd>During surgery.</dd>
      <dt>malignant hyperthermia (MH)</dt><dd>Inherited muscle disorder; an acute, life-threatening complication of certain drugs used for general anesthesia.</dd>
      <dt>morbidity</dt><dd>Illness or an abnormal condition or quality; number of serious diseases.</dd>
      <dt>mortality</dt><dd>Death.</dd>
      <dt>myoglobinuria</dt><dd>Muscle proteins in the urine due to rhabdomyolysis.</dd>
      <dt>nocturia</dt><dd>The need to urinate excessively at night.</dd>
      <dt>NPO</dt><dd>No eating, drinking (including water), smoking, or oral medications.</dd>
      <dt>oliguria</dt><dd>Scant urine output; usually less than 400 mL/day.</dd>
      <dt>outpatient</dt><dd>A patient who goes to the surgical area the day of surgery and returns home the same day.</dd>
      <dt>perioperative</dt><dd>Operative experience consisting of the preoperative, intraoperative, and postoperative time phases.</dd>
      <dt>postoperative phase</dt><dd>After surgery.</dd>
      <dt>preoperative phase</dt><dd>Before surgery.</dd>
      <dt>pulse deficit</dt><dd>Difference between the apical and peripheral pulses.</dd>
      <dt>sanguineous</dt><dd>Bloody (as in drainage).</dd>
      <dt>serosanguineous</dt><dd>Yellowish mixed with light red or pale pink (as in drainage).</dd>
      <dt>serous</dt><dd>Serum like or yellow (as in drainage).</dd>
    </dl>
    <h4>Priority and Interrelated Concepts</h4>
    <p>Priority concepts: Gas Exchange, Pain. Interrelated concepts: Infection, Tissue Integrity.</p>
    <p>Rudimentary surgical procedures were done as early as 10,000 BCE (trepanation — boring/cutting bone from the skull). Modern surgery is performed under strict conditions designed to enhance patient safety, for purposes ranging from diagnosis to cure. Nurses provide care in the preoperative, intraoperative, and postoperative phases (together the perioperative experience). The generalist nurse does not typically attend the intraoperative phase.</p>
    <h4>Table 9.1 — Reasons for Surgical Procedures</h4>
    <table><tr><th>Purpose</th><th>Definition</th><th>Example</th></tr>
    <tr><td>Cosmetic</td><td>Reshape normal structures to improve appearance/self-image; usually elective</td><td>Abdominoplasty, facelift, rhinoplasty</td></tr>
    <tr><td>Curative</td><td>Resolve a health problem by repairing or removing the cause</td><td>Removal of cancerous tumor; removal of gallbladder</td></tr>
    <tr><td>Diagnostic</td><td>Determine origin/cause of a disorder via tissue sample</td><td>Breast biopsy; joint arthroscopy</td></tr>
    <tr><td>Palliative</td><td>Increase quality of life (often reduce pain); noncurative</td><td>Ileostomy creation; stent placement; thoracentesis</td></tr>
    <tr><td>Preventative</td><td>Intent that a condition will not develop</td><td>Prophylactic bilateral mastectomy (BRCA1/2)</td></tr>
    <tr><td>Reconstructive</td><td>Improve functional ability of damaged structures</td><td>Total hip/knee replacement</td></tr>
    <tr><td>Transplantation</td><td>Replace a malfunctioning structure</td><td>Heart/kidney transplant</td></tr>
    </table>
    <h4>Table 9.2 — Categories by Urgency and Approach</h4>
    <table><tr><th>Category</th><th>Description</th><th>Examples</th></tr>
    <tr><td>Elective</td><td>Planned, nonacute</td><td>Cataract removal, hernia repair, hemorrhoidectomy, total joint replacement</td></tr>
    <tr><td>Urgent</td><td>Prompt intervention; life-threatening if delayed &gt;24–48hr</td><td>Intestinal/bladder obstruction, kidney/ureteral stones, bone fracture, eye injury, acute cholecystitis</td></tr>
    <tr><td>Emergent</td><td>Immediate intervention, life-threatening</td><td>Gunshot/stab wound, severe bleeding, AAA, compound fracture, appendectomy</td></tr>
    <tr><td>Simple</td><td>Only overtly affected areas involved</td><td>Simple/partial mastectomy</td></tr>
    <tr><td>MIS</td><td>Performed via endoscope(s) in a body cavity/area</td><td>Arthroscopy, tubal ligation, hysterectomy, lung lobectomy, CABG, cholecystectomy</td></tr>
    <tr><td>Radical</td><td>Extensive surgery beyond obviously involved area</td><td>Radical prostatectomy, radical hysterectomy</td></tr>
    </table>
    <h4>Safety During the Surgical Experience</h4>
    <p>Nurses and the interprofessional team anticipate safety needs before, during, and after surgery. Some complications are "never events." Numerous initiatives standardize care and communication.</p>
    <p><b>National Patient Safety Goals — Surgery box:</b> For 2022, NPSGs for surgery focus on (1) correct procedure, correct patient, correct body location; (2) marking the correct surgical site; (3) pausing before surgery (time-out) to ensure no mistakes.</p>
    <p><b>SBAR</b> — effective communication system for hand-offs: situation, background, assessment, recommendation/request.</p>
    <p><b>Surgical Care Improvement Project (SCIP)</b> — core compliance measures initiated 2006 to reduce surgical complications: prophylactic antibiotics, urinary catheter discontinuation timing, VTE prophylaxis.</p>
    <p><b>Surgical Safety Checklist</b> — recommended by WHO, Joint Commission, AORN. Columns: Procedure Check-in, Sign-in (preop ready area, before anesthesia induction — patient/rep confirms with RN, RN confirms identity/procedure/site/consent/site marked), Time-out (before skin incision, initiated by designated team member — all other activities suspended except life-threatening emergency), Sign-out (before patient leaves OR — RN confirms). Special checklist items: beta blocker given, VTE prophylaxis ordered, normothermia measures.</p>
    <p><b>TeamSTEPPS®</b> — system to facilitate communication between providers, designed by DOD and AHRQ; shown effective in surgical environment; promotes communication, safety, interprofessional teamwork.</p>
  `},
  {id:'src2', title:'Preoperative Phase — Assessment', open:false, html:`
    <p>The preoperative phase begins when the patient is scheduled for surgery and ends at transfer to the surgical suite. Care focuses on preparing the patient and ensuring safety, including assessing knowledge/educational needs and reducing anxiety/complications.</p>
    <h4>Box 9.1 — Taking a Preoperative History</h4>
    <ul><li>Age</li><li>General status of health</li><li>Review of systems</li><li>Medical history</li><li>Current medical problems and treatment</li><li>Allergies, including latex sensitivity</li><li>History of any type of prostheses</li><li>Surgical history — prior procedures and tolerance</li><li>Prior anesthesia experience (arousal difficulty, N/V)</li><li>Prior postsurgical pain control experience</li><li>Social history — tobacco/alcohol/illicit substance use</li><li>Current drugs (Rx and OTC)</li><li>Complementary/alternative therapies</li><li>Family history — relevant surgeries/outcomes, MH, cancer, bleeding disorder, anesthesia reactions</li><li>Psychosocial status — knowledge/understanding, comfort level, support system adequacy</li><li>Cultural/spiritual needs</li><li>Desire for/against autologous or directed blood donation</li><li>Requests for postsurgical cultural/spiritual support</li></ul>
    <h4>Box 9.2 — Selected Factors That Increase Risk for Surgical Complications</h4>
    <p><b>Age:</b> older than 65 years. <b>Medications:</b> antihypertensives, tricyclic antidepressants, anticoagulants, NSAIDs, immunosuppressive drugs. <b>Medical History:</b> decreased immunity, diabetes, pulmonary disease, cardiac disease, hemodynamic instability, multisystem disease, coagulation defect, anemia, dehydration, infection, hypertension, hypotension, any chronic disease. <b>Prior Surgical Experiences:</b> less-than-optimal emotional reactions, anesthesia reactions/complications, postoperative complications. <b>Health History:</b> malnutrition/obesity, substance use/misuse, altered coping ability, herbal preparation use. <b>Family History:</b> malignant hyperthermia, cancer, bleeding disorder, anesthesia reactions. <b>Type of Surgical Procedure Planned:</b> neck/oral/facial (airway complications), chest/high abdominal (pulmonary complications), abdominal (paralytic ileus, VTE risk).</p>
    <h4>Table 9.3 — ASA Physical Status Classification System</h4>
    <table><tr><th>Class</th><th>Definition</th><th>Examples</th></tr>
    <tr><td>ASA I</td><td>Normal healthy patient</td><td>Healthy, nonsmoking, no/minimal alcohol use</td></tr>
    <tr><td>ASA II</td><td>Mild systemic disease</td><td>Current smoker, social drinker, pregnancy, obesity (BMI 30–40), well-controlled DM/HTN, mild lung disease</td></tr>
    <tr><td>ASA III</td><td>Severe systemic disease</td><td>Poorly controlled DM/HTN, COPD, morbid obesity (BMI≥40), active hepatitis, alcohol dependence, pacemaker, moderate EF reduction, ESRD on dialysis, MI/CVA/TIA/CAD >3mo ago</td></tr>
    <tr><td>ASA IV</td><td>Constant threat to life</td><td>MI/CVA/TIA/CAD &lt;3mo ago, ongoing cardiac ischemia, severe valve dysfunction, severe EF reduction, sepsis, DIC, acute renal dysfunction/ESRD not on dialysis</td></tr>
    <tr><td>ASA V</td><td>Moribund, not expected to survive without operation</td><td>Ruptured AAA/thoracic aneurysm, massive trauma, intracranial bleed with mass effect, ischemic bowel with cardiac pathology</td></tr>
    <tr><td>ASA VI</td><td>Declared brain-dead, organs removed for donation</td><td>—</td></tr>
    </table>
    <p>Addition of "E" denotes emergency surgery (delay would lead to significant increased threat to life or body part). Originally approved 2014, last amended Dec 2020.</p>
    <p>Medical history matters because chronic illnesses increase surgical risk (e.g., lupus may need additional stress-offsetting drugs; rheumatoid arthritis needs special positioning considerations; any infection requires intervention/possible cancellation).</p>
    <p>Cardiac: CAD, angina, MI within 6 months, heart failure, HTN, dysrhythmias increase risk; impair ability to withstand hemodynamic changes; higher MI risk intraop with existing heart problems; beta-blocker patients should continue therapy.</p>
    <p>Pulmonary: complications more likely in older adults, chronic respiratory problems, smokers. Increased chest rigidity/loss of elasticity reduces anesthetic excretion. Smoking increases carboxyhemoglobin, decreasing O2 delivery. Decreased ciliary action leads to retained secretions, pneumonia, atelectasis. Chronic lung disease (asthma, emphysema, chronic bronchitis) reduces elasticity/gas exchange.</p>
    <h4>Box 9.3 — Review of Systems</h4>
    <p><b>General:</b> fevers/chills, weakness. <b>Eyes:</b> dryness/infection, vision changes. <b>ENT/Mouth:</b> ear drainage/pain, hearing/breathing changes, sinus tenderness, oral lesions, dentition changes, swallowing difficulty. <b>Cardiovascular:</b> edema, exercise intolerance, pain, palpitations, VTE, ischemic heart disease history. <b>Respiratory:</b> cough with sputum/blood, pain/SOB with breathing, OSA. <b>GI:</b> new masses/tenderness, bowel changes. <b>GU:</b> pain/burning urination, frequency/urgency/incontinence, bladder changes. <b>Musculoskeletal:</b> clubbing/cyanosis, joint pain, extremity symmetry, ROM changes. <b>Integumentary:</b> dryness, rashes, lesions, ulcerations. <b>Neurologic:</b> memory/orientation changes, one-sided weakness, numbness/tingling, balance loss, cerebrovascular disease history. <b>Psychiatric:</b> mood, depression/anxiety about surgery. <b>Endocrine:</b> increased thirst/urination, weight changes. <b>Hematologic/Lymphatic:</b> swollen nodes, new bleeding, nonhealing wounds. <b>Allergic/Immunologic:</b> seasonal/food/chemical allergies, immune system changes.</p>
    <p><b>Critical Rescue:</b> Monitor for cluster of elevated end-tidal CO2, decreased O2 saturation, and tachycardia to identify MH symptoms. Alert surgeon/anesthesia provider immediately.</p>
    <p>MH may start immediately after induction, hours into procedure, or after completion. Symptoms: tachycardia, dysrhythmias, muscle rigidity of jaw/upper chest, hypotension, tachypnea, skin mottling, cyanosis, myoglobinuria. Most sensitive indicator: unexpected rise in end-tidal CO2 with decreased O2 sat and tachycardia. Extremely elevated temp (up to 111.2°F/44°C) is a late sign. Dantrolene sodium is the only drug approved for MH treatment.</p>
    <p><b>Patient-Centered Care: Genetics/Genomics — Malignant Hyperthermia.</b> Always ask about prior anesthesia experiences, especially with isoflurane, sevoflurane, desflurane. Genetic predisposition at risk with halothane, enflurane, isoflurane, desflurane, sevoflurane, succinylcholine. CHCT muscle biopsy is most-used test; genetic blood test for RYR1 gene mutation also available; genetic test cost may not be insurance-covered.</p>
    <p>Older patients: increased complication risk. Normal aging decreases immune function and delays wound healing; chronic illness frequency increases; gas exchange more affected by general anesthesia/opioids; age-related kidney/liver changes may delay elimination of anesthetic/analgesic agents.</p>
    <h4>Table 9.4 — Age-Related Changes as Surgical Risk Factors</h4>
    <table><tr><th>System</th><th>Change</th><th>Intervention</th><th>Rationale</th></tr>
    <tr><td>Cardiovascular</td><td>↓ cardiac output, ↑ BP, ↓ peripheral circulation</td><td>Determine activity levels/note fatigue; monitor VS/pulses/cap refill</td><td>Know limits/detect deviations</td></tr>
    <tr><td>Respiratory</td><td>Reduced vital capacity, loss of elasticity, ↓ oxygenation</td><td>Teach coughing/deep breathing; monitor respirations</td><td>Prevent pulmonary complications/detect deviations</td></tr>
    <tr><td>Renal/Urinary</td><td>↓ blood flow, reduced waste excretion, ↓ GFR, nocturia</td><td>Monitor I&O/hydration/electrolytes; assist toileting at night</td><td>Detect imbalances; prevent incontinence/falls</td></tr>
    <tr><td>Neurologic</td><td>Sensory deficits, slower reaction, cognitive impairment, ↓ adjustment ability</td><td>Orient patient; allow extra teaching time; keep informed; ensure safety</td><td>Individualized teaching plan; prevent falls/injury</td></tr>
    <tr><td>Musculoskeletal</td><td>Deformities from osteoporosis/arthritis</td><td>Assess mobility; teach turning/positioning; encourage ambulation; falls precautions</td><td>Prevent immobility complications/injury</td></tr>
    <tr><td>Skin</td><td>Dry, less subq fat, slower healing, ↑ infection risk</td><td>Assess skin; pad bony prominences; pressure-reducing overlays; avoid tape; teach position change q2h; use safe patient-handling devices</td><td>Detect changes; prevent pressure injury/shearing</td></tr>
    </table>
    <p>Allergy note: historically some patients received misinformation connecting shellfish allergy to iodine — shellfish allergy is to tropomyosin, not iodine (naturally occurring in the body); evidence shows no cross-reactivity between shellfish allergy and topical povidone-iodine/iodinated contrast. Avocado/banana/strawberry/other fruit allergy may indicate latex sensitivity. Egg/peanut/soy allergy → risk for reaction to propofol.</p>
    <p>Autologous donation: patient donates own blood weeks before surgery for reinfusion; agency-specific criteria apply. Special tag on blood bag; matching tag given to patient. Directed donation: family/friends donate for patient specifically if compatible; special tag with names/signature; not practiced at all centers.</p>
    <p>Bloodless surgery/MIS alternatives for medical/religious restrictions on transfusion; professional ethics require honoring religious-based requests. Techniques: limiting blood sample volume/number, epoetin alfa stimulation of RBC production, supplemental iron/folic acid/B12/vitamin C. Cell salvage (blood salvage): suctions/washes/filters blood for reinfusion — no outside disease risk, no amount limit, cost-effective, viable for patients declining transfusion for personal reasons.</p>
    <p>Discharge planning starts before surgery — assess home environment, self-care, support systems for all patients regardless of procedure minority or surgical history. Older/dependent patients may need transportation referrals, home care nursing, or rehab admission (esp. joint replacement).</p>
  `}
];
</script>
<script>
SRC_CHAPTERS.push(
  {id:'src3', title:'Preop Labs, Teaching, Consent & Preparation', open:false, html:`
    <h4>Physical Assessment / Laboratory / Imaging Assessment</h4>
    <p>Obtain complete VS (possibly multiple times for accurate baseline); previous VS from other admissions helpful. Abnormal VS may warrant postponement. Anxiety can increase BP/pulse/RR. Older/chronically ill patients have higher morbidity/mortality risk.</p>
    <p><b>Older Adult Health box — Preoperative Care:</b> greater incidence of chronic illness, malnutrition/dehydration, more allergies, more abnormal labs (anemia, low albumin), impaired self-care, inadequate support systems, decreased stress tolerance, ↑ cardiopulmonary complication risk, risk for mental status change, ↑ falls risk, mobility changes affecting recovery.</p>
    <p>Cardiovascular assessment: check for HTN (common, often undiagnosed); document heart sounds; ask about VTE history; assess hands/feet for temp/color/pulses/cap refill/edema; report absent pulses, pitting edema, cardiac symptoms, chest pain, SOB/dyspnea; determine implantable device function (pacemaker/ICD).</p>
    <p>Respiratory: established by age, smoking history (incl. secondhand smoke), chronic illness. Obesity patients may have undiagnosed OSA. Observe posture/effort/rate/rhythm/depth; auscultate; document clubbing/cyanosis.</p>
    <p>Kidney function affects drug/waste excretion. Reduced GFR decreases anesthetic excretion. Opioids/benzodiazepines/barbiturates can cause confusion/apprehension/restlessness with decreased kidney function. Ask about urinary frequency, dysuria, nocturia, difficulty starting flow, oliguria, urine appearance/odor.</p>
    <p>Neurologic status: mental status, LOC, orientation, command-following. Evaluate mental status, muscle strength, gait steadiness, independence. <b>NPSG — Fall Assessment:</b> assess fall risk and implement safety measures.</p>
    <p>Musculoskeletal: may interfere with positioning; document neck/chest shape features affecting respiratory/cardiac function; note prostheses and report to operative personnel.</p>
    <p><b>Action Alert:</b> ask about joint replacement history, document exact prosthesis location, communicate to operative personnel so electrocautery pads avoid the prosthesis area, bony prominences, pacemakers, scar tissue, hair, tattoos, weight-bearing surfaces, pressure points, metal piercings.</p>
    <h4>Laboratory Assessment</h4>
    <p>Preadmission testing (PAT) may occur 24 hours to 28 days before surgery; results usually valid unless condition changes or patient takes drugs altering values (warfarin, aspirin, diuretics). Common tests: urinalysis, blood type/screen, CBC (or Hgb/Hct), clotting studies (PT, INR, aPTT, platelets), metabolic panel (glucose, electrolytes, kidney/liver function, serum proteins), pregnancy test (female patients).</p>
    <p><b>Critical Rescue:</b> recognize potassium imbalance on lab review; hypokalemia increases digoxin toxicity risk, slows anesthesia recovery, increases cardiac irritability; hyperkalemia increases dysrhythmia risk with anesthesia. Communicate to surgeon/anesthesia/perioperative team.</p>
    <p>Imaging: chest x-ray for respiratory history patients (shows pneumonia/TB, or conditions causing cancellation like heart failure/cardiomyopathy/infiltrates). CT/MRI as indicated (e.g., back pain before spinal surgery).</p>
    <p>ECG for cardiac disease/risk history patients undergoing general anesthesia; some agencies use an age threshold (40 or 45). Abnormal/life-threatening ECG results may cancel surgery until cardiac status stable.</p>
    <h4>Priority Preoperative Problems</h4>
    <p>1. Need for health teaching due to unfamiliarity with surgical procedures/preparation. 2. Anxiety due to fear of new/unknown experience, pain, surgical outcomes.</p>
    <h4>Teaching & Informed Consent</h4>
    <p>ERAS® Society: multimodal perioperative care pathway for early recovery after major surgery; free evidence-based guidelines for many surgery types.</p>
    <p><b>Action Alert:</b> before surgery, provide information about informed consent, dietary restrictions, specific preparation, postop exercises, pain management plans.</p>
    <p>Consent requires understanding: nature/reason for surgery; who performs it and if others present; treatment options and risks/benefits; surgical risks/outcomes; anesthesia risks; blood product risks/benefits/alternatives. Written record on specific consent form or in surgeon's notes.</p>
    <p><b>Legal/Ethical — Informed Consent:</b> legal guardian consent needed if patient unable. Surgeon explains procedure/risks/benefits. Nurse witnesses signature and can advocate for further clarity if patient/guardian seems unclear.</p>
    <h4>Box 9.4 — Preoperative Teaching Checklist</h4>
    <p><b>Patient Teaching:</b> addressing fears/anxieties; outlining procedure; explaining preop routines (NPO, blood samples, showering); informing about expected lines/catheters; pain control methods postop; coughing/turning/deep breathing/incentive spirometry; lower extremity exercises/stockings/compression devices; splinting importance; wound cleansing/dressing changes/infection monitoring; early ambulation importance.</p>
    <p><b>Family/Caregiver Teaching (with consent):</b> all patient content plus assisting movement/ambulation, nutritional needs help, reminding about lifting restrictions.</p>
    <p>Surgeon responsible for full procedure explanation and signed consent before sedation; perioperative nurse not responsible for detailed procedure info — clarifies facts/dispels myths only.</p>
    <p><b>NPSG — Right to Refuse Treatment:</b> patients must be informed/involved in decisions; competent adults may refuse treatment for any reason.</p>
    <p><b>Action Alert:</b> if patient not adequately informed/has questions/site discrepancy exists, professional/ethical duty to contact surgeon for clarification; document.</p>
    <p>Patients unable to write sign with X, witnessed by two people (nurse may be one). No POA + can't consent + life-threatening: written consultation with ≥2 unaffiliated providers legally supports the decision. Blind patients sign own consent (witnessed by two). Non-English-speaking/hearing-impaired patients require qualified translator + second witness; family may NOT translate.</p>
    <p>Some procedures (sterilization, experimental, anesthesia/blood product admin) may need special consent per agency/local/national policy.</p>
    <p><b>NPSG — Site Marking:</b> site marked prior to first incision by the licensed independent practitioner performing surgery, and by the patient when possible.</p>
    <p><b>Action Alert:</b> surgeon accountable for site marking, done before transfer to surgical suite; document if done on med-surg unit before transport.</p>
    <p>Patient Self-Determination Act mandates advance directive rights (living will, durable POA); surgery is not an exception to advance directives.</p>
    <h4>Dietary Restrictions</h4>
    <p>NPO status regardless of surgery/anesthesia type: no eating, drinking (incl water), smoking, oral meds (unless directed). Decreases gastric secretion volume/aspiration risk. Outpatients/same-day admits get written+oral NPO timing instructions.</p>
    <p>Exact NPO time depends on procedure timing. Patients (esp. older adults) fasting ≥8hr may have fluid/electrolyte/glucose imbalances. Recommendations: no fried/fatty food/meat within 8hr; no other food within 6hr; no clear liquids within 2hr (some surgeons stricter).</p>
    <p><b>Action Alert:</b> emphasize NPO adherence importance — failure can postpone/cancel surgery and increase aspiration risk.</p>
    <p>Carbohydrate loading drink (nondiabetic patients only) may be ordered night before + 2hr before induction; evidence mixed on benefit (some show improved hunger/thirst perception and glucose/insulin benefit; inconclusive for lumbar spine surgery).</p>
    <h4>Regularly Scheduled Drugs & Diabetes Management</h4>
    <p>Consult surgeon/anesthesia for drug schedule changes (diabetes, cardiac, glaucoma, anticonvulsants, antihypertensives, anticoagulants, antidepressants, corticosteroids). Some OTC/herbal drugs must stop at specified times. Cardiac/respiratory/seizure/HTN drugs commonly allowed with a sip of water. Some antihypertensive/antidepressant drugs withheld day-of to reduce BP effects. Beta blockers may be newly ordered for at-risk patients.</p>
    <p>Diabetes recommendations: SGLT2 inhibitors stop 3–4 days before surgery; other oral agents/GLP-1 agonists stop morning of surgery; once-daily basal insulin continues (surgeon determines dose reduction); twice-daily basal insulin — consult surgeon; basal+prandial/premixed insulin — consult surgeon; insulin pump continues usual basal rate unless surgeon specifies otherwise.</p>
    <h4>Intestinal Prep, SSI Prevention, Skin Prep</h4>
    <p>Bowel prep needed for major abdominal/pelvic/perineal/perianal surgery to prevent colon injury and reduce bacteria; surgeon preference/procedure type determines method. Enemas/laxatives can cause electrolyte/fluid imbalance, vagal stimulation, orthostatic hypotension; severe anal discomfort with hemorrhoids; include fall-prevention teaching.</p>
    <p><b>Evidence-Based Practice — Preventing SSIs (Bashaw & Keister, 2019):</b> SSIs are among most common/costly HAIs. Modifiable risk factors: underlying health, lifestyle, glycemic control, alcohol/smoking, dyspnea, diabetes, obesity, immunosuppression. Preop factors reducing SSI risk: bathing, hand hygiene, hair removal, antibiotic prophylaxis. Scrubbed personnel gowns can be contamination source if saturated. Nasal cavities are infection sources for cardiac/ortho/abdominal/spinal surgery — mupirocin nasal ointment reduces microbial transfer.</p>
    <p>Minimum preop bathing: full-body antimicrobial soap wash night before. 2% CHG-impregnated cloths increase CHG concentration to inhibit/kill contaminants (e.g., S. aureus); repeated application increases residual efficacy, followed by CHG skin prep. Hand hygiene before/after each encounter. Hair removal before entering OR if required. Antibiotic timed for peak efficacy before incision. Staff change saturated gowns. Nasal mupirocin reduces pathogen transfer.</p>
    <p>Skin prep is first step to reduce SSI. Surgeon may ask shower 1–2 days before with antiseptic (often chlorhexidine gluconate); repeated night before/morning of if hospitalized. Risk factors for contamination: hair follicle bacteria, disrupted skin protective mechanisms, nicks. Shaving increases infection potential — recommended method is evidence-based/professional-org-endorsed: electrical clippers or depilatory agent immediately before surgery start with aseptic principles.</p>
    <h4>Tubes, Drains, Vascular Access & Older Adult Dehydration</h4>
    <p>NG tube may decompress stomach/upper bowel before abdominal surgery, usually placed after anesthesia induction. Foley catheter may be placed before/during/after surgery. Drains remove surgical site fluid — teach not painful but may cause mild discomfort; don't kink/pull.</p>
    <p>Vascular access needed for general anesthesia and most other anesthesia types, for drug/fluid delivery. Dehydrated/at-risk patients may receive preop fluids. <b>Older Adult — Preventing Dehydration:</b> older patients at higher risk due to lower fluid reserves; hemodynamic monitoring essential with IV therapy in older/cardiac patients.</p>
    <p>IV access usually 18-gauge 1-inch catheter in arm, or 20-gauge in back of hand; larger vein = least resistance, esp for emergency rapid infusion. Placement location/timing depends on patient needs/agency policy.</p>
  `},
  {id:'src4', title:'Preop Teaching, Prep & Transfer', open:false, html:`
    <h4>Postoperative Procedures and Leg Exercises Teaching</h4>
    <p>Teach about postop procedures (dressing checks, frequent VS) and exercises that decrease respiratory/vascular complications. For leg exercises: discussion + demonstration + practice + return demonstration. Begin exercises early in recovery, 5–10 reps each, every 1–2 hours, continue at least first 48 hours; patient may need to be awakened.</p>
    <h4>Box 9.5 — Postoperative Leg Exercises</h4>
    <p><b>Exercise 1:</b> HOB elevated ~45°; bend right knee, raise foot off bed, hold; extend leg straightening knee, lower; repeat 5x each leg.</p>
    <p><b>Exercise 2:</b> point toes toward foot of bed, then toward face; repeat several times each leg.</p>
    <p><b>Exercise 3:</b> make ankle circles left then right; repeat each leg.</p>
    <p><b>Exercise 4:</b> bend knee, push ball of foot into bed until calf/thigh contract; repeat each leg.</p>
    <h4>Box 9.6 — Perioperative Respiratory Care</h4>
    <p><b>Deep (diaphragmatic) breathing:</b> sit upright edge of bed/chair, feet flat (postop: Fowler's/semi-Fowler's); gentle breath through mouth; breathe out gently/completely; deep breath nose+mouth, hold to count of 5; exhale nose+mouth.</p>
    <p><b>Expansion breathing:</b> comfortable position, knees slightly bent (decreases abdominal tension/respiratory resistance); hands on lower rib cage above waist; deep breath through nose using shoulder muscles to expand rib cage outward; exhale, moving chest then lower ribs inward while squeezing rib cage.</p>
    <p><b>Splinting the incision:</b> unless coughing contraindicated, place pillow/towel/blanket over incision, hold firmly; take 3 slow deep breaths to stimulate cough reflex; inhale nose, exhale mouth; on 3rd breath, cough to clear secretions while firmly holding splint.</p>
    <p>Coughing use varies by surgeon preference/surgery type. If coughing could harm the wound, deep-breathing/spirometer used instead. Hernia repair/craniotomy patients may get a "do not cough" order.</p>
    <h4>VTE Prevention Teaching</h4>
    <p>VTE (includes DVT, PE) is a potential surgical complication; always assess before surgery. Risk factors: obesity, age ≥40, cancer, spinal cord injury, hip fracture, total hip/knee replacement, decreased mobility, VTE/DVT/PE/varicose vein/edema history, oral contraceptives, smoking, decreased cardiac output.</p>
    <p>Sudden unilateral leg swelling + worsening calf ache with ambulation = classic DVT finding — report immediately; careful assessment prevents potentially fatal PE. Determine if anticoagulant ordered preop; teach patient. Teach about postop compression stockings/pneumatic devices.</p>
    <p>Remind about leg exercises promoting venous return; urge practice before surgery. Early ambulation benefits: stimulates intestinal motility, enhances lung expansion, mobilizes secretions, promotes venous return, prevents joint rigidity, relieves pressure. Teach turning at least q2h while confined to bed (staff turns initially if unable); turning restrictions possible for certain brain/spinal/ortho procedures — inform patient preop. Most patients OOB day of or day after surgery — dangling then chair/ambulation.</p>
    <h4>Minimizing Anxiety</h4>
    <p>Informed/educated patients better anticipate events, maintain self-control, are less anxious. Interventions: assess anxiety level; provide understanding-promoting information; allow time for questions; respond accurately, refer unanswered questions appropriately; encourage open communication without fear of judgment; promote rest (determine usual relaxation methods; surgeon may prescribe sedative/hypnotic); use distraction (music, TV, reading, visiting); teach family/caregiver (with consent) to increase support/involvement — family asking questions is a positive engagement sign.</p>
    <p>Inform patient/family of surgery time/schedule changes; give outpatient specific night-before/day-of instructions. Explain 30–60 minute OR-area prep period before surgery begins, and 1–2 hour typical PACU stay afterward (varies by surgery/anesthesia/complications/patient response). Provide waiting-area info and status-update devices where available.</p>
    <h4>Preoperative EHR Review & Patient Preparation</h4>
    <p>Review EHR to confirm all documentation/procedures/orders complete: signed/dated/witnessed consent form(s) matching scheduled procedure; site marked; allergies documented; accurate height/weight (for anesthesia dosing); all lab/radiographic/diagnostic results included and abnormal results reported; autologous/directed donation slips included; current VS (within 1–2hr of surgery time) recorded; special needs/concerns/advance directives reviewed and communicated.</p>
    <p>Patient prep: hospital gown (underpants may stay for above-waist surgery, socks except foot/leg surgery); antiembolism stockings/pneumatic devices applied if ordered. Valuables given to family/locked safely. Rings may need cutting if swelling risk. Pierced jewelry preferably removed. Religious emblems may be pinned to gown.</p>
    <p>ID band checked for name/hospital number/surgeon/birth date; separate (usually red) allergy bracelet; possible blood type-and-screen bracelet.</p>
    <p>Denture removal at anesthesia provider's discretion (may stay in for snug bag-mask fit) or removed to labeled denture cup; document capped teeth. Eyeglasses/hearing aids may stay until after induction per agency policy. Prosthetic devices (artificial eyes/limbs), contacts, wigs, toupees removed/stored safely. Hairpins/clips removed (conduct electrical current, scalp burn risk).</p>
    <p>Nail polish policy varies by agency — red polish doesn't affect pulse ox readings, but white/black polish and gel manicures can significantly impact readings; some agencies still require removal of at least one nail's polish/artificial nail.</p>
    <p>Ask patient to empty bladder just before transport — prevents incontinence/overdistention, baseline for I&O.</p>
    <h4>Preoperative Drugs & Transfer</h4>
    <p>Preop drug administration to hospitalized patients usually occurs in the preop area right before surgery, allowing final team assessments/discussions. Prophylactic antibiotics usually given within 30 minutes of incision, or 31–60 minutes before.</p>
    <p>Before transfer: review/update EHR, reinforce teaching, ensure correct surgical dress, administer prescribed preop drugs. Use preoperative checklist for smooth transfer, along with signed consent and patient ID card.</p>
    <p>Most inpatients transferred by stretcher with side rails up; special circumstances (traction, some ortho surgery, minimal-movement patients) use hospital bed transfer. Age/size/condition also influence the decision. Ambulatory patients may walk, use wheelchair, or stretcher.</p>
    <h4>Evaluation — Preoperative Outcomes</h4>
    <p>Expected outcomes: patient states understanding of informed consent/preop procedures; demonstrates postop exercises/complication-prevention techniques; verbalizes reduced anxiety.</p>
  `}
);
</script>
<script>
SRC_CHAPTERS.push(
  {id:'src5', title:'Anesthesia Types & Postoperative Phase Overview', open:false, html:`
    <h4>Postoperative Phase — PACU</h4>
    <p>Postop phase starts with completion of surgery and transfer to a specialized monitoring area (PACU or ICU); may extend beyond discharge until activity restrictions lifted. Perianesthesia care has three phases based on level of care needed, not physical location; not every patient transitions through all three.</p>
    <p><b>Phase I:</b> immediately after surgery, most often PACU (ICU for complicated/high-risk patients). Duration depends on health status, surgery, anesthesia type, recovery rate — ranges &lt;1hr to days. Requires ongoing airway/VS/recovery monitoring every 5–15 minutes initially, gradually spacing out.</p>
    <p><b>Phase II:</b> prepares patient for extended-care environment (med-surg unit, step-down, SNF, or home); may occur in PACU, med-surg unit, or SDS unit; may last 15–30 min though 1–2hr more typical. Discharged from this phase when presurgical LOC returned, O2 sat at baseline, VS stable. Some patients achieve this in Phase I and go directly home; others need more observation.</p>
    <p><b>Phase III:</b> extended-care environment, most often hospital unit or home; for continuing-care patients unable to go home, discharge may be to an extended-care agency. VS monitored several times daily to once daily.</p>
    <p>Ambulatory surgery units provide same-day care; patients recover in PACU environment advancing quickly Phase I→III for home discharge. Discharge criteria must be met. Unstable VS, poor gas exchange, excessive N/V, or unmanageable pain may require acute/extended-care admission.</p>
    <p>For hospitalized/anticipated-hospitalized patients, circulating nurse + anesthesia provider accompany patient to PACU; critical patients may transfer OR→ICU directly. Anesthesia provider + circulating nurse give PACU nurse verbal hand-off report.</p>
    <p><b>NPSG — Hand-off Reports:</b> requires effective communication between anesthesia provider, circulating nurse, and PACU/ICU nurse, reflecting a TeamSTEPPS®-like systematic approach.</p>
    <h4>Box 9.7 — Postoperative Hand-off Report Content</h4>
    <p>Type/extent of surgical procedure; anesthesia type and duration; allergies (esp. latex/drugs); primary language/sensory impairments/communication difficulties; special patient/family requests; preop/intraop respiratory function/dysfunction; health problems/pathophysiologic conditions; intraoperative complications and management/patient response (labs, blood loss, injuries); I&O incl. current IV fluids and estimated blood loss; type/amount of IV fluids/blood products given; medications given and last pain med dose; timing of next antibiotic/cardiac/other drug dose; location/type of incisions/dressings/catheters/tubes/drains/packing; prosthetic devices; joint/limb immobility in OR (esp. older patients); other relevant intraop positioning; current VS incl. temperature and O2 saturation.</p>
    <p>PACU nurse requires in-depth knowledge of anatomy/physiology, anesthetic agents, pharmacology, pain management, airway management, surgical procedures, ACLS. Patient monitored continuously; anesthesia provider/surgeon consulted as needed. Med-surg nurse receives patient from PACU after stability determined, with a hand-off report.</p>
    <h4>Postoperative Assessment — History & Physical/Signs</h4>
    <p>Med-surg nurse uses surgical team records + PACU hand-off to create individualized care plan; reviews preop assessment/EHR for history/physical/emotional status.</p>
    <p>Ambulatory discharge-to-home criteria (agency-specific): stable VS; normal body temp; no overt bleeding; return of gag/cough/swallow reflexes; ability to take liquids; adequate urine output.</p>
    <p><b>Action Alert:</b> perform initial assessment and continue monitoring respiratory status for any patient who had general anesthesia/moderate sedation or received sedative/opioid drugs.</p>
    <p><b>Critical Rescue:</b> all postop patients remain at risk for pneumonia, shock, cardiac arrest, respiratory arrest, VTE, and GI bleeding — notify surgeon immediately for any signs/symptoms.</p>
    <h4>Box 9.8 — Potential System Complications of Surgery</h4>
    <p><b>Respiratory:</b> atelectasis, laryngeal edema, pneumonia, pulmonary edema, PE, ventilator dependence. <b>Cardiovascular:</b> anaphylaxis, anemia, DIC, dysrhythmias, heart failure, HTN, hypotension, hypovolemic shock, sepsis, VTE (esp. DVT). <b>Neurologic:</b> cerebral infarction, cognitive decline, visual loss. <b>Neuromuscular:</b> hyperthermia, hypothermia, joint contractures, nerve damage/paralysis. <b>GI:</b> ulcers/bleeding, paralytic ileus. <b>Kidney/Urinary:</b> AKI, acute urinary retention, electrolyte imbalances, stone formation, UTI. <b>Skin:</b> pressure injuries, rashes/contact allergies, wound infection, dehiscence, evisceration.</p>
    <h4>Anesthesia Overview</h4>
    <p>General anesthesia = reversible loss of consciousness from inhibiting neuronal impulses in several CNS areas; single agent or combination. Local anesthesia = brief disruption of sensory nerve impulse transmission from a specific area/region; delivered topically or by local infiltration; patient remains conscious/follows instructions.</p>
    <p><b>Four stages of general anesthesia:</b> Stage 1 (analgesia/sedation/relaxation — help patient relax); Stage 2 (excitement/delirium — protect extremities, suction as needed); Stage 3 (operative/surgical anesthesia — intubation); Stage 4 (danger — cardiac/pulmonary arrest risk).</p>
    <p>Complications: malignant hyperthermia (dantrolene treatment); overdose; unrecognized hypoventilation (anesthesia-induced gas exchange failure); complications of specific anesthetic agents; complications of intubation (broken teeth, vocal cord trauma).</p>
    <p>Regional anesthesia = local anesthesia blocking multiple peripheral nerves in a specific region: field block (series of injections around operative site), nerve block (injection to nerves of involved site), spinal block (injection into CSF around subarachnoid space), epidural block (injection into epidural space).</p>
    <p>Complications: anaphylaxis, incorrect delivery technique, systemic absorption, overdose, local complications. Treatment: establish open airway, give oxygen, notify surgeon; fast-acting barbiturate is usual treatment; epinephrine for unexplained bradycardia.</p>
    <p>Conscious sedation = IV sedative/hypnotic/opioid delivery reducing consciousness level; patient maintains patent airway and responds to verbal commands; short amnesia action with rapid ADL return. Common drugs: etomidate, diazepam, midazolam, meperidine, fentanyl, alfentanil, morphine sulfate.</p>
    <h4>Box 9.9 — Immediate Postoperative Neurologic Assessment</h4>
    <p><b>Order of return to consciousness after general anesthesia:</b> 1. Muscular irritability; 2. Restlessness and delirium; 3. Recognition of pain; 4. Ability to reason and control behavior.</p>
    <p><b>Order of return of motor/sensory function after local/regional anesthesia:</b> 1. Sense of touch; 2. Sense of pain; 3. Sense of warmth; 4. Sense of cold; 5. Ability to move.</p>
    <p><b>Older Adult — Regaining Orientation:</b> older adults may take longer to return to presurgical orientation; preop drugs/anesthetics can slow this. Delirium prevention: sensory needs (glasses/hearing aids), early ambulation if possible, family bedside presence, effective pain management, sleep/nutrition mindfulness, calm environment, cognitive stimulation.</p>
    <p>Compare presurgical/postsurgical neuro status; monitor LOC every 4–8 hours (or per policy). Patients with altered cerebral function preop usually continue that alteration postop.</p>
    <p>Delirium screening/prevention: routine screening for early symptoms; reliable tools include CAM-ICU (adapted from Confusion Assessment Method) or RASS. mHELP (modified Hospital Elder Life Program) bundle: maintain environmental orientation with visual/hearing aids; meet nutrition/fluid/sleep needs; promote mobility and family/loved-one involvement.</p>
    <p>Motor/sensory function after general anesthesia (esp. spinal/epidural) altered — general anesthesia depresses all voluntary motor function; regional anesthesia alters only part of the body.</p>
    <p><b>Systems Thinking/QI — Preventing Postoperative Delirium (Shaji & McCabe, 2021):</b> postop delirium alters cognition/thinking, more common in older adults (esp. &gt;65); can impede healing, delay discharge, increase mortality risk. Interventions: staff education on age/neuro complication relationship and early sign recognition; sleep-conducive environment; evidence-based screening (e.g., NEECHAM Confusion Scale); mHELP implementation; family involvement in reporting baseline behavior/cognition changes. Commentary: interventions transferable across care settings; unified approach improves early identification/intervention.</p>
    <p>Assess sensation loss via monofilament pinprick (sharp vs dull/pressure). Evaluate motor function via bilateral extremity movement/strength comparison. Test sympathetic nervous system tone return by gradually elevating head, monitoring for hypotension — begin after sensation returns to at least spinal dermatome level T10.</p>
    <h4>Box 9.10 — Serious Complications of Spinal and Epidural Anesthesia</h4>
    <p><b>Respiratory Depression</b> (anesthetic moving higher in epidural/subarachnoid space): assess breathing quality/pattern/rate/depth, O2 delivery/pulse ox; notify anesthesia provider if pulse ox &lt;95% or unable to increase respiration depth.</p>
    <p><b>Hypotension</b> (regional anesthesia causes vasodilation): assess BP trend vs baseline, pulse pressure widening; notify if systolic BP &gt;10mmHg below baseline or autonomic blockade symptoms (bradycardia, N/V) present.</p>
    <p><b>Epidural Hematoma:</b> assess for delayed/regressing sensory-motor return, worsening deficits, regressing deep tendon reflexes (compare sides), back pain/pressure with coughing/straining — notify immediately if any worsen.</p>
    <p><b>Infection (Meningitis):</b> assess mental status changes, increasing temperature, neck turning ability; notify for temp &gt;101°F (38.3°C), inability to move neck, acute confusion.</p>
    <p><b>Postdural Puncture Headache:</b> assess for occipital headache, especially when sitting upright.</p>
  `},
  {id:'src6', title:'Postoperative Systems Assessment — Full Detail', open:false, html:`
    <h4>Respiratory System</h4>
    <p>Immediately assess patent airway on floor admission — talking is not a reliable adequacy indicator. Document artificial airway type (ET, nasal trumpet, oral airway) if present, and O2 delivery device/concentration. Continuously monitor pulse ox — SpO2 should be above 95% (or patient's baseline). Check lungs at least q4h first 24hr, then q8h or per policy; older/smoking/lung-disease/obese patients assessed more frequently.</p>
    <p><b>Critical Rescue:</b> if SpO2 drops below 95% (or baseline), immediately notify surgeon/anesthesia provider; emergency response if condition deteriorates.</p>
    <p>RR &lt;10/min may indicate anesthetic/opioid-induced depression; rapid shallow respirations may signal shock/cardiac problems/↑ metabolic rate/pain. Auscultate all lung fields; check symmetry/chest wall movement; inspect for accessory muscle use, sternal retraction, diaphragmatic breathing (may indicate excessive anesthetic effect/airway obstruction/paralysis → hypoxia). Listen for snoring/stridor (airway obstruction from spasm/edema/mucus/tongue relaxation). Retained neuromuscular blocking agents can impair diaphragm function — symptoms: inability to maintain head lift, weak hand grasps, abdominal breathing pattern.</p>
    <h4>Cardiovascular System</h4>
    <p>Assess VS for trends vs presurgical values. Report BP changes 25% higher/lower than presurgical (or 15–20 point systolic/diastolic difference) to surgeon/anesthesia provider. Decreased BP/pulse pressure/abnormal heart sounds may indicate cardiac depression, fluid deficit, shock, hemorrhage, or drug effects.</p>
    <p>Bradycardia could indicate anesthesia effect or hypothermia (older patients at risk due to hypothalamus changes, low body fat, cool OR exposure). Increased pulse could indicate hemorrhage, shock, or pain.</p>
    <p>Cardiac monitoring may be ordered. Compare apical vs peripheral (radial) pulse rate/rhythm/quality if not continuously monitored — a pulse deficit could indicate a dysrhythmia.</p>
    <p>Daily peripheral vascular assessment (anesthesia/positioning may impair circulation, contribute to clotting/VTE/DVT). Compare distal pulses bilaterally, observe color/temp, evaluate sensation/motion, determine cap refill speed. Palpable pedal pulses indicate adequate leg circulation/perfusion.</p>
    <p>PE is leading cause of preventable in-hospital death — prophylaxis is the most important patient safety strategy. Surgeon may order antiembolism stockings, pneumatic compression devices, and/or prophylactic drug (e.g., enoxaparin).</p>
    <p><b>Action Alert:</b> evaluate all patients for VTE risk, ensure prophylactic measures in place (stockings, compression devices, leg exercises, early mobility, drug therapy).</p>
    <p>Antiembolism (TED/compression) stockings provide graduated compression from foot/ankle up. Measure leg length/circumference for correct sizing; elastic wraps if legs too large/small for stockings. Ensure not too loose (ineffective) or too tight (inhibits flow); remove 2–3x/day for 30 minutes for skin inspection/care.</p>
    <p>Pneumatic compression devices enhance venous flow via intermittent compression periods. Measure legs, order correct size; place boots, set/check compression pressures (usually 35–55 mmHg).</p>
    <h4>Fluid, Electrolyte, and Acid-Base Balance</h4>
    <p>NPO status, intraop fluid loss, and fluid/blood type/amount given affect postsurgical balance. Sodium/potassium/chloride/calcium imbalances possible, more common in older/DM/heart-failure patients.</p>
    <p>Continue I&O measurement; document IV intake, vomitus, urine, wound drainage, NG drainage. Assess hydration via mucous membrane color/moisture, skin turgor/texture/"tenting" (test over sternum or forehead in older adults), dressing drainage amount, presence/absence of axillary sweat. Compare total output (NG, urine, wound) vs total intake for imbalance; consider insensible losses (sweat).</p>
    <p>IV fluids closely monitored; isotonic solutions (LR, 0.9% NS, D5LR) may be used in PACU; type/rate based on need on the med-surg unit. Acid-base balance affected by respiratory status, metabolic surgical changes, and acid/base losses in drainage — e.g., NG/vomitus losses cause metabolic alkalosis. Monitor ABG and other labs for acid-base consequences.</p>
    <h4>Kidney/Urinary System</h4>
    <p>Urinary control may return immediately or take hours postop. Preop drugs (esp. atropine), anesthetics, or surgical manipulation can cause urine retention — assess via inspection/gentle palpation of lower abdomen or bladder scanner. Retention/incontinence may require intermittent or indwelling catheterization.</p>
    <p>If Foley present, assess urine color/clarity/amount. If voiding, assess frequency/amount/symptoms; place urine hat as reminder to save output for measurement.</p>
    <p>Urine output should approximate total 24hr intake; consider sweat/vomitus/diarrhea as output sources. Report output &lt;30 mL/hr (240 mL/8hr shift) to surgeon — may indicate hypovolemia/renal complications.</p>
    <h4>Gastrointestinal System</h4>
    <p>PONV is most common postop reaction; many general-anesthesia patients have GI upset within first 24hr. Higher risk: motion sickness history, obesity (anesthetics retained in fat cells longer), abdominal surgery, opioid use (↓ peristalsis).</p>
    <p>Preventive drugs often started preop: ondansetron, dexamethasone (may slightly ↑ glucose in nondiabetic patients first 12hr postop). PONV can stress/irritate abdominal-GI wounds, ↑ ICP (head/neck surgery), ↑ intraocular pressure (eye surgery), ↑ aspiration risk. Side-lying before slowly raising HOB reduces nausea.</p>
    <p>Peristalsis return delayed by prolonged anesthesia, bowel handling, opioids. Decreased/no peristalsis common ≥24hr after pelvic/abdominal surgery, may persist days for GI surgery. Listen for bowel sounds all 4 quadrants + umbilicus; turn off NG suction before listening. Active bowel sounds usually indicate peristalsis return, but absence doesn't confirm its absence — true indicator is passage of flatus/stool. Abdominal cramping + distention = trapped nonmoving gas, not peristalsis.</p>
    <p>Decreased peristalsis occurs with paralytic ileus — distended abdominal wall, no visible intestinal movement; bowel sounds may still be audible even with true ileus. Passage of flatus/stool is the only indicator of ileus resolution.</p>
    <p>NG tube may decompress/drain stomach, promote GI rest, allow lower GI healing, monitor bleeding, prevent obstruction; usually low continuous or intermittent suction. Record color/consistency/amount q8h or per policy; occult blood test (Gastroccult®) possible. Normal drainage greenish-yellow; red/pink = active bleeding; brown/coffee-ground = old bleeding. Secure tube to prevent displacement.</p>
    <p><b>Action Alert:</b> after gastric surgery, do not move or irrigate the NG tube unless ordered.</p>
    <p>Assess for NG complications: fluid/electrolyte imbalances, aspiration, nares discomfort. Check placement q4–8h and before instilling anything. Electrolyte imbalances (fluid deficit, hypokalemia, hyponatremia, hypochloremia, metabolic alkalosis) can result from NG drainage/water irrigation instead of saline.</p>
    <p>Constipation may occur from anesthesia, opioids, decreased activity/intake. Assess via inspection/auscultation/palpation (auscultate before palpating); document elimination pattern. Increased fiber, mild laxatives/bulk agents, or enemas may be ordered; encourage early ambulation.</p>
    <h4>Integumentary System — Wound Healing</h4>
    <p>Clean surgical wound regains skin-level tissue integrity in ~2 weeks (absent trauma/infection/connective tissue disease/malnutrition/steroid use); complete tissue integrity (all layers) may take 6 months–2 years. Risk factors for delayed healing: older age, obesity, immunocompromise, diabetes, smoking. Physical health/age, wound size/location, and wound stress affect healing time. Head/facial wounds heal faster than abdominal/leg wounds (less stress, better blood flow).</p>
    <p>Normal healing: first few days — tissue regains blood supply, fibrin+epithelial cells seal incision; days 1–4 — epithelial growth, collagen strands fill gaps, continuing 2–3 weeks; tissue integrity appears regained but healing isn't complete for up to 2 years (scar strengthening).</p>
    <p>Surgeon usually removes original dressing on day 1 or 2. Assess incision at least q8h for redness/hyperpigmentation, warmth, swelling, tenderness/pain, drainage type/amount. Drainage progression sanguineous→serosanguineous→serous is normal in first few days. Serosanguineous drainage past day 5, or increasing, signals possible dehiscence — notify surgeon. Crusting and pink incision line are normal (inflammation); slight suture/staple-line swelling is normal. Redness/hyperpigmentation, swelling, excessive tenderness, or purulent/odorous drainage indicates SSI — report to surgeon.</p>
    <p>Impaired healing/breakdown may result from infection, distention, surgical site stress, and other conditions (diabetes, renal disease, immunodeficiency). Dehiscence = partial/complete outer wound layer separation; evisceration = total separation with organ protrusion — a surgical emergency, surgeon contacted immediately, patient returned to OR. Triggers: forceful coughing, vomiting, straining, improper splinting. Patient may report "I feel like something popped." Both occur most often days 5–10 postop; more common with diabetes, obesity, immunodeficiency, malnutrition, steroid use.</p>
    <h4>Dressings and Drains</h4>
    <p>Assess all dressings/casts/elastic bandages for bleeding/drainage on admission and routinely, at least q8h. Outline drainage with pencil + date/time for progression monitoring. Check under the patient too — drainage may leak unseen. Large sanguineous drainage may indicate poor clotting/internal bleeding.</p>
    <p>Ensure dressings don't restrict circulation/sensation (esp. tight/encircling limb dressings); chest dressings too tight can restrict breathing.</p>
    <p>Surgeon inserts a drain if more than minimal drainage expected. Penrose drain = single-lumen soft open latex gravity-type tube under the dressing (drainage on dressing expected). Closed-suction drains (Hemovac, Jackson-Pratt) include a reservoir — drainage not usually on dressing. Specialty drains (e.g., T-tube for bile after cholecystectomy) for specific purposes. Negative-pressure wound therapy (NPWT) applies subatmospheric pressure continuously/intermittently for chronic/delayed-healing wounds.</p>
    <h4>Pain Assessment</h4>
    <p>Continuous during recovery; pain is subjective, assessed based on individual conditions; related to wound, tissue manipulation, drains/tubes, positioning, and patient's pain history. Assess physical/behavioral signs: ↑ pulse/BP/RR, sweating, restlessness, confusion (older adult), wincing, moaning, crying. Rate 0–10 before/after drugs; reassess within 20–30 minutes after medication to determine efficacy.</p>
    <p><b>Older Adult — Pain Assessment:</b> pain remains poorly assessed in older adults, especially with cognitive impairment. Challenges: communication difficulty, comorbidities, stoicism, reluctance to report pain. Drug dosages may need adjustment for age-related metabolism/excretion changes.</p>
    <h4>Psychosocial Assessment & Laboratory Assessment</h4>
    <p>Consider psychological/social/cultural/spiritual issues; age/history, procedure, and impact on recovery/body image/roles/lifestyle all matter. Assess for anxiety signs (restlessness, ↑ pulse/BP/RR, crying); offer reassurance surgeon will speak soon or reinforce what was said; assess family for psychosocial needs, refer to social services as appropriate.</p>
    <p>Postop labs based on procedure, history, clinical signs: electrolytes, CBC, urinalysis, kidney function tests. Electrolyte/Hct/Hgb changes common first 24–48hr from blood/fluid loss and surgical stress response; fluid loss with minimal blood loss can falsely elevate values (concentrated normals).</p>
    <p>"Left-shift"/bandemia (↑ band cells/immature neutrophils on WBC differential) indicates infection; source may be respiratory, urinary, wound, or IV site. Obtain cultures as ordered; review at 24, 48, 72 hours; notify surgeon of positive results.</p>
    <p>ABG tests needed for respiratory/cardiac disease patients, mechanical ventilation patients, chest surgery patients. Review for acid-base imbalance/hypoxemia indicating poor gas exchange.</p>
    <h4>Priority Postoperative Problems</h4>
    <p>1. Potential for decreased gas exchange (anesthesia, pain, opioids, immobility). 2. Potential for infection/delayed healing (wound location, decreased mobility, drains, tubes). 3. Acute pain (incision, procedure, positioning). 4. Potential for decreased peristalsis (surgical manipulation, opioid use, fluid/electrolyte imbalance). 5. Potential for postoperative bleeding/hemorrhage.</p>
  `}
);

  {id:'src7', title:'Postop Interventions, Complications & Discharge', open:false, html:`
    <h4>Improving Gas Exchange</h4>
    <p>Monitor SpO2 with each VS set or at least hourly. Highest incidence of impaired gas exchange occurs on postop day 2. Patients with low baseline PaO2 (lung disease, older adults) at higher hypoxemia risk. Low-dose O2 often ordered first 12–24hr for older adults to reduce anesthesia/sedation confusion. Moderate-sedation patients (midazolam/lorazepam) may need flumazenil reversal for oversedation/respiratory depression.</p>
    <p>Hypothermia causes shivering, increasing O2 demand, inducing hypoxemia; prevention is more important than rewarming after the fact.</p>
    <h4>Box 9.11 — Emergency Care of Benzodiazepine Overdose</h4>
    <p>Secure airway/IV access before antagonist therapy. Give O2 if hypoxic or RR &lt;10/min. Prepare flumazenil; repeat q2–3min as ordered per response. Have suction ready (flumazenil can trigger vomiting). Continuously monitor VS/LOC for reversal. Don't leave until fully responsive. Continue monitoring VS/LOC q10–15min for first 2hr (flumazenil eliminated faster than benzodiazepine — more doses may be ordered 1–2hr after initial full response). Observe for tremors/convulsions (can lower seizure threshold). Assess IV site each shift (thrombophlebitis risk). Observe for flumazenil side effects: rash, hot flushes, dizziness, headache, sweating, dry mouth, blurred vision (incidence increases with higher total doses).</p>
    <p>Position semi-Fowler's unless contraindicated; side-lying or head-turned if HOB elevation not tolerated, to prevent aspiration. Apply O2 by face tent/cannula/mask as ordered; raise HOB after patient fully reactive/stable. O2 therapy may continue through postop day 2; respiratory treatments/mechanical ventilation used if hypoxemia persists despite prevention.</p>
    <p>Urge routine coughing, incentive spirometer use, hourly coughing/breathing while awake once patient can follow commands; teach splinting. Oral/nasal suctioning for patients unable to clear secretions, followed by mouth care.</p>
    <p>Early ambulation reduces pulmonary complication risk, especially after abdominal/pelvic/spinal surgery; increases circulation, reduces clotting/VTE/DVT risk. Assist OOB ambulation ASAP. If not possible, turn at least q2h (side to side) with leg/breathing exercises. Offer pain medication in advance of scheduled activities for maximal analgesic effect when patient resists getting up.</p>
    <h4>Preventing Wound Infection and Delayed Healing</h4>
    <p>Most wound complications don't require additional surgery, but emergency procedures may be needed. Wound care includes reinforcing/changing dressings, assessing healing/infection, caring for drains (emptying, measuring, documenting). Urge bending hips (supine) to reduce chest/abdominal wound tension; remind to splint when coughing.</p>
    <p><b>Older Adult — Best Practice in Postop Skin Care:</b> maintain hydration for cardiac output; keep airway patent/adequate oxygenation; monitor pulse ox ≥95%; strict aseptic technique with catheters/wounds; promote sleep/rest; administer pain/sleep drugs if needed; control room temp for comfort; fall protocols; maintain psychosocial health; assist hygiene; protect fragile skin; minimize tape use (hypoallergenic tape/Montgomery straps if needed); change dressings promptly when wet; use assistive personnel to lift during transfer.</p>
    <p>Dressings vary by procedure/surgeon preference. Large incisions: gauze/nonadherent pads + absorbent pad + tape/net/Montgomery straps. Transparent surgical dressings (e.g., OPSITE) stay intact 3–6 days, allow observation, prevent contamination, eliminate frequent changes.</p>
    <p>Surgeon usually performs first dressing change to assess wound, remove packing, advance/remove drains; follow agency policy on timing; reinforce (add material) if wet, documenting added material and drainage characteristics.</p>
    <p>After dressing removal, suture/staple line may be left open to air for easy assessment; a healing wound is always covered with a dressing even if open to air. Frequency of wound care/changes ordered by surgeon or per agency protocol; use aseptic technique until sutures/staples removed. Offer analgesic before large dressing changes/drain removal. Assess for tape-related skin reactions even in non-sensitive patients.</p>
    <p>Sutures/staples usually removed 5–10 days postop (up to 30 days depending on surgery/recovery). Clean incision before removal; examine healing. Remove every other suture/staple first, reassess; if healing well, remove rest. If poor healing/infection signs present, notify surgeon before removing sutures. Wound closure tape may secure the incision afterward, staying until it falls off.</p>
    <p>Drains placed in the wound or via a separate stab wound; provide exit route for air/blood/bile; help prevent deep infection/abscess. Penrose drain placed externally, drains directly onto dressing/skin — change damp dressing, clean under/around drain, place absorbent pads to prevent irritation/contamination. Drain can dislodge/pull out or slip back into the wound — prevented by a sterile safety pin placed perpendicular to drain/wound at first placement; repositioned each time drain is advanced (shortened, trimmed, leaving 2–3 inches).</p>
    <p>Jackson-Pratt/Hemovac drains sutured in place with a seal-forming suture for removal; use sterile technique to empty reservoir; record amount/color each shift; secure to patient's gown (never sheet/mattress) after emptying/compressing to restore suction.</p>
    <p>Wound infection usually results from intraop contamination, preop infection, debilitation, or immunosuppression. At-risk patients may receive antibiotic therapy targeting site-common organisms before/during surgery; need reevaluated at 24hr — discontinued if no infection signs, continued (documented) if present.</p>
    <p>Infected/open wounds treated with dressing changes + systemic antibiotics; follow surgeon's prescription for irrigation/packing/covering; NPWT may help close the wound.</p>
    <h4>Management of Dehiscence and Evisceration</h4>
    <p>Dehiscence: apply sterile nonadherent (e.g., Telfa) or saline dressing, notify surgeon; instruct patient to bend knees, avoid coughing. Infected wound may dehisce spontaneously or be opened via I&D procedure; left open, treated as described.</p>
    <p>Evisceration is a surgical emergency — provide support, explain what happened, reassure quick expert handling.</p>
    <h4>Box 9.12 — Emergency Care of Surgical Wound Evisceration</h4>
    <p>1. Call another nurse to notify surgeon/RRT immediately and bring supplies. 2. Provide reassurance/support; stay with patient; instruct to remain in bed. 3. Place patient supine with hips/knees bent. 4. Raise HOB 15–20 degrees. 5. Using sterile technique, unfold sterile towel for a sterile field. 6. Open irrigation set, place basin/syringe on field. 7. Open several large abdominal dressings onto field. 8. Don sterile gloves, saturate dressings with warm saline in the basin. 9. Place moistened dressings over exposed viscera; place sterile waterproof drape over dressings to keep sheets dry. 10. If saline unavailable, cover with gauze, moisten with sterile saline when available. 11. Do not attempt to reinsert protruding organ/viscera. 12. Assess for shock symptoms; document VS. 13. Continue assessing, VS q5–10min until surgeon/RRT arrives. 14. Keep dressings continuously moist with warmed saline — never let dry. 15. Report findings/interventions when surgeon/RRT arrives. 16. Document incident, activity at time of incident, ongoing assessments, interventions. 17. Prepare for emergency surgery if needed; start IV as ordered. 18. Keep NPO to decrease aspiration risk if surgery needed.</p>
    <p><b>Critical Rescue:</b> monitor surgical incisions at least q8h to recognize impending evisceration; if evisceration occurs, stay with patient while calling another nurse to notify surgeon/RRT immediately.</p>
    <h4>Special Considerations for Poor Healing</h4>
    <p>Best treatment is prevention — encourage adequate protein/vitamins/calories for at-risk patients; monitor intake, identify deficiencies, discuss with surgeon/RDN. NG tube may decompress stomach/relieve pressure or remove contents if eating occurred before needed general anesthesia. Wound closure surgery may use regional/local anesthesia to reduce N/V risk; stay/retention sutures (wire/nylon) may supplement standard sutures/staples for incision integrity.</p>
    <h4>Managing Pain — Drug Therapy</h4>
    <p>Opioids/analgesics can mask or increase severity of anesthesia reaction symptoms — administer cautiously. Epidural analgesia may be given intermittently or via continuous infusion through an indwelling catheter; common epidural drugs: fentanyl, preservative-free morphine, bupivacaine.</p>
    <p>Opioid analgesics manage acute pain in first 24–48hr postop. Around-the-clock scheduling or PCA more effective/consistent than on-demand dosing. In PCA, patient adjusts dose based on pain/response; max hourly dose locked into the pump to prevent accidental overdose. Drugs change from injectable/PCA to oral as tolerance allows.</p>
    <p>Common drugs: morphine, hydromorphone, ketorolac, codeine, butorphanol, oxycodone with aspirin or acetaminophen. Antianxiety drugs may accompany opioids to decrease pain-related anxiety/muscle tension/nausea.</p>
    <p><b>Drug Alert:</b> hydromorphone's usual dosage is much smaller than morphine's — check dosages carefully.</p>
    <p>Assess pain type/location/intensity before/after medication (0–10 scale); monitor VS for hypotension/hypoventilation after opioids.</p>
    <h4>Table 9.5 — Common Postoperative Pain Drugs</h4>
    <table><tr><th>Drug</th><th>Nursing Implications</th></tr>
    <tr><td>Morphine sulfate & hydromorphone HCl</td><td>Monitor RR/BP (severe resp depression possible); monitor GI motility/urine output (constipation/retention)</td></tr>
    <tr><td>Codeine sulfate</td><td>Monitor respiratory status (depression); monitor GI motility (constipation)</td></tr>
    <tr><td>Butorphanol tartrate</td><td>Monitor neuro status/LOC (↑ ICP risk); monitor respiratory status</td></tr>
    <tr><td>Oxycodone and aspirin</td><td>Monitor GI tolerance (aspirin irritation, GI bleed); monitor coagulation studies (PT/aPTT)</td></tr>
    <tr><td>Oxycodone and acetaminophen</td><td>Monitor BP/respiratory status; monitor GI motility (constipation)</td></tr>
    <tr><td>Ketorolac tromethamine (NSAID)</td><td>Monitor GI tolerance (bleeding/ulceration/perforation); monitor kidney function esp. older adults</td></tr>
    <tr><td>Ibuprofen (NSAID)</td><td>Monitor GI tolerance (bleeding/ulceration/perforation)</td></tr>
    </table>
    <p><b>Older Adult — PCA:</b> special care needed to prevent undertreatment; assess understanding/comfort with self-medicating; reassure re: overdose prevention. Monitor BP/respirations q15–30min until full opioid effect passes (opioid antagonist eliminated faster than opioid, more doses may be needed); breakthrough pain possible after antagonist given — other interventions may be needed.</p>
    <p>Assess for undermedication via pain relief report and nonverbal cues (restlessness, ↑ confusion, picking at linens); offer ordered drugs after checking for hypotension/respiratory depression.</p>
    <h4>Box 9.13 — Emergency Care of Opioid Overdose</h4>
    <p>Naloxone may be given IV/IM/subcutaneous/nasal; IV has fastest onset, recommended in emergencies (remain prepared to give IV if ordered even if initial route differs). Maintain open airway. Repeat dosing q2–3min if needed per response/orders. Give O2 if hypoxic or RR &lt;12/min. Have suction ready (vomiting risk). Continuously monitor VS/LOC for reversal q10–15min for the first hour (naloxone eliminated faster than opioid — additional antagonist doses may be needed 1hr after full response). Don't leave until fully responsive. Assess for pain (opioid reversal also reverses analgesia).</p>
    <p>As recovery progresses, reduce pain drug doses/frequency as ordered. Nonopioid analgesics (acetaminophen, NSAIDs like ibuprofen/ketorolac) used alone or with opioids.</p>
    <p><b>Action Alert:</b> unless pillow support ordered, do not place pillows under knees / raise knee gatch — restricts circulation, increases VTE risk.</p>
    <h4>Nonpharmacologic Pain Interventions</h4>
    <p>Gentle massage on stiff joints/sore back (non-surgical sites) — side-lying position, lotion with gentle strokes to increase blood flow/promote relaxation. Do NOT massage calves — risk of loosening a clot causing a life-threatening PE. Relaxation/diversion (e.g., music) for acute pain episodes during dressing changes/injections.</p>
    <h4>Box 9.14 — Nonpharmacologic Interventions for Postop Pain/Comfort</h4>
    <p>Find general position of comfort; use ice to reduce/prevent swelling; cushion/elevate painful areas avoiding tension/pressure (no pillows under knees/raised knee gatch); control/remove noxious stimuli; provide adequate rest; encourage diversional activity participation; teach relaxation techniques (music, breathing exercises); provide meditation opportunities.</p>
    <h4>Promoting Peristalsis</h4>
    <p>Decreased peristalsis with possible postoperative ileus (POI) can occur from drug therapy, anesthesia/analgesia, operative manipulation, or sympathetic excitation from stress — most common after open abdominal procedures; all postop patients at some risk. POI can lead to dehiscence, N/V, deconditioning.</p>
    <p>Monitoring abdomen is key for peristalsis recovery/early POI recognition: assess bowel sounds presence/quality, distention degree, firmness with each VS check; auscultate all 4 quadrants up to 1 minute each; gently palpate for softness/rigidity (surgeon percusses). Passage of flatus/stool indicates motility but doesn't rule out POI on its own.</p>
    <p>Ensuring adequate hydration promotes peristalsis (dehydration/crystalloid excess can decrease motility, leading to POI); monitor IV volume vs urine output, maintain adequate dilute urine output. Increased mobility/early ambulation assists peristalsis return — help ambulate at least once/shift, increasing distance/time; document for continuity of care.</p>
    <p>Nonopioid pain strategies reduce opioid amount needed (opioids bind GI receptors, decrease peristalsis, contribute to POI); collaborate with interprofessional team on alternative pain control. Drug therapy: alvimopan accelerates GI recovery time after certain GI surgeries; metoclopramide promotes peristalsis by directly stimulating GI motility.</p>
    <h4>Preventing Postoperative Bleeding/Hemorrhage</h4>
    <p>Risk relates to surgical procedure type and presurgical health status; challenging to quantify given varying study definitions of "bleeding"/"hemorrhage." Familiarize with the specific procedure and how presurgical status affects risk.</p>
    <p>Key intervention: frequent assessments from all angles — look underneath the patient (blood can pool unseen). Carefully monitor drains for output quantity/quality. Early warning signs preceding hemorrhage: anxiety, restlessness, new bruising, tachycardia, reduced urine output, cognitive changes, extremity discoloration — if noted, further assess, stay with patient, have another nurse contact the surgeon.</p>
    <p>If a wound is open/bleeding (not dehisced/eviscerated), apply pressure and have another nurse contact the surgeon immediately. For dehisced/eviscerated wounds, use interventions described earlier.</p>
    <h4>Care Coordination and Transition Management</h4>
    <p>Except emergent surgery, discharge planning/teaching/referrals begin before the procedure and continue after. If discharged home, assess home environment safety and family/caregiver availability using preop data. Example: patient unable to climb stairs living in a two-story house with only upstairs bathroom — inform about renting a bedside commode. Other devices: shower chair, walker, recliner. Collaborate with social worker/discharge planner for individualized needs (meal prep, dressing changes, drain management, drug administration, PT, hygiene, financial needs); home care nursing/PT referral as indicated.</p>
    <p>Some patients need long-term acute care to recover fully. Discharging to another agency follows SBAR/hand-off best practices.</p>
    <h4>Postoperative Teaching Plan</h4>
    <p>Includes: pain management; drug therapy with postop drug reconciliation; safety (whom to contact for complications, activity progression, assistive devices needed); infection prevention with wound assessment/care; drain/catheter management; nutrition therapy; surgeon follow-up.</p>
    <p>Teach proper handwashing for dressing/drain/catheter care to prevent infection; demonstrate wound care then require return demonstration; evaluate learning during teaching sessions; teach complication symptoms and when to contact the provider.</p>
    <p>Perform drug reconciliation before discharge; ensure other-condition drugs resumed as needed; ensure surgery-specific drugs available with patient understanding of use/side effects/discontinuation timing. Teach pain drug dosage/frequency; instruct to notify surgeon if pain uncontrolled or suddenly increases. If antibiotics prescribed, stress completing the entire prescription even if feeling better.</p>
    <p>High-protein/calorie/vitamin diet promotes wound healing; supplemental vitamin C, iron, zinc, other vitamins often recommended for healing/RBC formation. Instruct on dietary restrictions if needed.</p>
    <p>Surgery stresses the body — time/rest needed for healing. Teach slow activity increase, frequent rest, avoiding wound/area strain. Reinforce surgeon instructions on lifting limits, stair climbing, return to work/driving, other ADLs. Instruct proper lifting technique; remind about weight of common items (grocery bags, handbags, household items). Stress adherence to prevent complications/disability.</p>
    <p><b>Action Alert:</b> provide written discharge instructions (incl. medication education sheets in patient's primary language); have patient/family explain the regimen back in their own words to assess understanding.</p>
    <p>Additional referrals beyond home care nursing: Meals on Wheels, support groups, housekeeping services, grocery delivery by third-party shoppers.</p>
    <h4>Evaluation — Postoperative Outcomes</h4>
    <p>Expected outcomes: patient attains/maintains adequate lung expansion/respiratory function; has appropriate wound healing without complications; has acceptable pain management; has return of peristalsis.</p>
    <h4>NCLEX Get-Ready Essential Concept Points</h4>
    <p>Use ≥2 identifiers before instruction/drug administration/site marking/procedures. Collect full preop history and complete assessment, noting risk factors to report. Teach preop/postop interventions (hand hygiene, incision care/splinting, breathing/leg exercises, follow-up requirements). Ensure patients can explain their surgery in their own words. Confirm presurgical checklist done and consent/legal documents signed before preop drug administration. Communicate physical/lab changes affecting drug/anesthesia/surgery response to the team. Examine risks for SSI, hypoventilation, hypotension, VTE, or postop injury. Begin every postop assessment with airway/breathing check. Keep suction, oxygen, artificial breathing equipment near bedside. Apply antiembolic stockings/SCDs to reduce vascular complications. Assess incision each shift for healing/infection signs. Use aseptic technique for all dressing changes. Encourage/assist early ambulation. Offer prescribed medication and alternative therapies for postop pain. For evisceration/dehiscence: position supine with knees bent to reduce intraabdominal pressure; apply sterile nonadherent dressing; notify surgeon immediately.</p>
