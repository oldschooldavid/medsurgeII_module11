<script>
// ===================== STATE & STORAGE HELPERS =====================
let flaggedCards = [];
let srsData = {};
let lastViewed = {};
let currentTheme = 'light';

function lsGet(key){
  try{ const v = localStorage.getItem(PH_NS+key); return v; }catch(e){ return null; }
}
function lsSet(key,val){
  try{ localStorage.setItem(PH_NS+key, val); return true; }catch(e){ return false; }
}
function loadJSON(key, fallback){
  const v = lsGet(key);
  if(!v) return fallback;
  try{ return JSON.parse(v); }catch(e){ return fallback; }
}
function saveJSON(key, obj){ lsSet(key, JSON.stringify(obj)); }

function initState(){
  flaggedCards = loadJSON('flaggedCards', []);
  srsData = loadJSON('srs_data', {});
  lastViewed = loadJSON('last_viewed', {});
  currentTheme = lsGet('theme') || 'light';
  document.documentElement.setAttribute('data-theme', currentTheme);
}

function toggleTheme(){
  currentTheme = currentTheme === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', currentTheme);
  lsSet('theme', currentTheme);
}

// ===================== FLAGGING =====================
function toggleFlag(cardId){
  const idx = flaggedCards.indexOf(cardId);
  if(idx === -1) flaggedCards.push(cardId); else flaggedCards.splice(idx,1);
  saveJSON('flaggedCards', flaggedCards);
}
function isFlagged(cardId){ return flaggedCards.indexOf(cardId) !== -1; }

// ===================== SRS =====================
const SRS_INTERVALS = [1,3,7,14,30]; // days
function getSRSStatus(cardId){
  const entry = srsData[cardId];
  if(!entry) return 'ok';
  const now = Date.now();
  if(entry.nextReview <= now) return 'due';
  if(entry.nextReview <= now + 2*24*60*60*1000) return 'soon';
  return 'ok';
}
function srsAnswer(cardId, correct){
  let entry = srsData[cardId] || {level:0, nextReview:Date.now()};
  if(correct){ entry.level = Math.min(4, entry.level+1); }
  else { entry.level = Math.max(0, entry.level-1); }
  const days = SRS_INTERVALS[entry.level];
  entry.nextReview = Date.now() + days*24*60*60*1000;
  srsData[cardId] = entry;
  saveJSON('srs_data', srsData);
}
function updateDueCount(){
  let due = 0;
  Object.keys(srsData).forEach(k=>{ if(getSRSStatus(k)==='due') due++; });
  const badge = document.getElementById('hdr-due-badge');
  if(badge){
    badge.textContent = '📅 '+due+' due';
    badge.classList.toggle('hasdue', due>0);
  }
  return due;
}
function srsBadgeHTML(cardId){
  const st = getSRSStatus(cardId);
  if(st==='due') return '<span class="badge due">📅 Due</span>';
  if(st==='soon') return '<span class="badge soon">⏰ Soon</span>';
  return '<span class="badge ok">✓ OK</span>';
}

// ===================== LAST VIEWED =====================
function relTime(ts){
  const diff = Date.now()-ts;
  const m = Math.floor(diff/60000), h = Math.floor(diff/3600000), d = Math.floor(diff/86400000);
  if(d>0) return d+'d ago';
  if(h>0) return h+'h ago';
  if(m>0) return m+'m ago';
  return 'just now';
}
function lastViewedBadgeHTML(cardId){
  const ts = lastViewed[cardId];
  if(!ts) return '<span class="badge never">🕓 Never reviewed</span>';
  return '<span class="badge viewed">🕓 Studied '+relTime(ts)+'</span>';
}
function injectLastViewedBadges(){
  document.querySelectorAll('[data-card-id].card').forEach(card=>{
    const cid = card.getAttribute('data-card-id');
    let holder = card.querySelector('.lv-badge-holder');
    if(!holder){
      holder = document.createElement('span');
      holder.className = 'lv-badge-holder';
      const badgesRow = card.querySelector('.card-badges');
      if(badgesRow) badgesRow.appendChild(holder);
    }
    holder.innerHTML = lastViewedBadgeHTML(cid);
  });
}
let ivObserver = null;
function setupIntersectionObserver(){
  if(ivObserver) ivObserver.disconnect();
  const dwellTimers = new Map();
  ivObserver = new IntersectionObserver((entries)=>{
    entries.forEach(entry=>{
      const cid = entry.target.getAttribute('data-card-id');
      if(entry.isIntersecting && entry.intersectionRatio >= 0.6){
        if(!dwellTimers.has(cid)){
          const t = setTimeout(()=>{
            lastViewed[cid] = Date.now();
            saveJSON('last_viewed', lastViewed);
            injectLastViewedBadges();
            dwellTimers.delete(cid);
          }, 1200);
          dwellTimers.set(cid, t);
        }
      } else {
        if(dwellTimers.has(cid)){ clearTimeout(dwellTimers.get(cid)); dwellTimers.delete(cid); }
      }
    });
  }, {threshold:[0.6]});
  document.querySelectorAll('[data-card-id]').forEach(el=>ivObserver.observe(el));
}

// ===================== GLOBAL MASTERY =====================
function computeMasteryFromSessions(sessions){
  let c=0,t=0;
  sessions.forEach(s=>{ c+=(s.score||0); t+=(s.total||0); });
  return t>0 ? Math.round(100*c/t) : 0;
}
function updateGlobalMasteryFromStorageOnly(){
  const sessions = loadJSON('quiz_sessions', []);
  const pct = computeMasteryFromSessions(sessions);
  saveJSON('global_mastery', pct);
  renderHeaderMastery(pct);
}
function updateGlobalMastery(liveCorrect, liveTotal){
  const sessions = loadJSON('quiz_sessions', []);
  let c=0,t=0;
  sessions.forEach(s=>{ c+=(s.score||0); t+=(s.total||0); });
  c += (liveCorrect||0); t += (liveTotal||0);
  const pct = t>0 ? Math.round(100*c/t) : 0;
  renderHeaderMastery(pct);
}
function renderHeaderMastery(pct){
  const txt = document.getElementById('hdr-mastery-txt');
  const fill = document.getElementById('hdr-mastery-fill');
  if(txt) txt.textContent = pct+'%';
  if(fill) fill.style.width = pct+'%';
}

// ===================== TAB NAV & RENDERING =====================
let currentTab = 'surgoverview';
function buildTabNav(){
  const nav = document.getElementById('tabnav');
  nav.innerHTML = '';
  TABS.forEach(t=>{
    const btn = document.createElement('button');
    btn.className = 'tabbtn';
    btn.textContent = (t.icon? t.icon+' ':'') + t.name;
    btn.onclick = ()=>showTab(t.id, btn);
    btn.dataset.tabid = t.id;
    nav.appendChild(btn);
  });
}
function scrollNav(dir){
  const nav = document.getElementById('tabnav');
  nav.scrollBy({left: dir*200, behavior:'smooth'});
  setTimeout(updateNavArrows, 350);
}
function updateNavArrows(){
  const nav = document.getElementById('tabnav');
  const left = document.getElementById('nav-left');
  const right = document.getElementById('nav-right');
  left.classList.toggle('dim', nav.scrollLeft <= 2);
  right.classList.toggle('dim', nav.scrollLeft + nav.clientWidth >= nav.scrollWidth - 2);
}

function showTab(id, btnEl){
  currentTab = id;
  document.querySelectorAll('.tabpanel').forEach(p=>p.classList.remove('active'));
  const panel = document.getElementById('tab-'+id);
  if(panel) panel.classList.add('active');
  document.querySelectorAll('.tabbtn').forEach(b=>b.classList.toggle('active', b.dataset.tabid===id));
  if(id==='dashboard') renderDash();
  setTimeout(()=>{ injectLastViewedBadges(); setupIntersectionObserver(); }, 50);
}

function cardId(topicId, title){
  return 'topic_'+topicId+'_'+title.toLowerCase().replace(/[^a-z0-9]+/g,'_').slice(0,60);
}

function renderCardHTML(topicId, card, stripeColor){
  const cid = cardId(topicId, card.title);
  const flagged = isFlagged(cid);
  return `<div class="card${flagged?' flagged':''}" data-card-id="${cid}" style="border-left-color:${stripeColor}">
    <div class="card-head">
      <h3 class="card-title">${card.title}</h3>
      <div class="card-actions">
        ${card.hy?'<span class="hy-stamp">🔥 HIGH YIELD</span>':''}
        <button class="flag-btn${flagged?' on':''}" onclick="event.stopPropagation();toggleFlag('${cid}');this.classList.toggle('on');this.closest('.card').classList.toggle('flagged')">🚩</button>
        <button class="sum-btn" onclick="aiSummarizeCard('${cid}', this)">✨ Summarize</button>
      </div>
    </div>
    <div class="card-body">${card.body}</div>
    <div class="card-badges">${srsBadgeHTML(cid)}</div>
  </div>`;
}

function renderTopicTab(topicId){
  const t = TOPICS[topicId];
  const panel = document.getElementById('tab-'+topicId);
  if(!t || !panel) return;
  let html = '';
  if(t.quickhits && t.quickhits.length){
    html += `<div class="qh-strip"><div class="qh-title">⚡ Quick Hits</div><ul>${t.quickhits.map(q=>'<li>'+q+'</li>').join('')}</ul></div>`;
  }
  // sort HY first
  const cards = t.cards.slice().sort((a,b)=> (b.hy?1:0)-(a.hy?1:0));
  cards.forEach(c=>{ html += renderCardHTML(topicId, c, t.color); });
  if(cards.length===0){ html += '<div class="emptynote">No cards for this topic yet.</div>'; }
  // mind maps relevant to this topic
  const relevantMaps = MINDMAPS.filter(m=>m._topic===topicId);
  relevantMaps.forEach(m=>{ html += renderMindMapBlock(m); });
  panel.innerHTML = html;
}
</script>

      <div class="mm-branch-body"><ul>${b.items.map(it=>'<li>'+it+'</li>').join('')}</ul></div>

  });
  container.innerHTML = html;

<script>
// ===================== AI CALL FUNCTIONS =====================
async function callAI(prompt, maxTokens){
  const key = lsGet('claude_api_key');
  if(!key) throw new Error('No API key saved. Add your Claude API key in AI Infinite settings.');
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method:'POST',
    headers:{
      'Content-Type':'application/json',
      'x-api-key': key,
      'anthropic-version':'2023-06-01',
      'anthropic-dangerous-direct-browser-access':'true'
    },
    body: JSON.stringify({
      model:'claude-sonnet-4-20250514',
      max_tokens: maxTokens || 1000,
      messages:[{role:'user', content: prompt}]
    })
  });
  if(!resp.ok){
    if(resp.status===401) throw new Error('Invalid API key.');
    if(resp.status===429) throw new Error('Rate limited by the API.');
    if(resp.status===500 || resp.status===529) throw new Error('Anthropic server error.');
    throw new Error('API error: '+resp.status);
  }
  const data = await resp.json();
  return (data.content||[]).map(b=>b.text||'').join('');
}

async function callAIRetry(prompt, maxTokens, retries){
  retries = typeof retries==='number' ? retries : 2;
  let lastErr;
  for(let i=0;i<=retries;i++){
    try{ return await callAI(prompt, maxTokens); }
    catch(e){
      lastErr = e;
      if(/rate/i.test(e.message) && i<retries){ await new Promise(r=>setTimeout(r,12000)); continue; }
      if(/server error/i.test(e.message) && i<retries){ await new Promise(r=>setTimeout(r,3000)); continue; }
      if(i<retries){ await new Promise(r=>setTimeout(r,1000)); continue; }
      throw lastErr;
    }
  }
  throw lastErr;
}

// ===================== AI RESPONSE HANDLING =====================
function parseAIJson(raw){
  try{ return JSON.parse(raw); }catch(e0){}
  function fixOptionsBrackets(str){
    var result = '', i = 0;
    while (i < str.length) {
      var mIdx = str.indexOf('"options":', i);
      if (mIdx === -1) { result += str.substring(i); break; }
      result += str.substring(i, mIdx + 10);
      i = mIdx + 10;
      while (i < str.length && str[i] !== '[') { result += str[i]; i++; }
      if (i >= str.length) break;
      result += '['; i++;
      var depth = 1, arr = '';
      while (i < str.length && depth > 0) {
        var ch = str[i];
        if (ch === '[') depth++;
        if (ch === ']') { depth--; if (depth === 0) break; }
        arr += ch; i++;
      }
      result += arr.replace(/"([A-E])"\s*:\s*"([^"]*)"/g,
        function(m, L, t) { return '"' + L + '. ' + t + '"'; }) + ']';
      i++;
    }
    return result;
  }
  function repair(str){
    str = str.replace(/^```(?:json)?[^\n]*\n?/, '').replace(/\s*```\s*$/, '').trim();
    var am = /\[\s*\{/.exec(str);
    if (am && am.index > 0) str = str.substring(am.index);
    str = fixOptionsBrackets(str);
    str = str.replace(/([{,]\s*)([A-Za-z_][A-Za-z0-9_]*)\s*:/g,
      function(m, pre, key) { return pre + '"' + key + '":'; });
    var out = '', inStr = false, esc = false;
    for (var j = 0; j < str.length; j++) {
      var c = str[j];
      if (esc) { out += c; esc = false; continue; }
      if (c === '\\') { out += c; esc = true; continue; }
      if (c === '"') { inStr = !inStr; out += c; continue; }
      if (inStr && (c === '\n' || c === '\r')) { out += ' '; continue; }
      if (inStr && c === '\t') { out += ' '; continue; }
      out += c;
    }
    str = out;
    str = str.replace(/,\s*([}\]])/g, '$1');
    return str;
  }
  try { return JSON.parse(repair(raw)); } catch(e1) {}
  try { return JSON.parse(repair(raw).replace(/([a-zA-Z])'([a-zA-Z])/g, '$1\u2019$2')); } catch(e2) {}
  var lastClose = raw.lastIndexOf('\n  }');
  if (lastClose > 10) {
    try { return JSON.parse(repair(raw.substring(0, lastClose + 4) + ']')); } catch(e3) {}
  }
  var lastBrace = raw.lastIndexOf('}}');
  if (lastBrace > 10) {
    try { return JSON.parse(repair(raw.substring(0, lastBrace + 2) + ']')); } catch(e4) {}
  }
  throw new Error('Could not parse AI response \u2014 please retry.');
}

function sanitizeQuestions(qs){
  if (!Array.isArray(qs)) return [];
  return qs.filter(q => q && typeof q === 'object').map(q => {
    if (!Array.isArray(q.options) || q.options.length < 2) {
      q.options = ['A. Option A', 'B. Option B', 'C. Option C', 'D. Option D'];
    }
    if (typeof q.correct === 'string') {
      var letter = q.correct.toUpperCase().trim();
      if (/^[A-E]$/.test(letter)) q.correct = letter.charCodeAt(0) - 65;
      else q.correct = parseInt(q.correct) || 0;
    }
    if (typeof q.correct !== 'number' || isNaN(q.correct) ||
        q.correct < 0 || q.correct >= q.options.length) q.correct = 0;
    if (q.sataCorrIdx) {
      if (!Array.isArray(q.sataCorrIdx)) q.sataCorrIdx = [q.correct];
      q.sataCorrIdx = q.sataCorrIdx.map(function(v) {
        if (typeof v === 'string') {
          if (/^[A-Ea-e]$/.test(v.trim())) return v.trim().toUpperCase().charCodeAt(0) - 65;
          return parseInt(v) || 0;
        }
        return typeof v === 'number' ? v : 0;
      }).filter(function(v) { return v >= 0 && v < q.options.length; });
      if (q.sataCorrIdx.length === 0) q.sataCorrIdx = [q.correct];
    }
    if (!q.rationale || typeof q.rationale !== 'object')
      q.rationale = { correct: 'See course material.', explanations: {} };
    if (!q.rationale.correct) q.rationale.correct = 'See course material.';
    if (!q.rationale.explanations || typeof q.rationale.explanations !== 'object')
      q.rationale.explanations = {};
    if (!q.stem) q.stem = 'Question unavailable \u2014 please retry.';
    if (!q.format) q.format = q.sataCorrIdx ? 'sata' : 'mcq';
    if (!q.difficulty) q.difficulty = 2;
    return q;
  });
}

function validateQuestion(q){
  if (!q || !q.stem || !q.options || !q.rationale)
    return { ok: false, reason: 'Missing required fields' };
  if (!Array.isArray(q.options) || q.options.length < 2)
    return { ok: false, reason: 'Options not an array' };
  function getGroups(text) {
    return TOPIC_GROUPS.filter(function(grp) {
      return grp.some(function(term) { return text.includes(term); });
    });
  }
  var stem = q.stem.toLowerCase();
  var rat = (q.rationale.correct || '').toLowerCase();
  var stemGroups = getGroups(stem);
  var ratGroups = getGroups(rat);
  if (stemGroups.length > 0 && ratGroups.length > 0) {
    var overlap = stemGroups.filter(function(sg) {
      return ratGroups.some(function(rg) { return rg === sg; });
    });
    if (overlap.length === 0) {
      var stemTerm = stemGroups[0].find(function(t) { return stem.includes(t); }) || stemGroups[0][0];
      var ratTerm = ratGroups[0].find(function(t) { return rat.includes(t); }) || ratGroups[0][0];
      return { ok: false, reason: 'Stem mentions ' + stemTerm + ' but rationale mentions ' + ratTerm + ' \u2014 mismatch' };
    }
  }
  if (q.format === 'mcq' && stem.includes('select all'))
    return { ok: false, reason: 'MCQ format but stem says select all' };
  if (typeof q.correct !== 'number' || q.correct < 0 || q.correct >= q.options.length)
    return { ok: false, reason: 'Correct index out of range' };
  if (!q.rationale.explanations || Object.keys(q.rationale.explanations).length < 2)
    return { ok: false, reason: 'Missing explanations' };
  return { ok: true };
}
</script>
<script>
// ===================== QUIZ SHARED STATE =====================
let aiState = {};
let bankState = {};
window.bankGenerationInProgress = false;

function resetAIState(){
  aiState = {
    count:0, questions:[], score:0, correct:0, incorrect:0,
    topics:{}, adpie:{}, systems:{}, subtopics:{}, angles:[],
    difficulty:2, lastTopic:'mixed', mode:'general'
  };
}
function resetBankState(){
  bankState = {
    questions:[], gIdx:-1, score:0, correct:0, total:0,
    topics:{}, adpie:{}, systems:{}, subtopics:{}, flaggedOnly:false
  };
}

function getFlaggedContext(){
  let parts = [];
  document.querySelectorAll('.card.flagged .card-body').forEach(el=>parts.push(el.textContent));
  document.querySelectorAll('.drug-flip').forEach(el=>{
    const cid = el.getAttribute('data-card-id');
    if(isFlagged(cid)){
      const name = el.querySelector('.drug-front h3');
      if(name) parts.push(name.textContent + ': ' + (el.querySelector('.drug-front .secval')?.textContent||''));
    }
  });
  document.querySelectorAll('.qv-card, [data-card-id^="qv_"]').forEach(el=>{
    const cid = el.getAttribute('data-card-id');
    if(cid && isFlagged(cid)) parts.push(el.textContent);
  });
  let ctx = parts.join('\n').slice(0,3000);
  return ctx;
}

function topicLabel(code){
  const t = TOPICS[code];
  if(t) return t.name;
  const found = TABS.find(x=>x.id===code);
  return found ? found.name : code;
}

// ===================== SUBTOPIC TRACKING =====================
function extractSubtopic(q){
  if(q.topic_angle) return q.topic_angle;
  const stem = (q.stem||'').toLowerCase();
  for(const grp of TOPIC_GROUPS){
    for(const term of grp){ if(stem.includes(term)) return term; }
  }
  return (q.topic || 'general');
}
function recordSubtopic(stateObj, q, correct){
  const sub = extractSubtopic(q);
  if(!stateObj.subtopics[sub]) stateObj.subtopics[sub] = {c:0,t:0,topic:q.topic||'General',examples:[]};
  const s = stateObj.subtopics[sub];
  s.t++; if(correct) s.c++;
  if(!correct){
    s.examples.push((q.stem||'').slice(0,140));
    if(s.examples.length>2) s.examples.shift();
  }
}
function recordTaxonomy(stateObj, q, correct){
  const bump = (obj,key)=>{ if(!key) return; if(!obj[key]) obj[key]={c:0,t:0}; obj[key].t++; if(correct) obj[key].c++; };
  bump(stateObj.topics, q.topic);
  bump(stateObj.adpie, q.adpie);
  bump(stateObj.systems, q.system);
  recordSubtopic(stateObj, q, correct);
}

// ===================== SESSION SAVING =====================
function saveSession(session){
  let sessions = loadJSON('quiz_sessions', []);
  if(sessions.length >= 150) sessions.shift();
  sessions.push(session);
  saveJSON('quiz_sessions', sessions);
  updateGlobalMasteryFromStorageOnly();
  updateDueCount();
}
</script>
<script>
// ===================== QUIZ ME TAB SHELL =====================
let quizMode = 'bank'; // 'bank' | 'ai'
let aiSubMode = 'general'; // 'general' | 'meddrill'

function renderQuizTab(){
  const panel = document.getElementById('tab-quiz');
  panel.innerHTML = `
    <h2>🧠 Quiz Me</h2>
    <div class="filterbar">
      <button class="filterbtn${quizMode==='bank'?' active':''}" onclick="switchQuizMode('bank')">📚 Question Bank</button>
      <button class="filterbtn${quizMode==='ai'?' active':''}" onclick="switchQuizMode('ai')">✨ AI Infinite Quiz</button>
    </div>
    <div id="quiz-mode-body"></div>
  `;

}
function switchQuizMode(m){ quizMode = m; renderQuizTab(); }

function renderQuizModeBody(){

  if(quizMode==='bank') el.innerHTML = bankFiltersHTML() + '<div id="qout-bank"></div>';
  else el.innerHTML = aiInfiniteShellHTML();
  if(quizMode==='ai') renderKeyStatus();
}

// ---------- QUESTION BANK ----------
function bankFiltersHTML(){
  const topicOpts = Object.keys(TOPICS).map(k=>`<option value="${k}">${TOPICS[k].name}</option>`).join('');
  return `<div class="filterrow">
    <div><label class="flabel">Topic</label><select id="bank-topic"><option value="mixed">Mixed</option>${topicOpts}</select></div>
    <div><label class="flabel">Format</label><select id="bank-format"><option value="mixed">Mixed</option><option value="mcq">MCQ</option><option value="scenario">Scenario</option><option value="sata">SATA</option></select></div>
    <div><label class="flabel">ADPIE</label><select id="bank-adpie"><option value="mixed">Mixed</option><option value="Assessment">Assessment</option><option value="Diagnosis">Diagnosis</option><option value="Planning">Planning</option><option value="Implementation">Implementation</option><option value="Evaluation">Evaluation</option></select></div>
    <div><label class="flabel"># Questions</label><select id="bank-count"><option value="20">20</option><option value="50">50</option><option value="100" selected>100</option></select></div>
    <div><label class="flabel">🚩 Flagged Only</label><input type="checkbox" id="bank-flagged"></div>
    <div><label class="flabel">🔥 High-Yield Only</label><input type="checkbox" id="bank-hy"></div>
    <div><button class="btn" onclick="startBankQuiz()">Generate Bank</button></div>
  </div>`;
}

async function startBankQuiz(){
  const key = lsGet('claude_api_key');
  const out = document.getElementById('qout-bank');
  if(!key){ out.innerHTML = '<div class="emsg">Save your Claude API key below in AI Infinite to generate the Question Bank.</div>'+apiKeyPanelHTML(); wireApiKeyPanel(); return; }
  resetBankState();
  const topic = document.getElementById('bank-topic').value;
  const fmt = document.getElementById('bank-format').value;
  const adpie = document.getElementById('bank-adpie').value;
  const total = parseInt(document.getElementById('bank-count').value);
  const flaggedOnly = document.getElementById('bank-flagged').checked;
  const hyOnly = document.getElementById('bank-hy').checked;
  bankState.flaggedOnly = flaggedOnly;

  let flaggedCtx = '';
  if(flaggedOnly){
    flaggedCtx = getFlaggedContext();
    if(!flaggedCtx.trim()){
      out.innerHTML = '<div class="emsg">No flagged cards found. Flag some cards with 🚩 first, then try again.</div>';
      return;
    }
  }
  out.innerHTML = '<div class="loadmsg" id="bank-progress">Generating questions 1–10 of '+total+'...</div><div id="bank-qlist"></div>';
  window.bankGenerationInProgress = true;
  const batchSize = 10;
  const numBatches = Math.ceil(Math.min(total,150)/batchSize);
  let angles = [];
  let gIdx = 0;
  try{
    for(let b=0; b<numBatches; b++){
      const prog = document.getElementById('bank-progress');
      if(prog) prog.textContent = 'Generating questions '+(b*batchSize+1)+'–'+Math.min((b+1)*batchSize,total)+' of '+total+'...';
      let prompt = buildBankPrompt(topic, fmt, adpie, hyOnly, flaggedOnly, flaggedCtx, angles);
      let batchQs = [];
      try{
        const raw = await callAIRetry(prompt, 3800);
        batchQs = await parseBankBatch(raw);
      }catch(e){ batchQs = []; }
      if(batchQs.length===0){
        try{
          const raw2 = await callAIRetry(prompt, 3800);
          batchQs = await parseBankBatch(raw2);
        }catch(e2){ batchQs = []; }
      }
      // keyword verification if flagged-only
      if(flaggedOnly && batchQs.length){
        const keywords = extractKeywords(flaggedCtx);
        batchQs = batchQs.filter(q=>{
          const hay = (q.stem+' '+(q.rationale?q.rationale.correct:'')).toLowerCase();
          return keywords.some(k=>hay.includes(k));
        });
      }
      batchQs.forEach(q=>{ if(q.topic_angle) angles.push(q.topic_angle); });
      batchQs.forEach(q=>{
        q._gidx = gIdx++;
        bankState.questions.push(q);
        appendBankQuestionDOM(q);
      });
    }
  } finally {
    window.bankGenerationInProgress = false;
  }
  const prog = document.getElementById('bank-progress');
  if(prog){
    if(bankState.questions.length < total){
      prog.innerHTML = bankState.questions.length+' of '+total+' questions generated. <button class="btn secondary" onclick="topUpBank(${total})">Generate remaining</button>';
    } else {
      prog.remove();
    }
  }
}

function extractKeywords(text){
  const stop = new Set(['this','that','with','from','have','which','their','about','there','these','those','into','were','been','when','where','what','your','they','also','more','than','then','some','such','will','shall','each','every']);
  const words = text.toLowerCase().match(/[a-z0-9]{4,}/g) || [];
  return [...new Set(words.filter(w=>!stop.has(w)))].slice(0,60);
}

function buildBankPrompt(topic, fmt, adpie, hyOnly, flaggedOnly, flaggedCtx, angles){
  const topicName = topic==='mixed' ? 'a mix of all perioperative/postoperative nursing topics' : (TOPICS[topic] ? TOPICS[topic].name : topic);
  const exclusion = angles.length ? ('Avoid these already-used topic angles: '+angles.slice(-20).join('; ')+'.') : '';
  let src = 'Base all questions on standard perioperative/postoperative medical-surgical nursing content (preop assessment, ASA classification, NPO rules, anesthesia types/stages, malignant hyperthermia, PACU phases, postop system assessment, VTE prevention, wound healing/dehiscence, pain management, discharge teaching).';
  if(flaggedOnly){
    src = 'CRITICAL: Every question MUST be written ONLY about the specific content below \u2014 do not write about any other topic, even a related or commonly-tested one. Source content (this is the ONLY material to draw from): """'+flaggedCtx+'"""';
  }
  return 'Generate 10 NCLEX-style nursing questions about: '+topicName+'.\n'+src+'\n'+
    'Format mix: '+fmt+'. ADPIE focus: '+adpie+'. '+(hyOnly?'Weight toward high-yield, frequently-tested content.':'')+'\n'+exclusion+'\n'+
    'CRITICAL COHERENCE RULE: stem, options, and rationale must all be about the SAME clinical situation.\n'+
    'Output ONLY a raw JSON array of 10 question objects. No markdown, no preamble.\n'+
    'Each object: {"stem":"...","options":["A. ...","B. ...","C. ...","D. ..."],"correct":0,"fmt":"mcq|scenario|sata","adpie":"...","system":"...","topic":"...","topic_angle":"5 word angle","hy":true,"rationale":{"correct":"...","explanations":{"A":"...","B":"...","C":"...","D":"..."}}}\n'+
    'SATA questions: use 5 options A-E and add "sataCorrIdx":[0,2] (integer array).';
}

async function parseBankBatch(raw){
  let cleaned = raw.replace(/^```(?:json)?[^\n]*\n?/, '').replace(/\s*```\s*$/, '').trim();
  const m = /\[\s*\{/.exec(cleaned);
  let jsonStr = cleaned;
  if(m){
    // walk brackets to find matching close
    let depth=0, start=m.index, end=-1;
    for(let i=start;i<cleaned.length;i++){
      if(cleaned[i]==='[') depth++;
      if(cleaned[i]===']'){ depth--; if(depth===0){ end=i; break; } }
    }
    jsonStr = end>-1 ? cleaned.substring(start,end+1) : cleaned.substring(start);
  }
  let parsed;
  try{ parsed = parseAIJson(jsonStr); }catch(e){ return []; }
  let arr = Array.isArray(parsed) ? parsed : [parsed];
  arr = sanitizeQuestions(arr);
  const valid = [];
  arr.forEach(q=>{
    const v = validateQuestion(q);
    if(v.ok) valid.push(q);
  });
  return valid;
}

async function topUpBank(target){
  const remaining = Math.min(150, target) - bankState.questions.length;
  if(remaining<=0) return;
  document.getElementById('bank-progress')?.remove();
  const out = document.getElementById('bank-qlist');
  const prog = document.createElement('div');
  prog.className='loadmsg'; prog.textContent='Generating remaining questions...';
  out.parentElement.insertBefore(prog, out);
  window.bankGenerationInProgress = true;
  try{
    const raw = await callAIRetry(buildBankPrompt('mixed','mixed','mixed',false,false,'',[]), 3800);
    const qs = await parseBankBatch(raw);
    qs.forEach(q=>{ q._gidx = bankState.questions.length; bankState.questions.push(q); appendBankQuestionDOM(q); });
  }catch(e){}
  window.bankGenerationInProgress = false;
  prog.remove();
}

function appendBankQuestionDOM(q){
  const list = document.getElementById('bank-qlist');
  if(!list) return;
  const div = document.createElement('div');
  div.className='qcard'; div.id='bank-q-'+q._gidx;
  div.innerHTML = renderQuestionInner(q, q._gidx, 'bank');
  list.appendChild(div);
}

// shared question renderer for both bank + ai (non-SATA simple MCQ flow)
function renderQuestionInner(q, gIdx, source){
  const isSata = !!q.sataCorrIdx;
  const fnSuffix = source==='bank' ? 'Bank' : (source==='case' ? 'Case' : 'AI');
  let optsHTML = '';
  if(isSata){
    optsHTML = q.options.map((o,i)=>`<label style="display:flex;gap:8px;align-items:center;background:var(--surf2);border:1px solid var(--bd);border-radius:4px;padding:8px 12px;margin-bottom:6px;">
      <input type="checkbox" data-gidx="${gIdx}" data-oidx="${i}"> <span>${o}</span></label>`).join('');
    optsHTML += `<button class="btn" onclick="submit${fnSuffix}SATA(${gIdx})">Submit</button>`;
  } else {
    optsHTML = q.options.map((o,i)=>`<button class="qopt" onclick="submit${fnSuffix}MCQ(${gIdx},${i},this)">${o}</button>`).join('');
  }
  return `<div class="qstem">Q${gIdx+1}. ${q.stem}${q.scenario?('<br><span style="font-weight:400;color:var(--tx2);font-size:.85rem;">'+q.scenario+'</span>'):''}</div>
    <div class="qopts">${optsHTML}</div>
    <div class="rationale-holder"></div>`;
}

function submitBankMCQ(gIdx, idx, btnEl){
  const q = bankState.questions.find(x=>x._gidx===gIdx);
  if(!q) return;
  finishMCQAnswer(q, gIdx, idx, btnEl, 'bank');
}
function submitBankSATA(gIdx){
  const q = bankState.questions.find(x=>x._gidx===gIdx);
  if(!q) return;
  finishSATAAnswer(q, gIdx, 'bank');
}

function finishMCQAnswer(q, gIdx, idx, btnEl, source){
  const card = btnEl.closest('.qcard');
  const opts = card.querySelectorAll('.qopt');
  const correct = idx === q.correct;
  opts.forEach((o,i)=>{ o.disabled=true; if(i===q.correct) o.classList.add('correct'); else if(i===idx) o.classList.add('incorrect'); });
  showRationale(card, q, correct);
  recordAnswer(q, correct, source);
  appendNextButton(card, gIdx, source);
}
function finishSATAAnswer(q, gIdx, source){
  var corrIdx = (q.sataCorrIdx || [q.correct]).map(function(v) {
    if (typeof v === 'string') {
      if (/^[A-Ea-e]$/.test(v.trim())) return v.trim().toUpperCase().charCodeAt(0) - 65;
      return parseInt(v) || 0;
    }
    return v;
  });
  const checked = Array.from(document.querySelectorAll('[data-gidx="'+gIdx+'"]:checked')).map(el=>parseInt(el.dataset.oidx));
  const correct = corrIdx.length===checked.length && corrIdx.every(i=>checked.includes(i));
  const card = document.querySelectorAll('[data-gidx="'+gIdx+'"]')[0].closest('.qcard');
  card.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.disabled=true);
  card.querySelector('button.btn').remove();
  showRationale(card, q, correct, corrIdx);
  recordAnswer(q, correct, source);
  appendNextButton(card, gIdx, source);
}

function showRationale(card, q, correct, corrIdx){
  const holder = card.querySelector('.rationale-holder');
  let expl = '';
  if(q.sataCorrIdx){
    const letters = 'ABCDE';
    expl = q.options.map((o,i)=>{
      const isC = corrIdx.indexOf(i)!==-1;
      const l = letters[i];
      return `<div class="expl" style="color:${isC?'var(--hy-g)':'var(--tx3)'}">${isC?'✅':'✗'} ${o} — ${(q.rationale.explanations[l]||'')}</div>`;
    }).join('');
  } else {
    const letters='ABCD';
    expl = Object.keys(q.rationale.explanations||{}).map(k=>`<div class="expl">${k}. ${q.rationale.explanations[k]}</div>`).join('');
  }
  holder.innerHTML = `<div class="rationale"><b>${correct?'✅ Correct':'❌ Incorrect'}</b> — ${q.rationale.correct}${expl}</div>`;
}

function recordAnswer(q, correct, source){
  const st = source==='bank' ? bankState : aiState;
  st.total = (st.total||0)+1;
  st.correct = (st.correct||0)+(correct?1:0);
  if(!correct) st.incorrect = (st.incorrect||0)+1;
  recordTaxonomy(st, q, correct);
  srsAnswer((q.topic_angle||q.stem||'q').slice(0,60), correct);
  updateDueCount();
  if(source==='ai') updateGlobalMastery(aiState.correct, aiState.total||aiState.count);
}

function appendNextButton(card, gIdx, source){
  const btn = document.createElement('button');
  btn.className='btn next-btn';
  const isLastKnown = source==='bank' ? (gIdx === bankState.questions.length-1) : true;
  btn.textContent = 'Next Question →';
  btn.onclick = ()=>{
    if(source==='bank'){
      const nextEl = document.getElementById('bank-q-'+(gIdx+1));
      if(!nextEl){
        if(window.bankGenerationInProgress){
          const msg = document.createElement('div');
          msg.className='loadmsg';
          msg.textContent = 'Still generating more questions — this will appear automatically in a moment.';
          card.appendChild(msg);
          return;
        } else {
          showBankSummary();
          return;
        }
      }
      nextEl.scrollIntoView({behavior:'smooth', block:'start'});
    } else {
      // AI mode next handled by caller-provided flow (continuous/fixed count)
      aiNextQuestion(gIdx);
    }
  };
  if(source==='bank' && bankState.questions.length>0){
    // change label if truly last & not generating
    if(gIdx===bankState.questions.length-1 && !window.bankGenerationInProgress) btn.textContent='See Results →';
  }
  card.appendChild(btn);
}

function showBankSummary(){
  const out = document.getElementById('qout-bank');
  const acc = bankState.total? Math.round(100*bankState.correct/bankState.total):0;
  const session = {
    date:new Date().toISOString(), score:bankState.correct, total:bankState.total, acc:acc,
    mode:'bank', source:'Question Bank',
    topics:bankState.topics, adpie:bankState.adpie, systems:bankState.systems, subtopics:bankState.subtopics,
    difficulty:2, flaggedOnly: !!bankState.flaggedOnly
  };
  saveSession(session);
  out.innerHTML = renderSummaryHTML(session) + '<button class="btn secondary" onclick="renderQuizModeBody()">Back to Filters</button>';
}
</script>

// ===================== AI INFINITE SHELL =====================

    <div><label class="flabel">Difficulty</label><select id="ai-diff"><option value="1">⭐ Beginner</option><option value="2" selected>⭐⭐ Moderate</option><option value="3">⭐⭐⭐ NCLEX</option><option value="4">⭐⭐⭐⭐ Advanced</option><option value="adaptive">🎯 Adaptive</option></select></div>
    <div><label class="flabel">ADPIE</label><select id="ai-adpie"><option value="mixed">Mixed</option><option value="Assessment">Assessment</option><option value="Diagnosis">Diagnosis</option><option value="Planning">Planning</option><option value="Implementation">Implementation</option><option value="Evaluation">Evaluation</option></select></div>

    <div><button class="btn" onclick="startAIQuiz()">Start Quiz</button></div>
  </div>
  <div id="qout-ai"></div>`;
}

function startAIQuiz(){
  const key = lsGet('claude_api_key');
  const out = document.getElementById('qout-ai');
  if(!key){ out.innerHTML = '<div class="emsg">Save your API key above first.</div>'; return; }
  resetAIState();
  const topic = document.getElementById('ai-topic').value;
  aiState.lastTopic = topic;
  aiState.mode='general';
  aiState.format = document.getElementById('ai-format').value;
  const diffVal = document.getElementById('ai-diff').value;
  aiState.adaptive = diffVal==='adaptive';
  aiState.difficulty = aiState.adaptive ? 2 : parseInt(diffVal);
  aiState.adpieFilter = document.getElementById('ai-adpie').value;
  const countVal = document.getElementById('ai-count').value;
  aiState.continuous = countVal==='cont';
  aiState.targetCount = aiState.continuous ? 5 : parseInt(countVal);

  let flaggedCtx = '';
  if(topic==='flagged'){
    flaggedCtx = getFlaggedContext();
    if(!flaggedCtx.trim()){ out.innerHTML = '<div class="emsg">No flagged cards found. Flag some cards with 🚩 first, then try again.</div>'; return; }
  }
  aiState.flaggedCtx = flaggedCtx;
  out.innerHTML = (aiState.adaptive?'<div class="alert blue"><div class="alert-label">Adaptive Mode</div>Difficulty adjusts based on your last 5 answers (≥80% correct → harder, &lt;50% → easier).</div>':'') +
    '<div id="ai-lmsg" class="loadmsg">🧠 Crafting clinical scenarios...</div><div id="ai-qlist"></div>';
  genAIBatch(topic, aiState.format, aiState.adpieFilter, aiState.targetCount);
}

function buildGeneralPrompt(topic, fmt, adpie, exclThis){
  const topicName = topic==='mixed' ? 'a mix of perioperative/postoperative nursing topics' : (topic==='flagged' ? 'ONLY the flagged content below' : (TOPICS[topic]?TOPICS[topic].name:topic));
  let src = topic==='flagged'
    ? 'CRITICAL: Every question MUST be written ONLY about the specific content below \u2014 do not write about any other topic. Source content (this is the ONLY material to draw from): """'+aiState.flaggedCtx+'"""'
    : 'Base the question on standard perioperative/postoperative medical-surgical nursing content.';
  return 'CRITICAL COHERENCE RULE: Write stem, scenario, options, and rationale in order. Every part must be about the SAME clinical situation.\n'+
    src+'\n'+
    'Topic: '+topicName+'. Format: '+(fmt==='mixed'?'mcq, scenario, or sata':fmt)+'. Difficulty '+aiState.difficulty+'/4. ADPIE: '+adpie+'.\n'+exclThis+'\n'+
    'Output ONLY a raw JSON object. No markdown. No preamble.\n'+
    '{"stem":"...","scenario":"...","options":["A. ...","B. ...","C. ...","D. ..."],"correct":0,"format":"...","adpie":"...","system":"...","difficulty":'+aiState.difficulty+',"topic_angle":"5 word angle","rationale":{"correct":"...","explanations":{"A":"...","B":"...","C":"...","D":"..."}}}\n'+
    'SATA: use 5 options A-E, add "sataCorrIdx":[0,2].';
}

async function genAIBatch(topic, fmt, adpie, count){
  const results = [];
  const fmtList = fmt==='mixed' ? ['mcq','scenario','sata'] : Array(count).fill(fmt);
  for(let qi=0; qi<count; qi++){
    const thisFmt = fmtList[qi % fmtList.length];
    const usedAngles = aiState.angles.concat(results.map(q=>q.topic_angle||'')).filter(Boolean);
    const exclThis = usedAngles.length ? 'Avoid these topic angles already used: '+usedAngles.slice(-12).join('; ') : '';
    const prompt = buildGeneralPrompt(topic, thisFmt, adpie, exclThis);
    const tokenLimit = aiState.difficulty>=3 ? 2000 : 1500;
    const lmsg = document.getElementById('ai-lmsg');
    if(lmsg) lmsg.textContent = 'Generating question '+(qi+1)+' of '+count+'...';
    let rawJson, r;
    try{
      r = await callAIRetry(prompt, tokenLimit);
      const rClean = r.replace(/^```(?:json)?[^\n]*\n?/, '').replace(/\s*```\s*$/, '').trim();
      const os = rClean.indexOf('{'), oe = rClean.lastIndexOf('}');
      if(os===-1 || oe===-1){ continue; }
      rawJson = rClean.substring(os, oe+1);
      let q = parseAIJson(rawJson);
      const sq = sanitizeQuestions([q]);
      if(!sq.length) continue;
      q = sq[0];
      const vcheck = validateQuestion(q);
      if(vcheck.ok){
        results.push(q);
        if(q.topic_angle) aiState.angles.push(q.topic_angle);
      } else {
        try{
          const retryPrompt = 'Generate ONE NCLEX nursing question about '+topic+' ('+thisFmt+' format). IMPORTANT: stem/options/rationale must be about the SAME topic. Return raw JSON object only.\n{"stem":"?","scenario":"","options":["A. text","B. text","C. text","D. text"],"correct":0,"format":"'+thisFmt+'","adpie":"'+adpie+'","system":"","difficulty":'+aiState.difficulty+',"topic_angle":"angle","rationale":{"correct":"why","explanations":{"A":"a","B":"b","C":"c","D":"d"}}}';
          const r3 = await callAI(retryPrompt, 1200);
          const q3 = parseAIJson(r3.substring(r3.indexOf('{'), r3.lastIndexOf('}')+1));
          const sq3 = sanitizeQuestions([q3]);
          if(sq3.length && validateQuestion(sq3[0]).ok){ results.push(sq3[0]); if(sq3[0].topic_angle) aiState.angles.push(sq3[0].topic_angle); }
        }catch(re2){}
      }
    }catch(e){ continue; }
  }
  const lmsg = document.getElementById('ai-lmsg'); if(lmsg) lmsg.remove();
  if(results.length===0){
    document.getElementById('qout-ai').innerHTML += '<div class="emsg">Could not generate any questions. Please retry.</div><button class="rtybtn btn secondary" onclick="startAIQuiz()">🔄 Retry</button>';
    return;
  }
  renderAIQuestions(results);
}

function renderAIQuestions(results){
  aiState.questions = aiState.questions.concat(results);
  const list = document.getElementById('ai-qlist');
  results.forEach(q=>{
    const gIdx = aiState.count++;
    const div = document.createElement('div');
    div.className='qcard'; div.id='ai-q-'+gIdx;
    div.innerHTML = renderQuestionInner(q, gIdx, 'ai');
    list.appendChild(div);
  });
  if(aiState.continuous){
    const ctrl = document.createElement('div');
    ctrl.id='ai-cont-controls';
    ctrl.innerHTML = '<button class="btn" onclick="contMore()">✨ Generate Next Set</button> <button class="btn secondary" onclick="finishContinuous()">✅ Done — Save & Finish</button>';
    list.appendChild(ctrl);
  }
}

async function contMore(){
  document.getElementById('ai-cont-controls')?.remove();
  const lmsg = document.createElement('div'); lmsg.className='loadmsg'; lmsg.id='ai-lmsg'; lmsg.textContent='✨ Generating fresh questions...';
  document.getElementById('ai-qlist').appendChild(lmsg);
  await genAIBatch(aiState.lastTopic, aiState.format, aiState.adpieFilter, 5);
}

function finishContinuous(){
  document.getElementById('ai-cont-controls')?.remove();
  showAISummary();
}

function submitAIMCQ(gIdx, idx, btnEl){
  const q = aiState.questions[gIdx];
  if(!q){ console.error('No question at gIdx', gIdx); return; }
  finishMCQAnswer(q, gIdx, idx, btnEl, 'ai');
  maybeAdapt();
  maybeShowAIEndButton();
}
function submitAISATA(gIdx){
  const q = aiState.questions[gIdx];
  if (!q) { console.error('No question at gIdx', gIdx, '(total:', aiState.questions.length, ')'); return; }
  finishSATAAnswer(q, gIdx, 'ai');
  maybeAdapt();
  maybeShowAIEndButton();
}
function maybeAdapt(){
  if(!aiState.adaptive) return;
  // adapt based on last 5 answered (approximate using aggregate for simplicity)
  const t = aiState.total||0, c = aiState.correct||0;
  if(t>=5){
    const rate = c/t;
    if(rate>=0.8) aiState.difficulty = Math.min(4, aiState.difficulty+1);
    else if(rate<0.5) aiState.difficulty = Math.max(1, aiState.difficulty-1);
  }
}
function aiNextQuestion(gIdx){
  // for fixed-count mode: if more questions already rendered, just scroll; else show summary
  const nextEl = document.getElementById('ai-q-'+(gIdx+1));
  if(nextEl){ nextEl.scrollIntoView({behavior:'smooth'}); return; }
  if(!aiState.continuous) showAISummary();
}
function maybeShowAIEndButton(){
  if(aiState.continuous) return;
  if(aiState.count >= aiState.targetCount && !document.getElementById('ai-final-summary-btn')){
    const list = document.getElementById('ai-qlist');
    // handled by Next button already leading to summary on last question
  }
}

function showAISummary(){
  const out = document.getElementById('qout-ai');
  const total = aiState.total||0, correct = aiState.correct||0;
  const acc = total? Math.round(100*correct/total):0;
  const session = {
    date:new Date().toISOString(), score:correct, total:total, acc:acc,
    mode:'ai', source:'AI Infinite',
    topics:aiState.topics, adpie:aiState.adpie, systems:aiState.systems, subtopics:aiState.subtopics,
    difficulty:aiState.difficulty, flaggedOnly:(aiState.lastTopic==='flagged')
  };
  saveSession(session);
  out.innerHTML += renderSummaryHTML(session) + '<button class="btn secondary" onclick="renderQuizModeBody()">Back to Filters</button>';

const MED_FOCUS_PROMPTS = {
  mixed:'Cover a mix of mechanism, side effects, nursing actions, contraindications, and monitoring.',
  moa:'Focus specifically on mechanism of action.',
  se:'Focus specifically on side effects and toxicity.',
  nursing:'Focus specifically on nursing actions and patient teaching.',

function medDrillFiltersHTML(){

  classes.forEach(cls=>{

    <div><label class="flabel">Format</label><select id="md-format"><option value="mixed">Mixed</option><option value="mcq">MCQ</option><option value="scenario">Scenario</option><option value="sata">SATA</option></select></div>
    <div><label class="flabel"># Qs</label><select id="md-count"><option value="3">3</option><option value="5" selected>5</option><option value="10">10</option></select></div>

async function startMedDrill(){
  const key = lsGet('claude_api_key');
  const out = document.getElementById('qout-ai');
  if(!key){ out.innerHTML = '<div class="emsg">Save your API key above first.</div>'; return; }
  resetAIState();
  aiState.mode='meddrill';
  let drugKey = document.getElementById('md-drug').value;
  if(drugKey==='__random__') drugKey = DRUGS[Math.floor(Math.random()*DRUGS.length)].id;
  const drug = DRUGS.find(d=>d.id===drugKey) || DRUGS[0];
  const focus = document.getElementById('md-focus').value;
  const diff = parseInt(document.getElementById('md-diff').value);
  const fmt = document.getElementById('md-format').value;
  const count = parseInt(document.getElementById('md-count').value);
  aiState.difficulty = diff;
  aiState.lastTopic = drug.name;
  aiState.targetCount = count;
  aiState.continuous = false;
  out.innerHTML = '<div class="loadmsg" id="ai-lmsg">🧠 Crafting clinical scenarios...</div><div id="ai-qlist"></div>';
  const tokenLimit = diff===1?1200:(diff===2?1800:2500);
  const results = [];
  for(let i=0;i<count;i++){
    const thisFmt = fmt==='mixed' ? ['mcq','scenario','sata'][i%3] : fmt;
    const lmsg = document.getElementById('ai-lmsg'); if(lmsg) lmsg.textContent='Generating question '+(i+1)+' of '+count+'...';
    const diffInstr = diff===1?'Simple recall of a single fact.':diff===2?'Application to a brief clinical scenario.':diff===3?'Analysis requiring synthesis of multiple facts about '+drug.name+'.':'Expert-level, requires prioritization/discrimination between close options for '+drug.name+'.';
    const prompt = 'DRUG: '+drug.name+'\nKEY FACTS: MOA: '+drug.moa+' Indications: '+drug.ind+' Contraindications: '+drug.contra+' Dose: '+drug.dose+' Monitoring: '+drug.mon+' Side effects: '+drug.se+' Nursing: '+drug.nurs+' Antidote: '+drug.ant+'\n'+
      'FOCUS: '+MED_FOCUS_PROMPTS[focus]+'\nDIFFICULTY '+diff+'/4: '+diffInstr+'\nABSOLUTE RULE: Every part of this question is ONLY about '+drug.name+'.\nFormat: '+thisFmt+'.\n'+
      'Output ONLY a raw JSON object: {"stem":"...","options":["A. ...","B. ...","C. ...","D. ..."],"correct":0,"format":"'+thisFmt+'","adpie":"","system":"","difficulty":'+diff+',"topic_angle":"'+drug.name+' angle","rationale":{"correct":"...","explanations":{"A":"...","B":"...","C":"...","D":"..."}}}. SATA: 5 options A-E + "sataCorrIdx":[..].';
    try{
      const r = await callAIRetry(prompt, tokenLimit);
      const rClean = r.replace(/^```(?:json)?[^\n]*\n?/, '').replace(/\s*```\s*$/, '').trim();
      const os=rClean.indexOf('{'), oe=rClean.lastIndexOf('}');
      if(os===-1||oe===-1) continue;
      let q = parseAIJson(rClean.substring(os,oe+1));
      const sq = sanitizeQuestions([q]);
      if(!sq.length) continue;
      q = sq[0];
      const drugWords = drug.name.toLowerCase().split(/\s+/).filter(w=>w.length>3);
      const hasDrugName = drugWords.some(w=>(q.stem||'').toLowerCase().includes(w));
      if(!hasDrugName){
        try{
          const rp = prompt + '\nIMPORTANT: the drug name "'+drug.name+'" MUST appear explicitly in the stem text.';
          const r2 = await callAI(rp, tokenLimit);
          const r2c = r2.replace(/^```(?:json)?[^\n]*\n?/, '').replace(/\s*```\s*$/, '').trim();
          const q2 = parseAIJson(r2c.substring(r2c.indexOf('{'), r2c.lastIndexOf('}')+1));
          const sq2 = sanitizeQuestions([q2]);
          if(sq2.length) results.push(sq2[0]); 
        }catch(re){}
      } else {
        results.push(q);
      }
    }catch(e){ continue; }
  }
  document.getElementById('ai-lmsg')?.remove();
  if(results.length===0){ out.innerHTML += '<div class="emsg">Could not generate any questions. Please retry.</div>'; return; }
  renderAIQuestions(results);
}

<script>

let caseState = {};
function renderCaseSimTab(){
  const panel = document.getElementById('tab-casesim');
  const topicOpts = Object.keys(TOPICS).map(k=>`<option value="${k}">${TOPICS[k].name}</option>`).join('');
  panel.innerHTML = `<h2>🏥 Case Sim — NGN Unfolding Case</h2>
  <div id="case-key-status">${apiKeyPanelHTML()}</div>

    <div><label class="flabel">Topic</label><select id="case-topic"><option value="mixed">Mixed</option>${topicOpts}</select></div>
    <div><label class="flabel">Length</label><select id="case-len"><option value="5">5 Questions</option><option value="8">8 Questions</option></select></div>
    <div><label class="flabel">Difficulty</label><select id="case-diff"><option value="2">⭐⭐</option><option value="3" selected>⭐⭐⭐</option><option value="4">⭐⭐⭐⭐</option></select></div>
    <div><button class="btn" onclick="startCaseSim()">Generate Case</button></div>
  </div>
  <div id="case-output"></div>`;
}

async function startCaseSim(){
  const key = lsGet('claude_api_key');
  const out = document.getElementById('case-output');
  if(!key){ out.innerHTML = '<div class="emsg">Save your API key above first.</div>'; return; }
  const topic = document.getElementById('case-topic').value;
  const len = parseInt(document.getElementById('case-len').value);
  const diff = parseInt(document.getElementById('case-diff').value);
  const topicName = topic==='mixed' ? 'a perioperative or postoperative surgical scenario' : TOPICS[topic].name;
  caseState = {topic:topicName, len, diff, questions:[], idx:0, score:0, total:0};
  out.innerHTML = '<div class="loadmsg">📋 Writing NCLEX-style distractors...</div>';
  const patientPrompt = 'Create a realistic patient case for an NGN unfolding nursing case study about: '+topicName+' (surgical/perioperative nursing). Output ONLY a raw JSON object: {"name":"...","age":00,"chief_complaint":"...","history":"...","vitals":"...","labs":"..."}. No markdown.';
  let rawJson, r;
  try{
    r = await callAIRetry(patientPrompt, 400);
    const os=r.indexOf('{'), oe=r.lastIndexOf('}');
    rawJson = r.substring(os,oe+1);
    const patient = parseAIJson(rawJson);
    caseState.patient = patient;
    renderCasePatientCard();
  }catch(e){
    out.innerHTML = '<div class="emsg">Could not generate the patient. '+e.message+'</div><button class="btn secondary" onclick="startCaseSim()">🔄 Retry</button>';
    return;
  }
  document.getElementById('case-qs').innerHTML = '<div class="spinner"></div>';
  const qPrompt = 'Based on this patient: '+JSON.stringify(caseState.patient)+', generate '+len+' sequential NGN-style unfolding case questions about '+topicName+' at difficulty '+diff+'/4, each covering a different ADPIE phase in order where possible. Output ONLY a raw JSON array. Each item: {"patient_update":"short update or empty string for Q1","stem":"...","options":["A. ...","B. ...","C. ...","D. ..."],"correct":0,"adpie":"...","rationale":{"correct":"...","explanations":{"A":"...","B":"...","C":"...","D":"..."}}}';
  try{
    const r2 = await callAIRetry(qPrompt, 4000);
    let cleaned = r2.replace(/^```(?:json)?[^\n]*\n?/, '').replace(/\s*```\s*$/, '').trim();
    const m = /\[\s*\{/.exec(cleaned);
    let jsonStr = cleaned;
    if(m){
      let depth=0,start=m.index,end=-1;
      for(let i=start;i<cleaned.length;i++){ if(cleaned[i]==='[')depth++; if(cleaned[i]===']'){depth--; if(depth===0){end=i;break;}} }
      jsonStr = end>-1 ? cleaned.substring(start,end+1) : cleaned.substring(start);
    }
    let arr = parseAIJson(jsonStr);
    if(!Array.isArray(arr)) arr=[arr];
    arr = sanitizeQuestions(arr);
    caseState.questions = arr;
    renderCaseQ(0);
  }catch(e2){
    document.getElementById('case-qs').innerHTML = '<div class="emsg">Could not generate the case questions. '+e2.message+'</div><button class="btn secondary" onclick="startCaseSim()">🔄 Retry</button>';
  }
}

function renderCasePatientCard(){
  const p = caseState.patient;
  const out = document.getElementById('case-output');
  out.innerHTML = `<div class="patientcard">
    <h3 style="color:#fff;">${p.name||'Patient'}, ${p.age||'?'}</h3>
    <p><b>Chief Complaint:</b> ${p.chief_complaint||''}</p>
    <p><b>History:</b> ${p.history||''}</p>
    <p><b>Vitals:</b> ${p.vitals||''}</p>
    <p><b>Labs:</b> ${p.labs||''}</p>
  </div>
  <div class="adpiebar" id="case-adpiebar"></div>
  <div id="case-qs"></div>`;
}

function renderCaseQ(idx){
  const q = caseState.questions[idx];
  const qsDiv = document.getElementById('case-qs');
  if(!q){
    const acc = caseState.total? Math.round(100*caseState.score/caseState.total):0;
    qsDiv.innerHTML = `<div class="rationale"><h3>Case Complete</h3><p>Score: ${caseState.score}/${caseState.total} (${acc}%)</p></div>`;
    saveSession({date:new Date().toISOString(), score:caseState.score, total:caseState.total, acc:acc, mode:'case', source:'Case Sim', topics:{}, adpie:{}, systems:{}, subtopics:{}, difficulty:caseState.diff, flaggedOnly:false});
    return;
  }
  const adpiePhases = ['Assessment','Diagnosis','Planning','Implementation','Evaluation'];
  const bar = document.getElementById('case-adpiebar');
  if(bar){
    bar.innerHTML = adpiePhases.map((p,i)=>`<span class="adpiestep ${i<idx?'done':(i===idx?'active':'')}">${p}</span>`).join('');
  }
  const updateHTML = q.patient_update ? `<div class="patientupdate">📋 Update: ${q.patient_update}</div>` : '';
  const div = document.createElement('div');
  div.className='qcard';
  div.innerHTML = updateHTML + renderQuestionInner(q, idx, 'case');
  qsDiv.innerHTML='';
  qsDiv.appendChild(div);
}
function submitCaseMCQ(gIdx, idx, btnEl){
  const q = caseState.questions[gIdx];
  const correct = idx===q.correct;
  const card = btnEl.closest('.qcard');
  card.querySelectorAll('.qopt').forEach((o,i)=>{ o.disabled=true; if(i===q.correct)o.classList.add('correct'); else if(i===idx)o.classList.add('incorrect'); });
  showRationale(card, q, correct);
  caseState.total++; if(correct) caseState.score++;
  const btn=document.createElement('button'); btn.className='btn next-btn';
  btn.textContent = (gIdx===caseState.questions.length-1)?'See Results →':'Next Phase →';
  btn.onclick = ()=>renderCaseQ(gIdx+1);
  card.appendChild(btn);
}
</script>
<script>

  let streak = 0;
  let d = new Date();
  while(days.has(d.toDateString())){ streak++; d.setDate(d.getDate()-1); }
  const dueCount = updateDueCount();
  const flaggedCount = flaggedCards.length;

  let html = '';
  if(dueCount>0){
    html += `<div class="srsbanner"><span>📅 ${dueCount} card${dueCount!==1?'s':''} due for review</span><button class="btn" onclick="const b=document.querySelector('.tabbtn[data-tabid=\\'quiz\\']'); showTab('quiz', b); setTimeout(()=>{switchQuizMode('ai');},50);">Start SRS Review →</button></div>`;
  }

  html += `<div class="stat-grid">
    <div class="stat-card"><div class="num">${overallMastery}%</div><div class="lbl">Overall Mastery</div></div>
    <div class="stat-card"><div class="num">🔥 ${streak}</div><div class="lbl">Study Streak (days)</div></div>
    <div class="stat-card"><div class="num">${dueCount}</div><div class="lbl">SRS Due</div></div>
    <div class="stat-card"><div class="num">${flaggedCount}</div><div class="lbl">Flagged Items</div></div>
  </div>`;

  // aggregate topic/adpie/system mastery
  const topicAgg = {}, adpieAgg = {}, sysAgg = {}, subAgg = {};
  sessions.forEach(s=>{
    aggMerge(topicAgg, s.topics);
    aggMerge(adpieAgg, s.adpie);
    aggMerge(sysAgg, s.systems);
    if(s.subtopics){
      Object.keys(s.subtopics).forEach(k=>{
        const v = s.subtopics[k];
        if(!subAgg[k]) subAgg[k] = {c:0,t:0,topic:v.topic||'General',examples:[]};
        subAgg[k].c += v.c||0; subAgg[k].t += v.t||0;
        (v.examples||[]).forEach(ex=>{ subAgg[k].examples.push(ex); if(subAgg[k].examples.length>2) subAgg[k].examples.shift(); });
      });
    }
  });

  html += '<h3>Topic Mastery</h3>' + renderMasteryBars(topicAgg);
  html += '<h3>ADPIE Phase Mastery</h3>' + renderMasteryBars(adpieAgg);
  html += '<h3>Body System Mastery</h3>' + renderMasteryBars(sysAgg);

  // subtopic weakness
  const weakEntries = Object.keys(subAgg).map(k=>({key:k, ...subAgg[k], acc: subAgg[k].t? Math.round(100*subAgg[k].c/subAgg[k].t):0}))
    .filter(e=>e.t>=1 && e.acc<75);
  const groupedByTopic = {};
  weakEntries.forEach(e=>{
    const tk = e.topic||'General';
    if(!groupedByTopic[tk]) groupedByTopic[tk]=[];
    groupedByTopic[tk].push(e);
  });
  html += '<h3>🎯 Where You Need Work — By Topic</h3>';
  const topicKeys = Object.keys(groupedByTopic);
  if(topicKeys.length===0){ html += '<p style="color:var(--tx3)">No weak subtopics identified yet — keep quizzing!</p>'; }
  else {
    topicKeys.forEach(tk=>{
      html += `<div class="weaksec"><b>${topicLabel(tk)}</b>`;
      groupedByTopic[tk].forEach(e=>{
        const badge = e.acc<50 ? 'Needs urgent review' : (e.acc<65 ? 'Needs practice' : 'Getting there');
        html += `<div style="margin-top:6px;font-size:.82rem;">
          <span class="weakbadge">${e.acc}%</span> ${e.key} <span style="color:var(--tx3)">(${e.t} attempt${e.t!==1?'s':''})</span> — <span class="weakbadge" style="border-color:${e.acc<50?'var(--hy-r)':'var(--hy-a)'};color:${e.acc<50?'var(--hy-r)':'var(--hy-a)'}">${badge}</span>
          ${e.examples[0]?('<div style="color:var(--tx3);margin-top:2px;">e.g. "'+e.examples[0]+'"</div>'):''}
        </div>`;
      });
      html += `<div style="margin-top:8px;color:var(--tx2);font-size:.78rem;">Next steps: re-quiz this topic via 🧠 Quiz Me → ✨ AI Infinite, or use the 🚩 Flagged filter.</div></div>`;
    });
  }

  // recent sessions table
  html += '<h3>Recent Quiz Sessions</h3>';
  const recent = sessions.slice(-8).reverse();
  if(recent.length===0){ html += '<p style="color:var(--tx3)">No quiz sessions yet.</p>'; }
  else {
    html += '<table class="sesstable"><tr><th></th><th>Source</th><th>Date</th><th>Score</th><th>Acc%</th><th>Diff</th><th></th></tr>';
    recent.forEach(s=>{
      const icon = s.mode==='bank'?'📚':s.mode==='ai'?'✨':s.mode==='case'?'🏥':'∞';
      html += `<tr><td>${icon}</td><td>${s.source}</td><td>${new Date(s.date).toLocaleDateString()}</td><td>${s.score}/${s.total}</td><td>${s.acc}%</td><td>${'⭐'.repeat(s.difficulty||1)}</td><td>${s.flaggedOnly?'🚩':''}</td></tr>`;
    });
    html += '</table>';
  }

  html += '<h3>Data Portability</h3><div id="dash-export-import"></div>';
  html += '<div id="dash-clear-holder" style="margin-top:20px;"></div>';

  el.innerHTML = html;

  // export/import controls
  const ei = document.getElementById('dash-export-import');
  const expBtn = document.createElement('button');
  expBtn.className='btn secondary'; expBtn.textContent='⬇ Export Data'; expBtn.onclick = exportData;
  const impBtn = document.createElement('button');
  impBtn.className='btn secondary'; impBtn.style.marginLeft='8px'; impBtn.textContent='⬆ Import Data';
  const impInput = document.createElement('input');
  impInput.type='file'; impInput.accept='.json'; impInput.style.display='none';
  impInput.onchange = importDataFile;
  impBtn.onclick = ()=>impInput.click();
  ei.appendChild(expBtn); ei.appendChild(impBtn); ei.appendChild(impInput);

  // clear history button (DOM-created, appended after innerHTML set)
  const clearHolder = document.getElementById('dash-clear-holder');
  const clearBtn = document.createElement('button');
  clearBtn.className='btn danger';
  clearBtn.textContent='Clear History';
  clearBtn.onclick = ()=>{
    clearHolder.innerHTML='';
    const panel = document.createElement('div');
    panel.style.cssText='border-left:2px solid var(--hy-r);background:rgba(179,38,30,.06);padding:12px;border-radius:4px;';
    panel.innerHTML = '<p style="margin:0 0 8px;">This will permanently delete all quiz history, flags, and SRS progress. Continue?</p>';
    const yesBtn=document.createElement('button'); yesBtn.className='btn danger'; yesBtn.textContent='Yes, Clear All';
    const noBtn=document.createElement('button'); noBtn.className='btn secondary'; noBtn.style.marginLeft='8px'; noBtn.textContent='Cancel';
    yesBtn.onclick = ()=>{
      saveJSON('quiz_sessions', []); saveJSON('flaggedCards', []); saveJSON('srs_data', {}); saveJSON('last_viewed', {});
      flaggedCards=[]; srsData={}; lastViewed={};
      renderDash(); updateDueCount(); updateGlobalMasteryFromStorageOnly();
    };
    noBtn.onclick = ()=>renderDash();
    panel.appendChild(yesBtn); panel.appendChild(noBtn);
    clearHolder.appendChild(panel);
  };
  clearHolder.appendChild(clearBtn);

  updateGlobalMasteryFromStorageOnly();
}

function aggMerge(target, src){
  if(!src) return;
  Object.keys(src).forEach(k=>{
    if(!target[k]) target[k]={c:0,t:0};
    target[k].c += src[k].c||0; target[k].t += src[k].t||0;
  });
}
function renderMasteryBars(agg){
  const entries = Object.keys(agg).map(k=>({k, p: agg[k].t? Math.round(100*agg[k].c/agg[k].t):0}));
  entries.sort((a,b)=>a.p-b.p);
  if(entries.length===0) return '<p style="color:var(--tx3)">No data yet.</p>';
  return entries.map(e=>{
    const color = e.p>=80?'var(--hy-g)':e.p>=60?'var(--hy-a)':'var(--hy-r)';
    return `<div class="mbar-row"><div class="mbar-label"><span>${topicLabel(e.k)}</span><span>${e.p}%</span></div><div class="mbar-track"><div class="mbar-fill" style="width:${e.p}%;background:${color}"></div></div></div>`;
  }).join('');
}

// ===================== EXPORT / IMPORT =====================
function exportData(){
  const payload = {
    quiz_sessions: loadJSON('quiz_sessions', []),
    flaggedCards: loadJSON('flaggedCards', []),
    srs_data: loadJSON('srs_data', {}),
    last_viewed: loadJSON('last_viewed', {})
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'periop-study-data.json';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function importDataFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const payload = JSON.parse(reader.result);
      if(payload.quiz_sessions) saveJSON('quiz_sessions', payload.quiz_sessions);
      if(payload.flaggedCards){ saveJSON('flaggedCards', payload.flaggedCards); flaggedCards = payload.flaggedCards; }
      if(payload.srs_data){ saveJSON('srs_data', payload.srs_data); srsData = payload.srs_data; }
      if(payload.last_viewed){ saveJSON('last_viewed', payload.last_viewed); lastViewed = payload.last_viewed; }
      renderDash(); updateDueCount(); updateGlobalMasteryFromStorageOnly();
      alert('Data imported successfully.');
    }catch(err){ alert('Could not read this file — make sure it is a valid exported JSON file.'); }
  };
  reader.readAsText(file);
}
</script>

}

if(document.readyState==='loading'){

} else {

}
</script>
